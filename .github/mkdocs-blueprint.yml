# The settings of the documentation website that the blueprint keeps current. The
# mkdocs.yml of the repository inherits them (INHERIT) and adds its name, its pages
# and what only it needs; a setting there wins over the same one here, and plugins
# and Markdown extensions merge by name. https://github.com/Dennis-Otto/repo-blueprint
# https://squidfunk.github.io/mkdocs-material/

# Every page is a file next to the others, as on GitHub, so that a relative path in
# HTML, such as <img src="images/card.png">, leads to the same file in both places.
use_directory_urls: false
# The pencil on every page opens it for editing on GitHub.
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  # Light or dark, as the reader's system prefers, with a switch in the header.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # No instant loading of pages: with it, the language switch would keep leading to
  # the page that was loaded first.
  features:
    - navigation.tracking
    # The sections of the menu as tabs in the header, and the path above a page.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - content.tooltips

plugins:
  search: {}
  # Fonts, scripts and pictures from other servers are downloaded when the website
  # is built and served with it, so that reading a page asks no other server.
  privacy: {}
  # A preview card of every page, which shows where a link to it is shared.
  social: {}
  # A picture opens enlarged with a click.
  glightbox: {}
  # The pages of other languages, such as index.de.md beside index.md. A website in
  # more than one language turns it on with its languages in mkdocs.yml; it comes
  # before the dates, which take the language of a page from it.
  i18n:
    enabled: false
    docs_structure: suffix
  # The date of the last change of a page, from the history of git.
  git-revision-date-localized:
    type: date
    fallback_to_build_date: true
    # Without the history of git, such as in a preview, the date of the build.
    strict: false

# Markdown as GitHub shows it, so that every page reads the same on github.com.
markdown_extensions:
  abbr: {}
  admonition: {}
  attr_list: {}
  footnotes: {}
  md_in_html: {}
  tables: {}
  toc:
    permalink: true
    # Anchors as GitHub makes them, so that links to a heading work in both places.
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
  pymdownx.details: {}
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  pymdownx.highlight: {}
  pymdownx.inlinehilite: {}
  pymdownx.magiclink: {}
  # A page may include a file of the repository, such as the line
  # --8<-- "CHANGELOG.md", so that nothing is written twice.
  pymdownx.snippets:
    check_paths: true
  # Diagrams in ```mermaid blocks, as GitHub draws them.
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  # Tabs on a page, such as one per operating system.
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.tasklist:
    custom_checkbox: true
  pymdownx.tilde: {}

# A link or an anchor that leads nowhere fails the build. A page outside the menu
# is still on the website, so that a page that the blueprint brings, such as a
# decision record, fails nothing.
validation:
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
