# The settings of the documentation website that the blueprint keeps current. The
# mkdocs.yml of the repository inherits them (INHERIT) and adds its name, its pages
# and what only it needs; a setting there wins over the same one here, and plugins
# and Markdown extensions merge by name. https://github.com/Dennis-Otto/repo-blueprint
# https://squidfunk.github.io/mkdocs-material/

# Every page is a file next to the others, as on GitHub, so that a relative path in
# HTML, such as <img src="images/card.png">, leads to the same file in both places.
use_directory_urls: false
# The pencil on every page opens it for editing on GitHub.
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  # Light or dark, as the reader's system prefers, also after it changes, until the
  # reader picks one with the switch in the header: from the system's scheme to
  # light, to dark and back.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to the scheme of the system
  # No instant loading of pages: with it, the language switch would keep leading to
  # the page that was loaded first.
  features:
    - navigation.tracking
    # The sections of the menu as tabs in the header, and the path above a page.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - content.tooltips

plugins:
  search: {}
  # Fonts, scripts and pictures from other servers are downloaded when the website
  # is built and served with it, so that reading a page asks no other server. The
  # link to the repository in the header shows the version of the latest release,
  # which the hooks read from git at the build, so the reader's browser no longer
  # asks the API of GitHub for the numbers of the repository; the badges of a
  # README, which would show their state at the time of the build, stay on GitHub.
  privacy: {}
  # A preview card of every page, which shows where a link to it is shared. The cards
  # are drawn with the Cairo library, which Windows doesn't have, so only the CI
  # makes them: GitHub's runners set CI to true. A preview on your computer, and
  # scripts/check.sh, build the website without them.
  social:
    enabled: !ENV [CI, false]
  # A picture opens enlarged with a click, among those of the reader's scheme: a
  # picture for one scheme alone, NAME.png#only-light or #only-dark, is in the
  # gallery of that scheme.
  glightbox:
    auto_themed: true
  # The pages of other languages, such as index.de.md beside index.md. A website in
  # more than one language turns it on with its languages in mkdocs.yml; it comes
  # before the dates, which take the language of a page from it. The hooks give the
  # search of each language an index of its own, without the pages that a further
  # language shows untranslated; the plugin's own removal of the entries that look
  # like those of the default language would take a translated page out of the
  # index and leave its sections without it.
  i18n:
    enabled: false
    docs_structure: suffix
    reconfigure_search: false
  # The date of the last change of a page, from the history of git.
  git-revision-date-localized:
    type: date
    fallback_to_build_date: true
    # Without the history of git, such as in a preview, the date of the build.
    strict: false

# Markdown as GitHub shows it, so that every page reads the same on github.com.
markdown_extensions:
  abbr: {}
  admonition: {}
  attr_list: {}
  footnotes: {}
  md_in_html: {}
  tables: {}
  toc:
    permalink: true
    # Anchors as GitHub makes them, so that links to a heading work in both places.
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
  pymdownx.details: {}
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  pymdownx.highlight: {}
  pymdownx.inlinehilite: {}
  pymdownx.magiclink: {}
  # A page may include a file of the repository, such as the line
  # --8<-- "CHANGELOG.md", so that nothing is written twice.
  pymdownx.snippets:
    check_paths: true
  # The live diagrams of the website: the hook in .github/mkdocs_blueprint.py puts
  # the Mermaid source of docs/diagrams/ in place of each picture of a diagram, and
  # Material draws it in the colors of its theme.
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  # Tabs on a page, such as one per operating system.
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.tasklist:
    custom_checkbox: true
  pymdownx.tilde: {}

# What the plugins leave to do, such as the sitemap in every folder and a second
# try of a download that fails, and the pictures, the stylesheet and the script that
# make every page accessible and quick to load. A project with hooks of its own lists
# this file there too: its list replaces this one.
hooks:
  - .github/mkdocs_blueprint.py

# A link or an anchor that leads nowhere fails the build. A page outside the menu
# is still on the website, so that a page that the blueprint brings, such as a
# decision record, fails nothing.
validation:
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The footer of every page leads to the owner of the repository: the hooks give it
# the links to their profile on GitHub, to their website with all of their projects,
# for a website under it, and to GitHub Sponsors, when .github/FUNDING.yml names an
# account. A list extra.social in mkdocs.yml takes the place of these, since INHERIT
# replaces lists, and an empty one, [], shows none.
extra:
  generator: false
