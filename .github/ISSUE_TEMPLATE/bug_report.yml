name: Bug report
description: Something in Paperless Unified Search does not work as documented.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Within a few minutes, an AI issue assistant posts a first analysis and may ask questions; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/paperless-unified-search/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **Never post** the Paperless API token, credentials, private URLs, document contents or other personal data. Report a vulnerability privately, as described in [SECURITY.md](https://github.com/Dennis-Otto/paperless-unified-search/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Nextcloud's global search
        2. Search for ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Administration settings or connection test
        - Search results
        - Matching synchronized files
        - Opening a result in the browser or the mobile apps
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "0.1.10"
    validations:
      required: true
  - type: input
    id: nextcloud_version
    attributes:
      label: Nextcloud version
      description: Administration settings → Overview.
      placeholder: "34.0.4"
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: "8.3"
  - type: input
    id: paperless_version
    attributes:
      label: Paperless-ngx version
      placeholder: "2.18.0"
  - type: dropdown
    id: search_mode
    attributes:
      label: How does the search reach Paperless?
      options:
        - Search connected services (switch in the search)
        - Trusted-service option (always included)
        - I don't know
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Relevant lines of the Nextcloud log (Administration settings → Logging), without tokens and private URLs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed tokens, private URLs and personal data from everything I posted.
          required: true
