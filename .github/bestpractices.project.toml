# The answers of OpenSSF Best Practices (https://www.bestpractices.dev) that only this
# repository can give, on top of .bestpractices.json, which the blueprint keeps current
# with what it guarantees for every repository of its kind. Never change that file: an
# answer of this repository alone goes here, and no update of the blueprint touches it.
#
# One table for each criterion, named as in .bestpractices.json, such as [test] or
# [osps_br_07_01]. For a criterion that .bestpractices.json answers, a table gives only
# its justification, which replaces the file's own: the status stays the blueprint's
# Met. For any other criterion, such as security_review, a table gives status (Met,
# Unmet or N/A) and justification. A link names a file or a heading of this repository,
# or uses https. Only what is true of this repository belongs here, such as its own
# end-to-end tests:
#
# [test]
# justification = "pytest, and the end-to-end tests in Docker: https://github.com/OWNER/REPOSITORY/blob/main/tests/e2e/run.sh"
#
# [security_review]
# status = "Met"
# justification = "..."
#
# The weekly run of the workflow Links compares the public entry with both files and
# keeps an issue with the links of the edit pages that take the answers in: change an
# answer here, not on the site, as these links force it back. "Save (and continue)" on
# bestpractices.dev reads .bestpractices.json only. The step "Answers for
# bestpractices.dev" of scripts/check.sh checks this file with
# python3 .github/blueprint.py best-practices --verify.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/bots.md#the-entry-on-bestpracticesdev

[automated_integration_testing]
justification = "The CI runs scripts/check.sh with the whole test suite, which fails when a line of lib/ runs in no test, on every pull request and after every change of main, and reports its success or failure as a required check; beside it, the required check nextcloud of the workflow Docker E2E runs the end-to-end tests in Docker, with a mock of Paperless-ngx and the settings and the search dialog in Chromium, against every Nextcloud version from min-version to max-version of appinfo/info.xml at the same time, and the upgrade from the last release to the checkout, in every pull request and after every change of main that changes a file they cover, and every Monday against the newest release of each version; the required checks paperless (2) and paperless (3) check the contract of the app with a real Paperless-ngx 2 and 3 in every pull request that changes the app or the mock of Paperless, and every Monday: https://github.com/Dennis-Otto/paperless-unified-search/blob/main/tests/e2e/README.md#in-the-ci"

[updateable_reused_components]
justification = "At run time the app needs only PHP and the APIs of Nextcloud, as composer.json requires nothing else, and no code of a third party is copied into the repository; the package of the app leaves vendor/ and composer.json out, as .nextcloudignore says, so it ships no package of Composer; the tools come from Composer, pinned in composer.lock, and those of the end-to-end tests from npm, pinned in tests/e2e/package-lock.json, every action by its commit hash and every image by its digest, and Renovate updates them: https://github.com/Dennis-Otto/paperless-unified-search/blob/main/composer.json https://github.com/Dennis-Otto/paperless-unified-search/blob/main/.nextcloudignore"
