# The files of other servers that every website serves, each with its sha256. The
# hook in .github/mkdocs_blueprint.py checks every download of the privacy plugin
# whose address is here, and every copy of one in .cache, and fails the build on a
# file that differs: a server that changed a file, or someone between it and the
# runner, can't change what the website serves. A file that a project's page names
# from another server, such as a picture, is the project's own and isn't checked.
# https://github.com/Dennis-Otto/repo-blueprint

# The Mermaid that draws a ```mermaid block of a page, which the website serves only
# when a page has one: Renovate moves the version below its line "# renovate:",
# within the major version that Material loads, and python3 pins.py writes its sha256.
[mermaid]
# renovate: datasource=npm depName=mermaid
version = "11.17.2"
sha256 = "581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8"

# The fonts of .github/mkdocs-blueprint-fonts.css, whose addresses name their version
# and so never change: a new font, or a new version of one, comes with its sha256 here.
