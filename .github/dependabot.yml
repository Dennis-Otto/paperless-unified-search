# Dependabot keeps the actions and the dependencies current. Routine updates merge on
# their own once every check passes (dependabot-automerge.yml). Updates of what the
# users run are committed as fix(deps) and lead to a patch release; updates of the
# tools are chore(deps) and wait for the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope

  # The browser of scripts/social-preview.sh and the image of the dev container.
  - package-ecosystem: docker
    directories:
      - /.github/social-preview
      - /.devcontainer
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    # The dev container keeps the Python, PHP or Node of the project, as the CI does;
    # only its digest moves.
    ignore:
      - dependency-name: "devcontainers/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      composer-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      composer-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # The public API of Nextcloud follows the min-version of appinfo/info.xml.
      - dependency-name: nextcloud/ocp
        update-types:
          - version-update:semver-major

  # The containers of the end-to-end tests: the Nextcloud versions they run against
  # follow min-version and max-version of appinfo/info.xml, so their major versions
  # wait for the maintainer.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      containers-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: nextcloud
        update-types:
          - version-update:semver-major
