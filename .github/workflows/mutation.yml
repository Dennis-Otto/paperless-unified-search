name: Mutation

# The mutation tests. Every week they change the code in thousands of small ways
# (mutants) and run the tests against each: a mutant that no test notices shows a
# line that the tests run but don't check. mutmut does it for Python, Infection for
# the PHP of a Nextcloud app. The plan splits the Python into parts of about the same
# number of mutants, each a job of its own, so that a large project finishes within
# the limits of GitHub. mutmut first runs the whole suite once with trampolines that
# record which tests reach each function, its stats, which takes ten times as long as
# the tests: one job collects them, every part loads them and runs only its mutants,
# and a test that fails without any mutant stops the run there, in one job. The
# report puts the parts together into one score, lists first the survivors that
# change the logic, with their changes, and keeps the details as an artifact. A low
# score fails nothing, a run that measures nothing fails, with the tests that failed
# without any mutant; a score of the default branch that drops below that of the run
# before opens one issue, which closes once a run is back. A pull request that changes
# how the mutants run collects the stats and tries a sample of the mutants in one part,
# and shows a defect as a red check. That check isn't required: a pull request that
# merges itself, such as an update of mutmut, doesn't wait for it.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "47 1 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml
      - .github/mutation-requirements.txt
      - stacks/mutation/requirements.txt

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'weekly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  plan:
    name: mutation plan
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Split the code into parts of about the same number of mutants
        id: plan
        env:
          # A number of parts in place of the estimate, from a variable of the repository.
          PARTS: ${{ vars.MUTATION_PARTS }}
          EVENT: ${{ github.event_name }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          # A pull request tries a sample of the functions, in one part.
          sample=()
          if [[ "$EVENT" == pull_request ]]; then
            sample=(--sample)
          fi
          plan="$(python3 "$script" mutation plan --parts "${PARTS:-auto}" "${sample[@]}")"
          echo "$plan" >> "$GITHUB_OUTPUT"
          if grep -qx 'kind=' <<< "$plan"; then
            echo "No mutation tool for this kind of project yet." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The stats of mutmut, once for every part: the whole suite with the trampolines
  # that record which tests reach each function. mutmut saves them in
  # mutants/mutmut-stats.json, and a part that finds them there runs only its
  # mutants. When a test fails without any mutant, no part starts.
  stats:
    name: mutation stats
    needs: plan
    if: needs.plan.outputs.kind == 'python'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || 350 }}
    permissions:
      contents: read
    env:
      # The suite runs about ten times as long under the trampolines as without them.
      MUTMUT_LIMIT: ${{ github.event_name == 'pull_request' && '25m' || '320m' }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-test.txt
            .github/mutation-requirements.txt
            stacks/mutation/requirements.txt
      - name: Install the tools of the tests and mutmut
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        run: |
          requirements="requirements-dev.txt"
          if [[ -f requirements-test.txt ]]; then
            requirements="requirements-test.txt"
          fi
          uv pip install --system --require-hashes -r "$requirements"
          # mutmut uses the pytest and coverage of the project.
          mutation=.github/mutation-requirements.txt
          [[ -f "$mutation" ]] || mutation=stacks/mutation/requirements.txt
          uv pip install --system --require-hashes --no-deps -r "$mutation"
      # The same configuration as in every part: mutmut collects the stats again where
      # the options of pytest differ.
      - name: Write the configuration of mutmut
        if: needs.plan.outputs.kind == 'python'
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" mutation configure
      # mutmut has no command for its stats alone. A run for the one mutant
      # "stats-only", which no code has, generates the mutants, collects the stats,
      # saves them and then stops, because nothing matches.
      - name: Run the tests once and record which tests reach each function
        run: |
          status=0
          timeout "$MUTMUT_LIMIT" mutmut run --max-children "$(nproc)" stats-only > "$RUNNER_TEMP/stats.txt" 2>&1 || status=$?
          echo "mutmut run ended with $status."
          # Without the spinner, which redraws its line thousands of times.
          sed 's/.*\r//' "$RUNNER_TEMP/stats.txt" | tail -n 5
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          # Tests that fail without any mutant fail the step, with an annotation.
          python3 "$script" mutation stats "$RUNNER_TEMP/stats.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the stats to every part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-stats
          path: mutants/mutmut-stats.json
          retention-days: 1
          if-no-files-found: error

  mutation:
    name: mutation ${{ matrix.part }}/${{ matrix.parts }}
    needs: [plan, stats]
    # Infection has no stats to wait for; mutmut runs only on stats that passed.
    if: ${{ !cancelled() && needs.plan.outputs.kind != '' && (needs.stats.result == 'success' || needs.stats.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 350 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners of the account serve the other repositories as well: the weekly
      # run, which nobody waits for, takes two of them, a pull request four.
      max-parallel: ${{ github.event_name == 'schedule' && 2 || 4 }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      # renovate: datasource=github-releases depName=infection/infection
      INFECTION_VERSION: 0.35.8
      INFECTION_SHA256: b2049ae1bff43d9dc82831c2833005005eb62d5180cd518892af93fc8e23ddc5
      # The time of mutmut, which keeps the mutants it reached: a pull request tries
      # its sample for 12 minutes, after the stats. Infection, which reports at its end
      # only, takes the time of the job.
      MUTMUT_LIMIT: ${{ github.event_name == 'pull_request' && '12m' || '320m' }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-test.txt
            .github/mutation-requirements.txt
            stacks/mutation/requirements.txt
      - name: Install the tools of the tests and mutmut
        if: needs.plan.outputs.kind == 'python'
        timeout-minutes: 5
        run: |
          requirements="requirements-dev.txt"
          if [[ -f requirements-test.txt ]]; then
            requirements="requirements-test.txt"
          fi
          uv pip install --system --require-hashes -r "$requirements"
          # mutmut uses the pytest and coverage of the project.
          mutation=.github/mutation-requirements.txt
          [[ -f "$mutation" ]] || mutation=stacks/mutation/requirements.txt
          uv pip install --system --require-hashes --no-deps -r "$mutation"
      - name: Write the configuration of mutmut
        if: needs.plan.outputs.kind == 'python'
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" mutation configure
      - name: Fetch the stats of mutmut
        if: needs.plan.outputs.kind == 'python'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-stats
          path: mutants
      # mutmut loads the stats from mutants/ and runs only the tests that are new.
      - name: Run the mutants against the tests
        if: needs.plan.outputs.kind == 'python'
        env:
          # The names of the mutants of this part, one on each line; none for every one.
          PATTERNS: ${{ matrix.patterns }}
        run: |
          patterns=()
          if [[ -n "$PATTERNS" ]]; then
            mapfile -t patterns <<< "$PATTERNS"
          fi
          status=0
          timeout "$MUTMUT_LIMIT" mutmut run --max-children "$(nproc)" "${patterns[@]}" > "$RUNNER_TEMP/run.txt" 2>&1 || status=$?
          echo "status=$status" >> "$GITHUB_ENV"
          # Without the spinner, which redraws its line thousands of times.
          sed 's/.*\r//' "$RUNNER_TEMP/run.txt" | tail -n 5
      # mutmut shows the change of a mutant only where its copy, mutants/, is.
      - name: Keep the results of this part and the change of each survivor
        if: always() && needs.plan.outputs.kind == 'python'
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          mutmut results --all true > "$RUNNER_TEMP/results.txt" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/part"
          # The whole output of mutmut, without its spinner, for a look at a failure.
          sed 's/.*\r//' "$RUNNER_TEMP/run.txt" > "$RUNNER_TEMP/part/run-$PART.txt" 2>/dev/null || true
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          # Why no mutant ran, such as the tests that fail without any, fails the step.
          python3 "$script" mutation collect "$RUNNER_TEMP/results.txt" "$RUNNER_TEMP/run.txt" \
            --part "$PART/$PARTS" --patterns "$PATTERNS" --status "${status:-0}" \
            --out "$RUNNER_TEMP/part/part-$PART.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the results to the report
        if: always() && needs.plan.outputs.kind == 'python'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-part-${{ matrix.part }}
          path: ${{ runner.temp }}/part/
          retention-days: 7
          if-no-files-found: ignore

      # Infection needs PHP 8.3 or newer. The tools run on the PHP of
      # config.platform.php in composer.json, for which Composer locks them, so the
      # mutants run on that PHP, and on PHP 8.3 for an app whose tools are older.
      - name: Find the PHP of the tools
        if: needs.plan.outputs.kind == 'php'
        id: php
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json

          with open("composer.json", encoding="utf-8") as manifest:
              platform = json.load(manifest).get("config", {}).get("platform", {})
          tools = tuple(int(part) for part in platform.get("php", "0.0").split(".")[:2])
          major, minor = max(tools, (8, 3))
          print(f"version={major}.{minor}")
          EOF
      - name: Set up the PHP of the tools
        if: needs.plan.outputs.kind == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: dom, libxml, mbstring, xml
          coverage: pcov
          tools: composer:v2
      - name: Install the locked tools and Infection
        if: needs.plan.outputs.kind == 'php'
        # Room for one more try of a download of Infection that hung.
        timeout-minutes: 10
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 15 --max-time 300 --output "$RUNNER_TEMP/infection.phar" \
            "https://github.com/infection/infection/releases/download/$INFECTION_VERSION/infection.phar"
          echo "$INFECTION_SHA256  $RUNNER_TEMP/infection.phar" | sha256sum --check --strict
      - name: Run the mutants against the tests
        if: needs.plan.outputs.kind == 'php'
        run: |
          if ! compgen -G "infection.json*" >/dev/null; then
            {
              echo "{"
              if [[ -f tests/bootstrap.php ]]; then
                # The classes of Nextcloud that the code of the app uses come from the
                # bootstrap of the tests, also for Infection itself.
                echo '  "bootstrap": "tests/bootstrap.php",'
              fi
              echo '  "source": {"directories": ["lib"]},'
              echo '  "timeout": 30,'
              echo '  "logs": {"text": "build/infection.log", "summary": "build/infection-summary.log"}'
              echo "}"
            } > infection.json5
          fi
          # Its output has the score, "Covered Code MSI: 87%", the share of the mutants
          # of the code that the tests run which a test noticed, as the score of mutmut;
          # no log of Infection has it. --with-uncovered adds the mutants of code that
          # no test runs, which it counts but doesn't run, and with them the MSI of all
          # the code and its coverage. The artifact keeps the output for the dashboard.
          # A low score fails nothing, also where the project's own configuration sets
          # a minimum; an error of Infection fails the step, through tee and tail.
          mkdir -p build
          set -o pipefail
          php "$RUNNER_TEMP/infection.phar" --threads=max --with-uncovered --min-msi=0 --min-covered-msi=0 \
            --no-progress --no-interaction --no-ansi --logger-github=false 2>&1 |
            tee build/infection-output.log | tail -n 20
      - name: Report the score
        if: always() && needs.plan.outputs.kind == 'php'
        run: |
          # "40 mutations were generated:", in the output of Infection with any configuration.
          generated="$(sed -nE '/^ *[0-9]+ mutations were generated/{s/^ *([0-9]+).*/\1/p;q;}' build/infection-output.log 2>/dev/null || true)"
          scored=false
          if ((${generated:-0} > 0)) && grep -qs 'Covered Code MSI' build/infection-output.log; then
            scored=true
          fi
          {
            echo "### Mutation tests (Infection)"
            if [[ "$scored" == true ]]; then
              grep -E '(Mutation Score Indicator|Mutation Code Coverage|Covered Code MSI)' build/infection-output.log \
                | sed 's/^ */- /'
            else
              echo "Infection reported no score. The end of its output:"
              echo
              echo '```text'
              tail -n 20 build/infection-output.log 2>/dev/null || true
              echo '```'
            fi
            if [[ -f build/infection-summary.log ]]; then
              echo
              echo '```text'
              cat build/infection-summary.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A run that measures nothing, not a low score, fails: no mutant, such as of a
          # configuration whose code is missing, or no score that it could read.
          if [[ "$scored" != true ]]; then
            exit 1
          fi
      - name: Keep the results
        if: always() && needs.plan.outputs.kind == 'php'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: build/infection*.log
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: mutation report
    needs: [plan, stats, mutation]
    # Stats that failed have said why; no part ran.
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'python' && needs.stats.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The score of the run before, in its artifact.
      actions: read
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Fetch the results of every part
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A part whose job failed before its end kept none; the report names it.
        continue-on-error: true
        with:
          pattern: mutation-part-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Fetch the score of the run before
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          previous="$(gh run list --workflow mutation.yml --branch "$BRANCH" --status success --limit 20 \
            --json databaseId,event --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')"
          if [[ -n "$previous" ]]; then
            gh run download "$previous" --name mutation --dir "$RUNNER_TEMP/previous" || true
          fi
      - name: Report the score and the surviving mutants
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          status=0
          python3 "$script" mutation report "$RUNNER_TEMP/parts" \
            --out "$RUNNER_TEMP/mutation" --previous "$RUNNER_TEMP/previous/mutation.json" \
            --run "$RUN_URL" > "$RUNNER_TEMP/summary.md" || status=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # A run that measures nothing, not a low score, fails: an error of the tool,
          # of its configuration or of a test.
          exit "$status"
      # The score, the results that the dashboard reads, and every survivor with its
      # change; the next weekly run compares with mutation.json.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation/
          retention-days: 90
          if-no-files-found: ignore

  # The one issue of a score of the default branch that dropped, which a schedule always
  # runs on: a job of its own, so that only it may write issues, and never on a pull
  # request.
  issue:
    name: mutation issue
    needs: report
    if: ${{ needs.report.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Fetch the report of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation
      - name: Open, keep or close the issue of a dropped score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" --repo "$GITHUB_REPOSITORY" mutation issue "$RUNNER_TEMP/mutation" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
