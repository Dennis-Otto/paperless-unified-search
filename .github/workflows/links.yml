name: Links

# The link bot. lychee checks the links of the documentation, and the anchors that they
# lead to, also in the README of another repository, on every change of a Markdown file
# or of a page of HTML in docs/, and every week, since sites move without a change here.
# A pull request checks the documents that it changes, so that a site that is down for a
# moment fails only the pull requests that link to it; one that changes the rules or
# lychee itself, such as an update of its version in .github/lychee.sh, or moves or
# deletes a file checks every document, as main and the weekly run do. The
# answers of the sites stay in a cache for a day. A broken link fails the check of a
# pull request; the weekly run keeps one issue with the broken links open until they are
# fixed, and closes it then. lychee.toml holds the rules, .lycheeignore the exceptions
# of this repository. The entry in the changelog that most pull requests bring, in
# CHANGELOG.md or in a fragment of changelog.d/, starts no check on its own; the weekly
# run checks the links of the changelog.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/**/*.html
      - "!CHANGELOG.md"
      - "!changelog.d/**"
      - lychee.toml
      - .lycheeignore
      - .github/workflows/links.yml
      - .github/lychee.sh
      - .github/download.sh
  pull_request:
    paths:
      - "**/*.md"
      - docs/**/*.html
      - "!CHANGELOG.md"
      - "!changelog.d/**"
      - lychee.toml
      - .lycheeignore
      - .github/workflows/links.yml
      - .github/lychee.sh
      - .github/download.sh
  schedule:
    - cron: "23 5 * * 5"
  workflow_dispatch:

permissions: {}

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  links:
    name: links
    # Not in the release pull request: the branch of the release bot in this repository.
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The check reaches every host that the documents link to, so its token only reads;
    # the job issue below writes the issue of broken links.
    permissions:
      contents: read
    outputs:
      exit-code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request compares its documents with its base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - name: Choose the documents to check
        id: documents
        env:
          EVENT: ${{ github.event_name }}
          # The base branch as it is now, not the base that the event names: that one
          # can be older than the commit of main that the branch was built on.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The documents that a pull request adds or changes, since the merge base, so
          # none that only main changed, but the changelog. One that changes the rules,
          # or lychee itself in .github/lychee.sh, or moves or deletes a file that a
          # document may link to, checks every document; no document links to a
          # fragment of the changelog. lychee gets the names through a shell, so a name
          # with another character checks every document too.
          if [[ "$EVENT" == pull_request ]] &&
            [[ -z "$(git diff --name-only "origin/$BASE_REF...HEAD" -- lychee.toml .lycheeignore .github/workflows/links.yml .github/lychee.sh .github/download.sh)" ]] &&
            [[ -z "$(git diff --name-only --diff-filter=DR "origin/$BASE_REF...HEAD" -- . ':!changelog.d')" ]]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- '*.md' 'docs/*.html' ':!CHANGELOG.md' ':!changelog.d')
            if ((${#changed[@]} == 0)); then
              echo "The pull request changes no document; no link to check." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! printf '%s\n' "${changed[@]}" | grep -qv '^[A-Za-z0-9._/@+-]*$'; then
              echo "files=$(printf "'./%s' " "${changed[@]}")" >> "$GITHUB_OUTPUT"
              echo "The check reads the ${#changed[@]} document(s) that the pull request changes." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "files='./**/*.md' './docs/**/*.html'" >> "$GITHUB_OUTPUT"
          echo "every=true" >> "$GITHUB_OUTPUT"
      # The answers of the sites from the runs of the last day; lychee asks again for a
      # link that failed.
      - name: Restore the answers of the sites
        if: steps.documents.outputs.files != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      # .github/lychee.sh downloads lychee through the API, with the token of the job,
      # which lychee takes for the links to GitHub as well (decision 0133). The weekly
      # run keeps an issue of the broken links instead of failing.
      - name: Check the links of the documentation
        id: lychee
        if: steps.documents.outputs.files != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FILES: ${{ steps.documents.outputs.files }}
          EVERY: ${{ steps.documents.outputs.every }}
        run: |
          options=()
          [[ "$EVENT" != schedule ]] || options+=(--no-fail)
          # A changed document may have no link at all.
          [[ "$EVERY" == true ]] || options+=(--may-find-none)
          # The names of the documents, each in quotes, as the step before wrote them,
          # which lychee reads as patterns of its own.
          eval "documents=($FILES)"
          bash .github/lychee.sh "${options[@]}" "$RUNNER_TEMP/links.md" \
            --config lychee.toml --no-progress --cache --max-cache-age 1d "${documents[@]}"
      # The report of the weekly run, for the job issue.
      - name: Keep the report of the broken links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links
          path: ${{ runner.temp }}/links.md
          retention-days: 1
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: links
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  # The one issue of broken links, which the weekly run keeps: a job of its own, so
  # that only it may write issues, and it reaches only GitHub.
  issue:
    name: links issue
    needs: links
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Take the report of the broken links
        if: needs.links.outputs.exit-code != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: links
          path: ${{ runner.temp }}
      - name: Keep the issue of broken links current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ needs.links.outputs.exit-code }}
          REPORT: ${{ runner.temp }}/links.md
        run: |
          title="Broken links in the documentation"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$EXIT_CODE" == 0 ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The weekly check finds no broken link any more."
            fi
            exit 0
          fi
          body="$(printf '%s\n\n%s\n' \
            "The weekly link check found broken links. Fix them, or list them in .lycheeignore with the reason." \
            "$(cat "$REPORT")")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label documentation --body "$body"
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
