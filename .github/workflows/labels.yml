name: Labels

# Creates and updates the repository's labels from .github/labels.toml. It never
# deletes a label; one that is missing from the file is reported in the summary.
# The job is the issue assistant's reusable workflow at the commit of a release, so
# an update is a move of the pin below; it blocks every host but GitHub's.
# https://github.com/Dennis-Otto/issue-assistant

on:
  push:
    branches: [main]
    paths:
      - .github/labels.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change
        type: boolean
        default: false

permissions: {}

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  labels:
    name: Labels
    permissions:
      contents: read
      issues: write
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-labels.yml@1f78330598c545784358643ceda2b720014ebb42 # v1.6.1
    with:
      dry_run: ${{ inputs.dry_run || false }}
