name: Release verification

# The release verification bot. It checks a release the way its users can: every
# asset carries the signed provenance of this repository's release workflow, both in
# GitHub and in the attached bundle; the SBOMs are attached and describe what the
# release ships, by its name and version; the release is immutable and its commit
# signed; and where the repository variable PUBLISH_TO delivers it, the same release
# is there. The release workflow runs it after every release, it checks the
# latest release every week, and a release that anybody else publishes, by hand or
# with a token, at once. A failed check fails the run, which the bot-health bot
# reports in an issue. https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_call:
    inputs:
      tag:
        description: The tag of the release; empty for the latest
        type: string
        required: false
  schedule:
    - cron: "49 5 * * 0"
  # The release workflow publishes its releases with the token of its job, whose
  # events start no workflow: a published release starts this one only when someone
  # else published it, outside the release workflow. That run takes the workflow of
  # the commit of its tag, and the weekly run checks the latest release again with
  # that of main.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release; empty for the latest
        required: false

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"
  # Each call of its API asks for the version of the REST API that the steps are
  # written for (decision 0125).
  API_VERSION_HEADER: "X-GitHub-Api-Version: 2022-11-28"

jobs:
  verify:
    name: verify the release
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443
            ${{ vars.PUBLISH_TO == 'pypi' && 'pypi.org:443' || '' }}
            ${{ vars.PUBLISH_TO == 'npm' && 'registry.npmjs.org:443' || '' }}
            ${{ vars.PUBLISH_TO == 'ghcr' && 'ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
            ${{ vars.PUBLISH_TO == 'nextcloud-appstore' && 'apps.nextcloud.com:443' || '' }}
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443
            ${{ vars.PUBLISH_TO == 'pypi' && 'pypi.org:443' || '' }}
            ${{ vars.PUBLISH_TO == 'npm' && 'registry.npmjs.org:443' || '' }}
            ${{ vars.PUBLISH_TO == 'ghcr' && 'ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
            ${{ vars.PUBLISH_TO == 'nextcloud-appstore' && 'apps.nextcloud.com:443' || '' }}
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Verify the release as its users can
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The tag of the release that the release workflow or a person names, or
          # of the one that was just published.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PUBLISH_TO: ${{ vars.PUBLISH_TO }}
          # The weekly run of the latest release accepts what older releases lack. A run
          # that the release workflow calls has the event of that run, which may be its
          # daily schedule, but always a tag, and checks in full.
          WEEKLY: ${{ github.event_name == 'schedule' && inputs.tag == '' }}
          # The gitsign of .github/sign-tag.sh.
          # renovate: datasource=github-releases depName=sigstore/gitsign extractVersion=^v(?<version>.+)$
          GITSIGN_VERSION: 0.18.0
          GITSIGN_SHA256: 2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483
        run: |
          set -uo pipefail
          problems=0
          pass() { echo "$1"; echo "- ✔ $1" >> "$GITHUB_STEP_SUMMARY"; }
          fail() { echo "::error::$1"; echo "- ✘ $1" >> "$GITHUB_STEP_SUMMARY"; problems=$((problems + 1)); }
          # What the checks after it can't go without ends the run, and says why: the
          # shell would end it at the failed command without a word in the summary.
          stop() { fail "$1"; echo "The release $TAG has $problems problem(s)." >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [[ -z "$TAG" ]]; then
            TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
            if [[ -z "$TAG" ]]; then
              echo "The repository has no release yet." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "### The release $TAG" >> "$GITHUB_STEP_SUMMARY"
          # GitHub answers for a tag only with a published release, never with a draft.
          release="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/releases/tags/$TAG")" ||
            stop "GitHub shows no published release with the tag $TAG: it is still a draft, there is none, or GitHub didn't answer."
          # A release from before the release workflow of the blueprint has none of
          # what it attaches; the weekly run waits for the next release instead.
          if [[ "$WEEKLY" == true ]] &&
            ! jq -e 'any(.assets[]; .name == "provenance.sigstore.json")' <<<"$release" >/dev/null; then
            echo "The release $TAG was made before the release workflow of the blueprint; the next one is verified in full." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$(jq -r .immutable <<<"$release")" == true ]]; then
            pass "The release is immutable."
          else
            fail "The release is not immutable."
          fi
          sha="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$TAG" --jq .sha)" ||
            stop "GitHub doesn't show the commit of the tag $TAG."
          if [[ "$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$sha" --jq .commit.verification.verified)" == true ]]; then
            pass "Its commit $sha is signed."
          else
            fail "Its commit $sha is not signed."
          fi
          # The tag, signed without a key by the release workflow (gitsign, as in
          # .github/sign-tag.sh); releases made before have a tag without a signature,
          # which the weekly run only notes. It checks the tag on its own, as a user
          # would, not with the verify of sign-tag.sh, one of the scripts it checks.
          # gitsign through the API with the token of the job, which survives an outage
          # of GitHub's downloads without a token, five times, 10, 20, 40 and 80 seconds
          # apart, as .github/download.sh does (decision 0133), and a call that stalls
          # for five minutes ends, since gh waits without a limit.
          gitsign="$RUNNER_TEMP/gitsign"
          for wait in 10 20 40 80 0; do
            if timeout --kill-after=10 300 gh release download "v$GITSIGN_VERSION" --repo sigstore/gitsign \
              --pattern "gitsign_${GITSIGN_VERSION}_linux_amd64" --output "$gitsign" --clobber; then
              break
            fi
            ((wait)) || stop "gitsign $GITSIGN_VERSION can't be downloaded: GitHub failed five times in two and a half minutes (https://www.githubstatus.com), so the tag $TAG can't be checked. Run the check again once GitHub works."
            sleep "$wait"
          done
          echo "$GITSIGN_SHA256  $gitsign" | sha256sum --check --strict >/dev/null ||
            stop "The download of gitsign $GITSIGN_VERSION doesn't have its sha256, so the tag $TAG can't be checked."
          chmod +x "$gitsign"
          git init --quiet "$RUNNER_TEMP/tag"
          git -C "$RUNNER_TEMP/tag" fetch --quiet --depth=1 "https://github.com/$GH_REPO.git" "refs/tags/$TAG:refs/tags/$TAG" ||
            stop "The tag $TAG can't be fetched from the repository."
          if [[ "$(git -C "$RUNNER_TEMP/tag" cat-file -t "$TAG")" != tag ]]; then
            if [[ "$WEEKLY" == true ]]; then
              echo "::notice::The tag $TAG is older than the signed tags."
            else
              fail "The tag $TAG is not a signed tag."
            fi
          elif (cd "$RUNNER_TEMP/tag" && "$gitsign" verify-tag "$TAG" \
            --certificate-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1); then
            pass "The tag $TAG is signed by the release workflow."
          else
            fail "The signature of the tag $TAG isn't one of the release workflow."
          fi

          mkdir -p "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets" || exit 1
          gh release download "$TAG" || stop "The assets of the release $TAG can't be downloaded."
          if [[ -f provenance.sigstore.json ]]; then
            pass "The bundle of the provenance is attached."
          else
            fail "The release has no provenance.sigstore.json."
          fi
          if [[ -f provenance.intoto.jsonl ]]; then
            if [[ "$(jq -c .dsseEnvelope provenance.sigstore.json)" == "$(cat provenance.intoto.jsonl)" ]]; then
              pass "provenance.intoto.jsonl holds the signed statement of the bundle."
            else
              fail "provenance.intoto.jsonl differs from the signed statement of the bundle."
            fi
          fi
          if compgen -G "*.spdx.json" >/dev/null; then
            pass "The SBOM is attached."
          else
            fail "The release has no SBOM."
          fi
          # Releases made before the blueprint attached it have none; the weekly run
          # only notes that.
          if compgen -G "*.cdx.json" >/dev/null; then
            pass "The SBOM as CycloneDX is attached."
          elif [[ "$WEEKLY" == true ]]; then
            echo "::notice::The release is older than the SBOM as CycloneDX."
          else
            fail "The release has no SBOM as CycloneDX."
          fi
          # The SBOMs describe what the release ships, under the name of the repository
          # and the version of the release, as build-release.yml writes them. Those of a
          # release made before describe the folder of the repository, which the weekly
          # run only notes.
          version="${TAG#v}"
          name="${GH_REPO#*/}"
          # The variables of the filters are jq's, not the shell's.
          # shellcheck disable=SC2016
          spdx='[.relationships[] | select(.spdxElementId == "SPDXRef-DOCUMENT" and .relationshipType == "DESCRIBES")
            | .relatedSpdxElement] as $roots
            | any(.packages[]; (.SPDXID | IN($roots[])) and .name == $name and .versionInfo == $version)'
          # shellcheck disable=SC2016
          cyclonedx='.metadata.component.name == $name and .metadata.component.version == $version'
          for sbom in *.spdx.json *.cdx.json; do
            [[ -f "$sbom" ]] || continue
            filter="$spdx"
            [[ "$sbom" == *.cdx.json ]] && filter="$cyclonedx"
            if jq -e --arg name "$name" --arg version "$version" "$filter" "$sbom" >/dev/null; then
              pass "$sbom describes $name $version, what the release ships."
            elif [[ "$WEEKLY" == true ]]; then
              echo "::notice::$sbom is older than the SBOMs of what a release ships."
            else
              fail "$sbom doesn't describe $name $version, what the release ships."
            fi
          done
          for vex in *.openvex.json; do
            [[ -f "$vex" ]] || continue
            if jq -e '."@context" == "https://openvex.dev/ns/v0.2.0" and (.statements | length > 0)' "$vex" >/dev/null; then
              pass "$vex states the advisories that don't affect the release."
            else
              fail "$vex is no OpenVEX document with statements."
            fi
          done
          # The provenance names the isolated build, build-release.yml (SLSA Build
          # Level 3); a release made before it names the release workflow, which only
          # the weekly run accepts. Either ran for main, the only branch whose runs
          # make releases, on a runner of GitHub: an attestation of a run of another
          # branch, or of a self-hosted runner, which its owner controls, fails.
          trusted=(--source-ref refs/heads/main --deny-self-hosted-runners)
          provenance() {
            gh attestation verify "$1" --repo "$GH_REPO" --signer-workflow "$2" "${trusted[@]}" >/dev/null &&
              { [[ ! -f provenance.sigstore.json ]] ||
                gh attestation verify "$1" --repo "$GH_REPO" --signer-workflow "$2" "${trusted[@]}" \
                  --bundle provenance.sigstore.json >/dev/null; }
          }
          build="$GH_REPO/.github/workflows/build-release.yml"
          older="$GH_REPO/.github/workflows/release.yml"
          for asset in *; do
            [[ "$asset" == provenance.sigstore.json || "$asset" == *.intoto.jsonl ]] && continue
            if provenance "$asset" "$build"; then
              pass "$asset carries the signed provenance of the isolated build."
            elif [[ "$WEEKLY" == true ]] && provenance "$asset" "$older"; then
              pass "$asset carries the signed provenance of the release workflow, from before the isolated build."
            else
              fail "$asset has no valid provenance of the isolated build."
            fi
          done

          case "$PUBLISH_TO" in
            pypi)
              name="${GH_REPO#*/}"
              published=""
              # Into a file, which curl empties before it tries again.
              if curl --fail --silent --show-error --retry 5 --retry-all-errors \
                --connect-timeout 15 --max-time 300 --output "$RUNNER_TEMP/pypi.json" \
                "https://pypi.org/pypi/$name/$version/json"; then
                # An answer that isn't JSON, such as the page of a gateway, has no files.
                published="$(jq -r '.urls[].digests.sha256' "$RUNNER_TEMP/pypi.json" | tr -d '\r' | sort || true)"
              fi
              # sha256sum fails for a kind of file that the release doesn't have.
              attached="$(sha256sum ./*.whl ./*.tar.gz 2>/dev/null | cut -d' ' -f1 | sort || true)"
              if [[ -z "$attached" ]]; then
                fail "The release has no wheel and no source archive to compare with PyPI."
              elif [[ -n "$published" && "$published" == "$attached" ]]; then
                pass "PyPI has the same files of $version."
              else
                fail "PyPI doesn't have the files of the release $version."
              fi
              ;;
            npm)
              tarballs=(./*.tgz)
              if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
                fail "The release has no single npm package, a .tgz."
              else
                package="$(tar -xOzf "${tarballs[0]}" package/package.json | jq -r '.name // ""' || true)"
                published="$(npm view "$package@$version" dist.integrity 2>/dev/null || true)"
                attached="sha512-$(openssl dgst -sha512 -binary "${tarballs[0]}" | openssl base64 -A)"
                if [[ -z "$package" ]]; then
                  fail "${tarballs[0]#./} has no package.json with a name, so npm can't be asked for it."
                elif [[ "$published" == "$attached" ]]; then
                  pass "npm has the same package $package@$version."
                else
                  fail "npm doesn't have the package of the release $version."
                fi
              fi
              ;;
            ghcr)
              # The image has the provenance of its own isolated build, build-image.yml
              # (SLSA Build Level 3), which the release workflow calls once the release
              # is public; an image made before it has that of the release workflow,
              # which only the weekly run accepts.
              image="ghcr.io/${GH_REPO,,}:$version"
              attested() {
                gh attestation verify "oci://$image" --repo "$GH_REPO" --signer-workflow "$1" "${trusted[@]}" >/dev/null
              }
              if attested "$GH_REPO/.github/workflows/build-image.yml"; then
                pass "$image carries the signed provenance of its isolated build."
              elif [[ "$WEEKLY" == true ]] && attested "$older"; then
                pass "$image carries the signed provenance of the release workflow, from before its isolated build."
              else
                fail "$image has no valid provenance of its isolated build."
              fi
              ;;
            hacs)
              # HACS installs the zip that hacs.json at the tag names, unpacked into
              # custom_components/<domain>/, where Home Assistant reads the domain and
              # the version of its manifest.json. It offers the latest release to every
              # user, and a prerelease only to those who show its betas.
              hacs="$(gh api --header "$API_VERSION_HEADER" -H "Accept: application/vnd.github.raw+json" \
                "repos/$GH_REPO/contents/hacs.json?ref=$TAG" 2>/dev/null || true)"
              zip="$(jq -r 'if .zip_release == true then .filename // "" else "" end' \
                <<<"$hacs" 2>/dev/null || true)"
              domain="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/contents/custom_components?ref=$TAG" \
                --jq '[.[] | select(.type == "dir") | .name] | join(" ")' 2>/dev/null || true)"
              if [[ -z "$zip" ]]; then
                fail "hacs.json at $TAG names no zip_release and filename, so HACS installs the files of the tag, not the asset with the provenance."
              elif [[ ! -f "$zip" ]]; then
                fail "The release has no $zip, the zip that hacs.json names for HACS."
              else
                manifest="$(python3 -c 'import sys, zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.json").decode())' \
                  "$zip" 2>/dev/null || true)"
                zipped_domain="$(jq -r '.domain // ""' <<<"$manifest" 2>/dev/null || true)"
                zipped_version="$(jq -r '.version // ""' <<<"$manifest" 2>/dev/null || true)"
                if [[ -z "$manifest" ]]; then
                  fail "$zip has no manifest.json at its root, so HACS unpacks the integration one folder too deep."
                elif [[ -n "$domain" && "$zipped_domain" == "$domain" ]]; then
                  pass "$zip holds the integration $domain at its root, as HACS unpacks it into custom_components/$domain/."
                else
                  fail "The manifest.json of $zip has the domain ${zipped_domain:-none}, not that of custom_components/${domain:-?}/ at $TAG."
                fi
                if [[ -n "$manifest" && "$zipped_version" == "$version" ]]; then
                  pass "Its manifest.json has the version $version, which Home Assistant shows."
                elif [[ -n "$manifest" ]]; then
                  fail "The manifest.json of $zip has the version ${zipped_version:-none}, not $version."
                fi
              fi
              latest="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
              prerelease="$(jq -r .prerelease <<<"$release")"
              if [[ "$version" == *-* && "$prerelease" == true ]]; then
                pass "HACS offers the prerelease $TAG only to those who show its betas."
              elif [[ "$version" == *-* ]]; then
                fail "$TAG has the version of a prerelease but isn't marked as one, so HACS offers it to every user."
              elif [[ "$prerelease" == true ]]; then
                fail "$TAG is marked as a prerelease, so HACS offers it only to those who show its betas."
              elif [[ "$latest" == "$TAG" ]]; then
                pass "HACS offers $TAG to every user, as the latest release."
              elif [[ -n "$latest" && "$(printf '%s\n' "$version" "${latest#v}" | sort -V | tail -n 1)" != "$version" ]]; then
                pass "HACS offers the newer release $latest; $TAG stays for those who choose it."
              else
                fail "The latest release is ${latest:-none}, not $TAG, so HACS doesn't offer it."
              fi
              ;;
            chrome-web-store)
              # publish-store.yml uploads this zip to the Chrome Web Store, which reads
              # the manifest.json at its root; a manifest takes only the numbers of a
              # version, so a beta, such as 1.3.0-beta.2, has 1.3.0.
              numbers="$(grep -oE '^[0-9]+([.][0-9]+)*' <<<"$version" || true)"
              zips=(./*.zip)
              if [[ ${#zips[@]} -ne 1 || ! -f "${zips[0]}" ]]; then
                if [[ "$WEEKLY" == true ]]; then
                  echo "::notice::The release is older than the zip of the extension for the Chrome Web Store."
                else
                  fail "The release has no single zip of the extension for the Chrome Web Store."
                fi
              else
                manifest="$(python3 -c 'import sys, zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.json").decode())' \
                  "${zips[0]}" 2>/dev/null || true)"
                zipped="$(jq -r '"\(.manifest_version) \(.version)"' <<<"$manifest" 2>/dev/null || true)"
                if [[ "$zipped" == "3 $numbers" ]]; then
                  pass "${zips[0]} holds the manifest.json of Manifest V3 and the version $numbers at its root, as the Chrome Web Store takes it."
                else
                  fail "${zips[0]} has no manifest.json of Manifest V3 and the version ${numbers:-$version} at its root."
                fi
              fi
              ;;
            nextcloud-appstore)
              app_id="$(gh api --header "$API_VERSION_HEADER" -H "Accept: application/vnd.github.raw+json" \
                "repos/$GH_REPO/contents/appinfo/info.xml?ref=$TAG" |
                python3 -c 'import sys, xml.etree.ElementTree as t; print(t.parse(sys.stdin).getroot().findtext("id") or "")' 2>/dev/null || true)"
              if [[ -z "$app_id" ]]; then
                fail "appinfo/info.xml at $TAG names no app, so the Nextcloud App Store can't be checked."
              else
                # The App Store takes the version of a release from the appinfo/info.xml
                # in its package and updates its release of that version: a package of
                # another version, such as a beta that still says the last release, has
                # replaced the package of that release for every user (#635).
                packaged="$(python3 -c 'import sys, tarfile, xml.etree.ElementTree as t; info = tarfile.open(sys.argv[1]).extractfile(sys.argv[2] + "/appinfo/info.xml"); print((t.parse(info).getroot().findtext("version") or "").strip())' \
                  "$app_id.tar.gz" "$app_id" 2>/dev/null || true)"
                if [[ "$packaged" == "$version" ]]; then
                  pass "The appinfo/info.xml in $app_id.tar.gz has the version $version, which the App Store takes for its release."
                else
                  fail "The appinfo/info.xml in $app_id.tar.gz has the version ${packaged:-none}, not $version, so the App Store takes the package for another release."
                fi
                # The page of the app shows a new release at once and links its signed
                # package; the list of all apps follows up to hours later. A beta, whose
                # version has a pre-release identifier such as -beta.2, shows among the
                # unstable releases on the page of all its releases: Nextcloud offers it
                # only to servers on the beta channel. The loop waits for the package,
                # curl itself tries again after a passing error.
                package="https://github.com/$GH_REPO/releases/download/$TAG/$app_id.tar.gz"
                page="https://apps.nextcloud.com/apps/$app_id"
                [[ "$version" != *-* ]] || page="$page/releases"
                offered=false
                for attempt in 1 2 3 4 5 6; do
                  if curl --fail --silent --show-error --retry 2 --retry-all-errors \
                    --connect-timeout 15 --max-time 30 --output "$RUNNER_TEMP/app.html" "$page" &&
                    grep -qF "href=\"$package\"" "$RUNNER_TEMP/app.html"; then
                    offered=true
                    break
                  fi
                  [[ "$attempt" == 6 ]] || sleep 30
                done
                if [[ "$offered" == true && "$version" == *-* ]]; then
                  pass "The Nextcloud App Store offers the package of $app_id $version only to servers on the beta channel of Nextcloud."
                elif [[ "$offered" == true ]]; then
                  pass "The Nextcloud App Store offers the package of $app_id $version."
                else
                  fail "The Nextcloud App Store doesn't offer the package of $app_id $version."
                fi
              fi
              ;;
            github-action)
              if [[ "$version" == *-* ]]; then
                pass "A prerelease leaves the major tag where it is."
              else
                major="v${version%%.*}"
                target="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$major" --jq .sha 2>/dev/null || true)"
                if [[ "$target" == "$sha" ]]; then
                  pass "The major tag $major points at the release."
                else
                  fail "The major tag $major points at ${target:-nothing}, not at the release."
                fi
              fi
              ;;
          esac

          if ((problems > 0)); then
            echo "The release $TAG has $problems problem(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "The release $TAG verifies." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
