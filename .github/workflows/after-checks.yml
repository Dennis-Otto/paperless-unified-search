          # concurrency group of the run for the newest commit, and cancel it, as the
          # flaky-test bot found in Dennis-Otto/paperless-sync#486: only the run of the
          # head of its pull request, or of its branch, runs again. The bot looks last,
          # just before the rerun; a run of a schedule or by hand shares its group with
          # no other run.
          case "$EVENT" in
            push)
              # A branch that is gone has no head.
              if ! tip="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)"; then
                grep -q "HTTP 404" "$RUNNER_TEMP/gh-errors" || exit 1
                tip=""
              fi
              if [[ -z "$tip" ]]; then
                echo "The branch $BRANCH of ${SHA:0:7} is gone, so the failed jobs of its run of $NAME don't run again." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              elif [[ "$tip" != "$SHA" ]]; then
                echo "${SHA:0:7} is no longer the head of $BRANCH, so the failed jobs of its run of $NAME don't run again: they would cancel the run for the newer commit." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              ;;
            pull_request | pull_request_target)
              number="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$SHA/pulls" \
                --jq "map(select(.state == \"open\" and .head.sha == \"$SHA\")) | .[0].number // empty")"
              if [[ -z "$number" ]]; then
                echo "${SHA:0:7} is not the head of an open pull request any more, so the failed jobs of its run of $NAME don't run again." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              ;;
          esac
          # It may also start again between the look and the rerun.
          if ! output="$(tried gh run rerun "$RUN" --failed)"; then
            if grep -q "already running" "$RUNNER_TEMP/gh-errors"; then
              echo "$NAME runs again already; the bot leaves it alone." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"
          if [[ "$rule" == published ]]; then
            echo "GitHub Pages or Sigstore kept $NAME from publishing the website of ${SHA:0:7}, the head of $BRANCH; the failed jobs run once more." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Harden-Runner didn't block in a job of $NAME, which stopped; the failed jobs run once more." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  findings:
    name: dismiss the accepted alerts of the pull request
    # After each scan of a pull request of this repository whose commit is still its
    # head, whatever the scan found: the reusable workflow of Findings dismisses the
    # alerts of the pull request that .github/findings.toml of the default branch
    # accepts, so that their review threads don't block the merge, and fails for none
    # (decision 0028 of the issue assistant). Never after the scan of a fork, whose code
    # could match an accepted rule with a real finding, nor after one of main, which
    # Findings takes, with OpenSSF Scorecard, which scans main alone. Findings ran for
    # this before, one run after each scan with one of Bot health behind it; with
    # [findings] pull_requests = false in .github/issue-assistant/config.toml it runs
    # for main alone (decision 1043). The Issue assistant sync moves the pin with that
    # of findings.yml. The reusable workflow keeps its group for the branch of the pull
    # request, in which the newest scan dismisses every accepted alert of it.
    if: >-
      !github.event.repository.fork &&
      contains(fromJSON('["CodeQL", "OSV-Scanner", "Workflow security"]'), github.event.workflow_run.name) &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(github.event.workflow_run.pull_requests.*.head.sha, github.event.workflow_run.head_sha)
    permissions:
      contents: read
      security-events: write
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-findings.yml@fd539748326e8c9bc09245a3f228baae8c2af700 # v1.16.0
    with:
      dry_run: false

