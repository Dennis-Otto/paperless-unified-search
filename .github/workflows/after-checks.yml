name: After the checks

# The bots that act on a finished run of the checks and of the release. One workflow
# for all, so that every run starts one run after it, not one for each bot that
# mostly has nothing to do. None checks out or runs the code of a pull request.
#
# The flaky-test bot: when a run of the tests fails for the first time, or a job of it
# runs out of time, it runs the failed jobs once more. A job that passes then failed
# without a change of the code: its test is flaky, and the bot reports it in one
# issue, with the step, the test and the error that failed, so that it gets fixed
# instead of failing pull requests at random: a comment for each run, and in the body
# how often each job and test flaked, and when it last did. The test is one that
# pytest names in the log, or else the step or test that the log names last before
# the failure, after the answer test_marker of the blueprint, such as "Browser step:"
# before each step of the tests of a browser. Only a failure of the code counts
# (decision 1096): a job that failed outside it, in an action of another repository
# such as the upload of an artifact, a post step, the set-up of the job or a runner
# that hung after its work, as the runner's own lines of the log show, gets no row and
# opens no issue; the summary lists it under "Outside the code". So does a job that
# ran out of time after each of its steps had passed, whose runner never reported that
# the job ended, a check that GitHub kept failing, which says so, and a job that only
# sums up the jobs that it needs, as variants does: the one that failed has its own
# row. Such a job says so, or its definition in the file of the workflow at the commit
# of the run shows it, with needs, an if with always() or !cancelled(), and a job that
# it needs that failed or was cancelled (decision 1110). The PR coach's explanation of
# a check is no error of the job's own. A failure outside the code that comes back for
# the third time in 7 days, in a job of the same name and the same steps, gets its row
# after all, as a cause that stays is a person's to fix; and an issue of an older bot
# that holds only such failures closes. The look back over those 7 days stops, with a
# warning, once GitHub keeps failing, and after two minutes, and counts as far as it
# got, so that the report ends in its time. A job that
# fails again is a real failure and stays red, and so does one that failed the same
# way for the commit before, and one that failed in a step of scripts/check.sh that
# can't pass without a change, such as Psalm or Files of the project, which the PR coach
# names in the title of its annotation and whose explanation in .github/checks.toml or
# .github/checks.project.toml of the default branch says rerun = false: running it
# again would only keep a runner busy. The bot leaves the run alone only when every job
# that broke failed in such a step, and starts the branch bot then, as the failure
# stays (decision 0181). Only the
# run of the head of its pull request, or of its branch, runs again: just before the
# rerun, the bot asks GitHub for the head, as a run of a commit that a newer push
# replaced shares the concurrency group of the run for the head and would cancel it,
# as in Dennis-Otto/paperless-sync#486; the bot for stopped checks asks the same. The
# Downstream workflow of the blueprint updates the repositories that take it as they
# are at that moment, so one of its jobs that passes when it runs again found a
# repository that changed in between, such as one that merged what the pull request
# needs: the bot runs it once more, but counts no flaky test for it. A run whose failed
# jobs ran no step, which GitHub couldn't start, as in its outage of 9 November 2026,
# it leaves alone with a notice: another try while GitHub fails would only fail and
# mail again, and a bot that GitHub keeps failing ends with a notice as well (decision
# 0136). A pull request names its jobs and steps and writes its logs, so the issue
# shows them only as code, and the branch of a fork not at all.
#
# The bot for stopped checks runs the failed jobs of a check once more that failed
# outside the code in two ways: Harden-Runner couldn't block, mostly in an outage of
# GitHub (decision 0134), or GitHub Pages or Sigstore kept Docs from publishing the
# website of a push to the default branch, when only the jobs that publish it and ask
# for it failed, or the job docs failed only to hand it to GitHub Pages, twice
# (decision 1110). The website is signed before it is published, so a failure of
# Sigstore publishes nothing; the bot-health bot starts Docs once more the next day
# when that try failed as well.
#
# The start of the branch bot: a required check of a pull request that failed for good,
# also of one from a fork, moves the line of the branch bot in update-branches.yml on to
# the next pull request, so a job of its own starts that workflow then, with the run
# that failed. Before, the end of every check started a run of Update branches by
# itself, and nearly all of them skipped, each with a run of Bot health behind it
# (decision 0151).
#
# The bot for cancelled checks: a newer run of a workflow cancels the one still running
# for the same pull request, and that of a check or a scanner for the push to main
# before. GitHub doesn't always create the runs in the order of the commits, so a late
# run for an older commit can cancel the run for the head of the pull request, whose
# required checks then stay cancelled and block the merge, or that for the head of
# main, whose coverage, alerts of code scanning and fixes the bots read. When a run for
# the head of an open pull request or of main was cancelled that way and no newer run
# of its workflow for the same commit exists, the bot starts it again. A run that a
# person cancelled, or one whose commit a newer push replaced, stays cancelled. The
# quick checks avoid the race: their runs for different commits never cancel each
# other. A job of the first attempt that ran out of time, as one behind Harden-Runner
# can even after its last step, runs once more, where the flaky-test bot doesn't do it.
#
# A run of a commit that a newer push replaced, or whose pull request has closed, starts
# no job here that would only find that out, as the concurrency of a workflow and the
# bot for replaced commits cancel such runs by the hundred on a busy day. The event names
# the open pull requests of the branch of a run from this repository, so that their
# heads tell it before a runner starts; a run from a fork names none, and its jobs ask
# GitHub, as before.
#
# The bot for failed releases: when the release that a merge started fails, such as
# at a push of its tag that GitHub refused for a moment, it runs the failed jobs once
# more, where they stopped, instead of leaving the release and its rollout to a
# person. The release workflow takes up a tag that it pushed already. A release that
# a person or another bot already runs again, or ran again, is theirs: the bot leaves
# it alone, and so it does a release that GitHub couldn't start, which the scheduled
# run of the release takes up.
#
# The dismissal of the accepted alerts of a pull request: after each scan of CodeQL,
# Workflow security and OSV-Scanner of a pull request from a branch of this repository,
# a job calls the reusable workflow of Findings of the issue assistant, at the pin of
# findings.yml, which dismisses the alerts of the pull request that .github/findings.toml
# accepts, so that their review threads don't block the merge. Findings itself runs for
# main alone, with [findings] pull_requests = false in .github/issue-assistant/config.toml:
# before, each scan of a pull request started a run of it and one of Bot health behind
# it, about 7,200 runs a week in the repositories of the blueprint. A second job tries
# once more after any failure of the first, as nothing runs a job here again, and a
# third says so on the pull request, once for each commit, when the second fails as
# well (decision 1043). A fork's pull request keeps its threads for a person.
#
# The PR coach: after every run of the checks of a pull request, one comment on it
# explains each check that failed: what it found, why that matters and how to fix
# it, with the commands to run, from the explanations of .github/checks.toml and
# .github/checks.project.toml. It works for a pull request from a fork as well, whose
# own runs can't write to it. The comment follows every push and turns into a short
# all-clear once every check passes. A check that was cancelled, as a job that ran out
# of time is, hasn't passed either, and commits that block the merge, because the rules
# of its base branch require a verified signature that they lack, allow no all-clear
# and no word about the merge, also before their check signed commits has ended: the
# coach asks GitHub for them itself. It reads the check runs and their annotations from
# the API and shows their text only as code, and waits up to three minutes for the
# checks of other apps, such as the alerts of code scanning, which end after the last
# workflow. The scanners, which run in the pull requests that change what they read,
# start it as well, and so does the check of the rules of Renovate where Renovate
# runs in the repository. On a pull request of a person, the comment also says what the
# pull request makes: the next version, from its title and the release-please files
# of main, and the entry that it adds to the changelog; the coverage of its tests
# against that of main, file by file, from the coverage reports that the checks keep
# as the artifact "coverage", which a pull request from a fork writes as it likes;
# the website that the check docs built, with the pages that it changes; and the part
# that a workflow of the project adds, such as one of visual tests: the report.md of
# its artifact pr-report-<name> for the head, under the title that [report.<name>] of
# .github/checks.project.toml of main gives it, with its text only as code. A pull
# request whose checks never failed gets the comment only when it has something of
# this to say, and one of a bot never.
#
# The fix bot: a check whose findings a command fixes, such as the format of the code,
# the whitespace of a text file or the rules of markdownlint, runs the commands of
# autofix in .github/checks.toml when it fails, on the head of the pull request or on
# main, and keeps the files that they changed as an artifact fixes-*. A check in any
# workflow of the list below may do so, also in one of the project's own, and no other
# workflow can: the list of main decides. Once the checks of the commit whose
# workflows on main keep fixes have ended, the bot takes these files as data: on a pull
# request from a branch of this repository, also one of Renovate or another bot, it
# commits them as one commit onto the branch, as the release app, so that the checks
# run again; on one from a fork, which this bot never pushes to, it suggests them at
# their lines, at most ten in one review, never one twice, and a person with write
# access asks for the commit there with /fix, in commands.yml; on main, it keeps one
# pull request from bot/self-heal with them, which merges itself, and closes it once
# main needs no fix. Lint and the CI also run on main each week, by their schedule or by hand,
# as bot health starts a schedule that GitHub missed, so that what no commit changes, such
# as a new rule of a tool, repairs itself the same way before it fails the next pull
# request; a weekly run that passes starts no job here, so a quiet week takes no runner
# of the bot. blueprint.py of main lets through only text files that the commit has
# already, outside .git and the workflows, at the paths that the explanation of the
# check of each artifact names in writes of the catalog of main. It commits at most twice in a row onto its own commits,
# and leaves a pull request with the label no-bot-fixes alone. When the bot fails, it
# says so on the pull request; on main, it keeps one issue open until it passes again.
# A check still running after the wait, such as long end-to-end tests, leaves the commit
# to the job after its own end, however it ends: so that job starts after every run of a
# check for the head of a pull request from a branch of this repository, and ends at
# once when the commit has no fix. A commit before would cancel that run and use up one
# of the two commits. A fork and main act on what has ended, since a suggestion and the
# pull request of main cancel no run.
#
# The title and the entry of the changelog fix themselves in a job of their own, after a
# failed run of the check of the title, on a branch of this repository: the bot sets the
# title that the PR coach suggests when only its form differs, as the type and the
# breaking mark decide the version, and commits one draft of the missing entry from that
# title, once for each pull request. The draft is the one new file that a bot of the
# fixes adds, which blueprint.py of main names and writes itself in changelog.d/. No
# artifact and nothing of the code of a pull request reaches this job.
#
# The diagram bot: when the check diagrams of Lint finds a ```mermaid block, which
# the GitHub app shows as code, or pictures of diagrams that differ from their sources
# in docs/diagrams/, in a pull request from a branch of this repository, it commits
# what scripts/diagrams.sh --extract changed in the check onto that branch, as the
# release app, so that the checks run again, and says in a comment which blocks became
# pictures. blueprint.py of main takes only sources, SVG pictures and pages of
# Markdown from the artifact "diagrams". When the bot can't commit, it says so on the
# pull request, with the command. A pull request from a fork keeps the failing check,
# with the command that fixes it.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_run:
    # The checks of this repository, its end-to-end tests if a workflow of its own named Docker E2E runs them,
    # and the workflows of its other tests that the answer test_workflows of the blueprint names.
    # Then those of the other required checks and of the scanners, the same in every repository, Renovate for the check of its rules where it runs in the repository, and the release.
    workflows: [CI (php), Docker E2E, Demo, Visual check, CodeQL, Docs, Lint, Pull request title, Quick checks, Fuzzing, Links, OSV-Scanner, Workflow security, Release]
    types: [completed]

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"
  # Each call of its API asks for the version of the REST API that the steps are
  # written for (decision 0125).
  API_VERSION_HEADER: "X-GitHub-Api-Version: 2022-11-28"
  # What every step of a bot here that calls GitHub runs first, with eval "$OUTAGE":
  # one copy for every step, which needs no checkout, as a checkout fails in an outage
  # too (decision 0155). GitHub answers a call now and then with an error of its own,
  # a 5xx, or not in time, and for minutes in an outage, as on 8 and 9 November 2026:
  # tried runs a call of gh again then, four times in all, 10, 20 and 40 seconds
  # apart, and prints what it printed only once it worked; once runs a call that
  # writes, such as a comment, only once, as GitHub may have done it before it
  # failed. Any other error, such as a refusal, stops either at once; the last one
  # stays in $RUNNER_TEMP/gh-errors, and given_up says whether it was GitHub's. When
  # GitHub keeps failing, the trap ends the step with a notice instead of a failure:
  # the next event or the bot-health bot catches up, and a person has nothing to do
  # (decision 0136), and leaves $RUNNER_TEMP/github-sat-out for the steps after it,
  # as a job that sat out an outage passed nothing. A step says in INSTEAD what it
  # does instead, if it does more than nothing.
  OUTAGE: |
    outage="$RUNNER_TEMP/github-unavailable"
    unavailable() {
      local status=$?
      if ((status)) && [[ -e "$outage" ]]; then
        echo "::notice title=GitHub is unavailable::GitHub kept failing ($(head -n 1 "$RUNNER_TEMP/gh-errors")), as in an outage of GitHub (https://www.githubstatus.com), so ${INSTEAD:-the bot did nothing this time}; its next run catches up. Nothing to do for a person."
        touch "$RUNNER_TEMP/github-sat-out"
        exit 0
      fi
    }
    trap unavailable EXIT
    calls() {
      local waits="$1" wait output
      shift
      rm -f "$outage"
      for wait in $waits; do
        if output="$("$@" 2>"$RUNNER_TEMP/gh-errors")"; then
          printf '%s\n' "$output"
          return 0
        fi
        if ! grep -qiE 'HTTP 5[0-9]{2}|timeout|timed out|connection reset|unexpected EOF' "$RUNNER_TEMP/gh-errors"; then
          cat "$RUNNER_TEMP/gh-errors" >&2
          return 1
        fi
        if ((wait == 0)); then
          touch "$outage"
          cat "$RUNNER_TEMP/gh-errors" >&2
          return 1
        fi
        echo "GitHub failed, so gh tries again in $wait seconds: $(head -n 1 "$RUNNER_TEMP/gh-errors")" >&2
        sleep "$wait"
      done
    }
    tried() { calls "10 20 40 0" "$@"; }
    once() { calls 0 "$@"; }
    given_up() { [[ -e "$outage" ]]; }

jobs:
  rerun:
    name: run the failed jobs again
    # The tests only; the other checks fail the same way again, and the release has
    # a bot of its own. Of the tests, a job that failed in a step that can't pass
    # without a change fails the same way again too.
    if: >-
      !github.event.repository.fork &&
      !contains(fromJSON('["CodeQL", "Docs", "Lint", "Pull request title", "Quick checks", "Fuzzing", "Links", "OSV-Scanner", "Workflow security", "Release"]'), github.event.workflow_run.name) &&
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt == 1 &&
      (!contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event) ||
      (github.event.workflow_run.head_repository.full_name != github.repository ||
      contains(github.event.workflow_run.pull_requests.*.head.sha, github.event.workflow_run.head_sha)))
    concurrency:
      group: ${{ github.workflow }}-flaky-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read # the head of a branch, and the explanations of the checks
      pull-requests: read # the head of a pull request
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting. One that took its changes back says so in its log, and
          # no status will come.
          log=/home/agent/agent.log
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            grep -qs 'Reverted changes' "$log" && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          # Before its firewall stands, the agent looks up each host that it allows, and
          # takes itself away again when a single lookup fails; its log names the host.
          lookup="$(grep -s -m 1 'Error resolving allowed domain' "$log" || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ -n "$lookup" ]]; then
            # The host follows "resolve domain" when the resolver answered with an
            # error, and "name=" when no resolver could be reached.
            what="a host that it allows"
            pattern='resolve domain ([^ ,]+)|name=([^&" ]+)'
            if [[ "$lookup" =~ $pattern ]]; then
              host="${BASH_REMATCH[1]:-${BASH_REMATCH[2]}}"
              what="${host%.}, a host that it allows,"
            fi
            why="has an agent that took itself away again because a single lookup of $what failed, which is no outage,"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          [[ -z "$lookup" ]] || echo "The log of the agent: $lookup"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      # The default branch, for blueprint.py and the explanations of the checks, never
      # the code of the run, which comes only from the API. A checkout that fails leaves
      # the steps unread, and every failed job runs once more, as before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Read the steps that can't pass when they run again
        if: steps.checkout.outcome == 'success'
        # The steps of scripts/check.sh whose explanation says rerun = false, one on
        # each line, from the catalogs of the default branch (decision 0181).
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          if ! python3 "$script" coach final-steps > "$RUNNER_TEMP/final-steps"; then
            rm -f "$RUNNER_TEMP/final-steps"
            echo "::warning::The explanations of the checks of the default branch can't be read, so every failed job runs once more."
          fi
      - name: Run the failed jobs once more
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          eval "$OUTAGE"
          # The jobs of an attempt that failed or ran out of time, by name, given the
          # conclusion of the attempt: GitHub cancels a job at its time limit and says
          # so in an annotation. An attempt that a newer run cancelled broke nothing; it
          # is the business of the bot for cancelled checks. In one that a person or a
          # time limit cancelled, only the jobs that ran out of time broke: a job that
          # waits for the others fails when they are cancelled. A job that failed without
          # a step and without an annotation never ran: GitHub couldn't start it, as in
          # its outage of 9 November 2026. One without a step that has an annotation,
          # such as a condition that GitHub couldn't evaluate or a job that no runner
          # took, broke. With a third argument, only the jobs it names.
          broken() {
            local jobs id conclusion name steps messages found=""
            jobs="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$1/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .conclusion, .name, (.steps | length)] | @tsv')" ||
              return 1
            while IFS=$'\t' read -r -u 4 id conclusion name steps; do
              if [[ -z "$id" ]] || [[ "$conclusion" == failure && "$2" == cancelled ]]; then
                continue
              fi
              if [[ "$conclusion" == failure && "$steps" == 0 ]]; then
                messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate --jq '.[].message')" ||
                  return 1
                if [[ -z "$messages" ]]; then
                  continue
                fi
              fi
              if [[ "$conclusion" == cancelled ]]; then
                messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate --jq '.[].message')" ||
                  return 1
                if grep -q "higher priority waiting request" <<<"$messages"; then
                  return 0
                fi
                if ! grep -q "has exceeded the maximum execution time" <<<"$messages"; then
                  continue
                fi
              fi
              if [[ -z "${3:-}" ]] || grep -Fxq -- "$name" <<<"$3"; then
                found+="$name"$'\n'
              fi
            done 4<<<"$jobs"
            printf '%s' "$found"
          }
          now="$(broken "$RUN/attempts/1" "$CONCLUSION")"
          if [[ -z "$now" && "$CONCLUSION" == failure ]]; then
            # Another try while GitHub fails would fail too, and mail again.
            echo "::notice title=GitHub is unavailable::GitHub couldn't start the failed jobs of $NAME, as in an outage of GitHub (https://www.githubstatus.com), so the bot leaves the run alone instead of trying again while GitHub fails. Nothing of the code failed."
            echo "No job of $NAME failed in a step: GitHub couldn't start them, so the bot leaves the run alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$now" ]]; then
            echo "No job of $NAME failed or ran out of time; a newer run or a person cancelled it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A failure that the bot doesn't run again failed for good at once: for a
          # pull request, the bot starts the branch bot, which moves its line on, as the
          # job branches does after the second attempt, which never comes now. Not for
          # a check of a fork that runs on pull_request_target, as that job neither
          # (decision 0151).
          for_good() {
            if [[ "$EVENT" != pull_request && ("$EVENT" != pull_request_target || "$HEAD_REPO" != "$GH_REPO") ]]; then
              return 0
            fi
            if ! tried gh workflow run update-branches.yml --field after="$RUN" --field attempt=1 >/dev/null; then
              echo "::error title=The branch bot didn't start::GitHub didn't start Update branches after $NAME failed for good; its next run, after a merge or on its schedule, moves the line on."
              exit 1
            fi
            echo "$NAME failed for good, so the branch bot moves its line on." >> "$GITHUB_STEP_SUMMARY"
          }
          # A job that failed in a step of scripts/check.sh that can't pass without a
          # change, such as Psalm or Files of the project, would only fail the same way
          # again (decision 0181). The PR coach names that step in the title of its
          # annotation, and the catalogs of the default branch say which steps can't
          # pass when they run again. Only when every job that broke failed in such a
          # step does the run stay as it is: one that ran out of time, one that
          # Harden-Runner stopped, and one that failed in a test, a download or
          # anywhere else for which the coach names no such step runs again with the
          # others, as does every job when the steps couldn't be read.
          settled() {
            local jobs id conclusion name titles title step steps found=""
            [[ -s "$RUNNER_TEMP/final-steps" ]] || return 1
            jobs="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .conclusion, .name] | @tsv')" ||
              return 1
            while IFS=$'\t' read -r -u 8 id conclusion name; do
              if [[ -z "$id" ]] || ! grep -Fxq -- "$name" <<<"$now"; then
                continue
              fi
              [[ "$conclusion" == failure ]] || return 1
              titles="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate \
                --jq '.[] | (.title // "") | select(startswith("PR coach: ") and endswith(" (scripts/check.sh)"))')" ||
                return 1
              [[ -n "$titles" ]] || return 1
              steps=""
              while read -r title; do
                step="${title#PR coach: }"
                step="${step% (scripts/check.sh)}"
                grep -Fxq -- "$step" "$RUNNER_TEMP/final-steps" || return 1
                steps+="${steps:+, }$step"
              done <<<"$titles"
              found+="$name, in $steps"$'\n'
            done 8<<<"$jobs"
            printf '%s' "$found"
          }
          if settled="$(settled)" && [[ -n "$settled" ]]; then
            mapfile -t jobs <<<"$settled"
            {
              echo "Each job of $NAME that broke failed in a step of scripts/check.sh that can't pass when it runs again without a change, so they don't run again:"
              printf -- '- %s\n' "${jobs[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            for_good
            exit 0
          fi
          # A failure that the commit before ended with as well is a real one: the same
          # jobs broke in the last attempt of the run for the previous commit of the
          # branch, after the bot had run them once more. A run that a newer push
          # cancelled ran too little to tell, so the run before it counts. When that
          # can't be read, the jobs run once more.
          superseded() {
            local ids id messages
            ids="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$1/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "cancelled") | .id')" || return 1
            while read -r -u 5 id; do
              if [[ -z "$id" ]]; then
                continue
              fi
              messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate --jq '.[].message')" ||
                return 1
              if grep -q "higher priority waiting request" <<<"$messages"; then
                return 0
              fi
            done 5<<<"$ids"
            return 1
          }
          candidates="$(tried gh api --header "$API_VERSION_HEADER" --method GET "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs" \
            -f branch="$BRANCH" -f event="$EVENT" -f status=completed -f per_page=30 \
            --jq ".workflow_runs | map(select(.id < $RUN and .head_sha != \"$SHA\" and .head_repository.full_name == \"$HEAD_REPO\")) | .[:5][] | [.id, .conclusion] | @tsv" ||
            true)"
          previous=""
          while IFS=$'\t' read -r -u 6 id conclusion; do
            if [[ -z "$id" ]] || { [[ "$conclusion" == cancelled ]] && superseded "$id"; }; then
              continue
            fi
            previous="$id"$'\t'"$conclusion"
            break
          done 6<<<"$candidates"
          # A job that stopped because Harden-Runner couldn't block, as in an outage of
          # GitHub that lasts over several commits, failed for none of them (decision 0134).
          stopped() {
            local ids id messages
            ids="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id')" || return 1
            while read -r -u 7 id; do
              if [[ -z "$id" ]]; then
                continue
              fi
              messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate --jq '.[].message')" ||
                return 1
              if grep -qF "would reach every host, and it stops here instead" <<<"$messages"; then
                return 0
              fi
            done 7<<<"$ids"
            return 1
          }
          if [[ -n "$previous" ]] &&
            [[ "$(broken "${previous%%$'\t'*}" "${previous#*$'\t'}" "$now" | sort)" == "$(sort <<<"$now")" ]] &&
            ! stopped; then
            mapfile -t jobs <<<"$now"
            {
              echo "The same jobs of $NAME broke for the commit before, so they don't run again:"
              printf -- '- %s\n' "${jobs[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            for_good
            exit 0
          fi
          # Run again, the run of a commit that a newer push replaced would share the
          # concurrency group of the run for the newest commit, and cancel it, as in
          # Dennis-Otto/paperless-sync#486: only the run of the head of its pull request,
          # or of its branch, runs again. The bot looks last, just before the rerun, as
          # a push may land while it reads the jobs; a run of a schedule or by hand
          # shares its group with no other run.
          case "$EVENT" in
            push)
              # A branch that is gone has no head.
              if ! tip="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)"; then
                grep -q "HTTP 404" "$RUNNER_TEMP/gh-errors" || exit 1
                tip=""
              fi
              if [[ -z "$tip" ]]; then
                echo "The branch $BRANCH of ${SHA:0:7} is gone, so the failed jobs of its run of $NAME don't run again." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              elif [[ "$tip" != "$SHA" ]]; then
                echo "${SHA:0:7} is no longer the head of $BRANCH, so the failed jobs of its run of $NAME don't run again: they would cancel the run for the newer commit." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              ;;
            pull_request | pull_request_target)
              number="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$SHA/pulls" \
                --jq "map(select(.state == \"open\" and .head.sha == \"$SHA\")) | .[0].number // empty")"
              if [[ -z "$number" ]]; then
                echo "${SHA:0:7} is not the head of an open pull request any more, so the failed jobs of its run of $NAME don't run again." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              ;;
          esac
          # A person or a try before may have started it again already, which is fine.
          if ! tried gh run rerun "$RUN" --failed; then
            if grep -q "already running" "$RUNNER_TEMP/gh-errors"; then
              echo "The failed jobs of $NAME run once more already." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          echo "The failed jobs of $NAME run once more: a flaky test passes now." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  report:
    name: report the flaky tests
    if: >-
      !github.event.repository.fork &&
      !contains(fromJSON('["CodeQL", "Docs", "Lint", "Pull request title", "Quick checks", "Fuzzing", "Links", "OSV-Scanner", "Workflow security", "Release"]'), github.event.workflow_run.name) &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1
    concurrency:
      group: ${{ github.workflow }}-flaky-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read # the file of the workflow, which names the jobs that each job needs
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting. One that took its changes back says so in its log, and
          # no status will come.
          log=/home/agent/agent.log
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            grep -qs 'Reverted changes' "$log" && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          # Before its firewall stands, the agent looks up each host that it allows, and
          # takes itself away again when a single lookup fails; its log names the host.
          lookup="$(grep -s -m 1 'Error resolving allowed domain' "$log" || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ -n "$lookup" ]]; then
            # The host follows "resolve domain" when the resolver answered with an
            # error, and "name=" when no resolver could be reached.
            what="a host that it allows"
            pattern='resolve domain ([^ ,]+)|name=([^&" ]+)'
            if [[ "$lookup" =~ $pattern ]]; then
              host="${BASH_REMATCH[1]:-${BASH_REMATCH[2]}}"
              what="${host%.}, a host that it allows,"
            fi
            why="has an agent that took itself away again because a single lookup of $what failed, which is no outage,"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          [[ -z "$lookup" ]] || echo "The log of the agent: $lookup"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Add the jobs that failed at first to the issue of flaky tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          WHEN: ${{ github.event.workflow_run.updated_at }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # The workflow of the run, whose runs of the 7 days before tell a failure
          # outside the code that keeps coming back.
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
          # The seconds for which the look back asks about the runs of a later attempt:
          # about 2.4 seconds for each while GitHub answers, so some 50 runs, as many
          # as the busiest workflow of the fleet had in 7 days, within the 5 minutes
          # of the job.
          LOOK_BACK_TIME: "120"
          # The file of the workflow at the commit of the run, which names the jobs
          # that each job needs.
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          # The text before the name of each test or step in a log that pytest didn't
          # write, such as "Browser step:"; the answer test_marker of the blueprint sets it.
          MARKER: ""
        run: |
          eval "$OUTAGE"
          # Lengths in characters, not bytes, so that a cut keeps every character whole.
          export LC_ALL=C.UTF-8
          # A cell of the table, as code: the names and the logs of a pull request reach
          # it, so it keeps no backtick, line break or pipe of their own, and no more
          # than a line.
          cell() {
            local text
            text="$(printf '%s' "$1" | tr -d '`' | tr '\000-\037\177' ' ' | sed 's/|/\\|/g')"
            if ((${#text} > 150)); then
              text="${text:0:149}…"
            fi
            if [[ -n "${text// /}" ]]; then
              # The backticks are Markdown, not the shell's.
              # shellcheck disable=SC2016
              printf '`%s`' "$text"
            else
              printf '–'
            fi
          }
          # A text on one line for a warning of the run, which keeps no control
          # character and escapes each percent sign, the start of an escape of the
          # runner's, as %25, which the run shows as a percent sign again.
          plain() {
            printf '%s' "$1" | tr '\000-\037\177' ' ' | sed 's/%/%25/g'
          }
          # A log keeps the colors of the commands that its steps ran. Since v2.97.0,
          # gh api prints a raw answer with such escape sequences only with
          # --allow-escape-sequences, and fails without it; an older gh knows no such
          # option and prints the log as it is.
          allow=()
          if [[ "$(gh help api)" == *--allow-escape-sequences* ]]; then
            allow=(--allow-escape-sequences)
          fi
          # The words of a step that says why it failed: a check that GitHub kept
          # failing (CHECK_UNAVAILABLE of blueprint/outage.py, and .github/download.sh),
          # a job that only sums up the jobs that it needs, as variants does, and
          # Harden-Runner, which couldn't block (decision 0134). The report job has no
          # checkout, so they live here.
          UNAVAILABLE="as in an outage of GitHub or of the network of the runner"
          SUMS_UP="this job only sums up the jobs that it needs"
          STOPPED="would reach every host, and it stops here instead"
          TIMED="has exceeded the maximum execution time"
          export UNAVAILABLE SUMS_UP STOPPED
          # A failure of the code or one outside it (decision 1096). Each job that
          # failed in the first attempt, or ran out of time there, is judged by what
          # the bot reads anyway: its steps, its annotations, which carry the tests of
          # the JUnit reports, and its log. The exceptions come first. A job that was
          # cancelled without its time limit failed because others were, and a
          # "higher priority waiting request" means that a newer run took over: no test
          # failed. A job that ran out of time although each of its steps had passed,
          # up to "Complete job", failed in no test either: its runner did the work and
          # never reported that the job ended, as a preview runner such as
          # ubuntu-24.04-firewall sometimes does. Nor did a job that Harden-Runner
          # stopped, a check that GitHub kept failing, which says so, as in
          # Dennis-Otto/repo-blueprint#970, or a job that only sums up the jobs that it
          # needs: the one that failed has its own row, or failed in no test. Only when
          # nothing else of the job's own failed, though: a step that runs after one
          # that failed, as in the job Lint, can fail in a test of its own, which shows
          # as another error or as one more exit of a step than these errors. The PR
          # coach's explanation of the check is no error of the job's own.
          #
          # Then a sign of the code keeps the row: a test, in an annotation that
          # blueprint/annotate.py writes from a JUnit report or in the log; a step of
          # scripts/check.sh that stopped, which the PR coach names at any level; a
          # command that exited; or a finding, a failure at a file of the repository.
          # Otherwise the section of the log where the job broke decides, by the
          # runner's own lines, never by what a step prints: a command is the code, and
          # so is an action of the repository itself; an action of another repository,
          # a post step, the set-up of the job and a runner that hung after the work of
          # the job are outside it. The sections of the PR coach and of the steps that
          # said why they failed don't count, with their exits. A job without a log goes
          # by its steps that broke, and one that ran out of time without a step that
          # broke and without a log broke in its runner: a runner that is alive cancels
          # a step that hangs and uploads its log.
          #
          # A job sums up the jobs that it needs, as variants or the gate of end-to-end
          # tests does, when its definition in the file of the workflow at the commit
          # of the run, found by its name, or by its key where it has none, has needs
          # and an if with always() or !cancelled(), and a job that it needs failed or
          # was cancelled in the same attempt: that one has its own row, or failed in
          # no test. A name with an expression, as a matrix has, is no such name. The
          # file is read once, with the yq and the jq of the runner, and without it
          # the bot goes by the words of SUMS_UP alone, with a notice.
          defined=""
          read_definitions=""
          definitions() {
            local file="$RUNNER_TEMP/workflow.yml"
            [[ -z "$read_definitions" ]] || return 0
            read_definitions=true
            if ! tried gh api --header "$API_VERSION_HEADER" --header "Accept: application/vnd.github.raw+json" \
              "repos/$GH_REPO/contents/${WORKFLOW_PATH%%@*}?ref=$SHA" >"$file" ||
              ! defined="$(yq -o=json '.jobs // {}' "$file" | jq -r '. as $jobs | to_entries[] | select(.value | type == "object" and has("needs"))
                | .key as $key | .value as $job | ($job.needs | if type == "array" then .[] else . end | tostring) as $need
                | [($job.name // $key | tostring), ($job.if // "" | tostring | gsub("\\s+"; " ")), ($jobs[$need].name // $need | tostring)] | @tsv')"; then
              echo "::notice::The file of the workflow, $(plain "$WORKFLOW_PATH") at ${SHA:0:7}, couldn't be read, so a job that only sums up the jobs that it needs counts unless it says so."
              defined=""
            fi
          }
          sums_up() {
            local job="$1" own condition need other prefix opening='$''{{' pattern='always\(\)|![[:space:]]*cancelled\(\)'
            definitions
            while IFS=$'\t' read -r own condition need; do
              [[ -n "$own" && "$own" == "$job" && "$own" != *"$opening"* && "$condition" =~ $pattern ]] || continue
              prefix="${need%%"$opening"*}"
              while IFS= read -r other; do
                [[ -n "$other" && "$other" != "$job" ]] || continue
                if [[ "$other" == "$need" || "$other" == "$need ("* ]] ||
                  [[ "$prefix" != "$need" && -n "$prefix" && "$other" == "$prefix"* ]]; then
                  return 0
                fi
              done <<<"$broken"
            done <<<"$defined"
            return 1
          }
          # judge sets verdict to skip, clear, stuck, outside or code, and the tests,
          # the error and where the job broke.
          judge() {
            local id="$1" conclusion="$2" passed="$3" name="$4" steps="$5"
            local annotated errors coached reported said exits others log missing broke part
            verdict=skip
            names=""
            error=""
            where=""
            # Each annotation on a line of its own: its level, its title, its file, and
            # its text. A job without annotations that GitHub gives has no error of its
            # own here; the row takes it from the log. GitHub documents no order for
            # them, and the coach's often comes first, although its step runs after the
            # one that failed, so its title tells it apart, never its place.
            if ! annotated="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$id/annotations" --paginate \
              --jq '.[] | .annotation_level + "\t" + (.title // "" | gsub("\\s+"; " ")) + "\t" + (.path // ".github")
                + "\t" + (.message | gsub("\\s+"; " "))')"; then
              given_up && exit 1
              annotated=""
            fi
            errors="$(awk -F '\t' '$1 == "failure" { print $4 }' <<<"$annotated")"
            coached="$(awk -F '\t' '$1 == "failure" && index($2, "PR coach: ") == 1 { print $4 }' <<<"$annotated")"
            reported="$(awk -F '\t' '$1 == "failure" && index($2, "PR coach: ") != 1 { print $4 }' <<<"$annotated")"
            if grep -q "higher priority waiting request" <<<"$errors"; then
              verdict=clear
              return 0
            fi
            if [[ "$conclusion" == cancelled ]] && ! grep -qF "$TIMED" <<<"$errors"; then
              return 0
            fi
            if [[ "$conclusion" == cancelled && "$passed" == true ]]; then
              verdict=stuck
              where="the runner, after every step had passed"
              error="$(grep -F "$TIMED" <<<"$errors" | head -n 1)"
              return 0
            fi
            if grep -qF "$STOPPED" <<<"$errors"; then
              return 0
            fi
            said="$(grep -cF -e "$UNAVAILABLE" -e "$SUMS_UP" <<<"$errors" || true)"
            exits="$(grep -cE '^Process completed with exit code [0-9]+\.?$' <<<"$errors" || true)"
            if ((said > 0)); then
              others="$(grep -vF -e "$UNAVAILABLE" -e "$SUMS_UP" <<<"$reported" |
                grep -cvE '^(Process completed with exit code [0-9]+\.?)?$' || true)"
              if ((others == 0 && exits <= said)); then
                return 0
              fi
            fi
            # Only a job with no error of its own beside its exit sums up the jobs that
            # it needs.
            others="$(grep -cvE '^(Process completed with exit code [0-9]+\.?)?$' <<<"$reported" || true)"
            if ((others == 0)) && sums_up "$name"; then
              return 0
            fi
            # A log that GitHub doesn't give, such as that of a job that never started,
            # leaves the row without its tests, and a warning of the run says why; so
            # does one that GitHub kept failing, as the report is worth more than a log.
            # After a log that GitHub kept failing, the report asks for no more: it
            # would wait for each of them, longer than the job may run.
            missing=""
            if [[ -n "$no_logs" ]]; then
              log=""
            elif ! log="$(tried gh api --header "$API_VERSION_HEADER" "${allow[@]}" "repos/$GH_REPO/actions/jobs/$id/logs")"; then
              echo "::warning::The log of the job $(plain "$name") couldn't be read, so the report names none of its tests: $(plain "$(head -n 1 "$RUNNER_TEMP/gh-errors")")"
              log=""
              if grep -q "HTTP 404" "$RUNNER_TEMP/gh-errors"; then
                missing=true
              fi
              if given_up; then
                no_logs=true
              fi
            fi
            log="$(sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9-]+T[0-9:.]+Z //' <<<"$log")"
            # The tests that pytest names in the log. Other tests, such as those of a
            # browser, write the marker and the name of each test or step as it starts:
            # the one that the log names last before its first error failed, and the
            # first exception after that line is its error. Only the step of the job
            # that failed counts, not one that passed before it. Workers that run side
            # by side put a prefix of their own before their lines, such as "[1/4] " or
            # "browser-1  | ": the first exception before the error names the worker
            # that failed, and so the last step of that worker, not of one that kept
            # going and passed. Without an exception, the last step that any of them
            # started counts.
            local failed thrown since step
            failed="$(grep -E '^(FAILED|ERROR) [^ ]+\.py(::| |$)' <<<"$log" | head -n 3)"
            names="$(sed -nE 's/^[A-Z]+ ([^ ]+).*/\1/p' <<<"$failed")"
            thrown=""
            if [[ -z "$names" && -n "$MARKER" ]]; then
              since="$(awk '
                /^##\[error\]/ { exit }
                /^##\[group\]Run / { split("", kept); split("", known); n = 0; last = ""; picked = 0; next }
                {
                  at = index($0, ENVIRON["MARKER"])
                  if (at) {
                    own = substr($0, 1, at - 1)
                    if (!(own in kept)) { known[++n] = own }
                    if (!(picked && own == chosen)) { kept[own] = "" }
                    last = own
                  } else {
                    found = 0
                    for (i = 1; i <= n; i++) {
                      if (substr($0, 1, length(known[i])) == known[i] && (!found || length(known[i]) > length(own))) {
                        own = known[i]
                        found = 1
                      }
                    }
                    if (!found) { next }
                    if (!picked && $0 ~ /Traceback \(most recent call last\)|(Error|Exception|Failure): /) {
                      chosen = own
                      picked = 1
                    }
                  }
                  kept[own] = kept[own] $0 "\n"
                }
                END { printf "%s", kept[picked ? chosen : last] }
              ' <<<"$log")"
              step="$(head -n 1 <<<"$since")"
              # A step that names itself again when it passed adds its seconds.
              names="$(sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]*\([0-9]+(\.[0-9]+)? ?(ms|s|min)\)$//' <<<"${step#*"$MARKER"}")"
              thrown="$(grep -oE '([A-Za-z_][A-Za-z0-9_]*\.)*[A-Za-z0-9_]*(Error|Exception|Failure): .*[^[:space:]]' <<<"$since" | head -n 1)"
            fi
            # The error that the job reported itself comes first, then the line of
            # pytest and the exception of the log, then the coach's explanation of what
            # the check usually finds, and the exit code last.
            error="$(grep -v -e '^Process completed with exit code' -e '^The operation was canceled' <<<"$reported" | head -n 1)"
            if [[ -z "$error" ]]; then
              error="$(sed -nE '1s/^[A-Z]+ [^ ]+ - //p' <<<"$failed")"
            fi
            if [[ -z "$error" ]]; then
              error="$thrown"
            fi
            if [[ -z "$error" ]]; then
              error="$(head -n 1 <<<"$coached")"
            fi
            if [[ -z "$error" ]]; then
              error="$(head -n 1 <<<"$errors")"
            fi
            verdict=code
            # A test, a step of scripts/check.sh that stopped, or a finding: a failure
            # at a file of the repository, which a warning there is not.
            if [[ -n "$names" ]] || awk -F '\t' '
              ($1 == "failure" && $2 ~ /^(pytest|PHPUnit|Node test): /) ||
                $2 ~ /^PR coach: .* \(scripts\/check\.sh\)$/ ||
                ($1 == "failure" && $3 != ".github" && $3 != "" && !index($4, ENVIRON["UNAVAILABLE"])) { found = 1 }
              END { exit !found }
            ' <<<"$annotated"; then
              return 0
            fi
            if grep -q '^##\[group\]Run ' <<<"$log"; then
              # The runner opens the section of each step with "##[group]Run" and the
              # first line of its command or the action, echoes the command and its
              # shell in that group, and opens the section of each post step with "Post
              # job cleanup.". The lines before the first section are the set-up of the
              # job. A group that the step opens itself, such as "Getting Git version
              # info" of the checkout, opens no section.
              broke="$(OWN="$GH_REPO" awk '
                BEGIN { n = 0; head[0] = "Set up job"; kind[0] = "outside"; own = tolower(ENVIRON["OWN"]) }
                /^##\[group\]Run / { head[++n] = substr($0, 10); kind[n] = "step"; open = 1; drop[n] = index($0, "coach explain") > 0; next }
                $0 == "Post job cleanup." { head[++n] = "Post job cleanup"; kind[n] = "outside"; open = 0; next }
                open && /^##\[endgroup\]/ { open = 0; next }
                open && /^shell: / { kind[n] = "code" }
                open && /coach explain/ { drop[n] = 1 }
                /^##\[error\]/ {
                  text = substr($0, 10)
                  if (index(text, ENVIRON["UNAVAILABLE"]) || index(text, ENVIRON["SUMS_UP"]) || index(text, ENVIRON["STOPPED"])) { drop[n] = 1 }
                  if (text ~ /^Process completed with exit code [0-9]+\.?$/) { exited[n] = 1 }
                  if (text ~ /^The operation was canceled\.?$/) { cancel[n] = 1 }
                  if (!(n in first)) { first[n] = NR }
                }
                NF { last = $0 }
                END {
                  at = -1
                  for (i = 0; i <= n; i++) {
                    if (!drop[i] && exited[i]) { print "code\t" head[i]; exit }
                  }
                  for (i = 0; i <= n && at < 0; i++) {
                    if (!drop[i] && cancel[i]) { at = i }
                  }
                  for (i = 0; i <= n && at < 0; i++) {
                    if (!drop[i] && (i in first)) { at = i }
                  }
                  if (at < 0) {
                    if (last == "Cleaning up orphan processes") { print "outside\tthe runner, after the work of the job" }
                    else { print "code\tthe end of the log" }
                    exit
                  }
                  side = kind[at]
                  if (side == "step") {
                    # An action of another repository is outside the code, one of the
                    # repository itself, ./ or owner/repo of its own, and any other
                    # header, such as docker://, are the code.
                    side = "code"
                    action = substr(head[at], 5)
                    if (action ~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+(\/[^@ ]*)?@[^ ]+$/) {
                      split(action, parts, "/")
                      sub(/@.*/, "", parts[2])
                      if (tolower(parts[1] "/" parts[2]) != own) { side = "outside" }
                    }
                  }
                  print side "\t" head[at]
                }
              ' <<<"$log")"
              verdict="${broke%%$'\t'*}"
              where="${broke#*$'\t'}"
              return 0
            fi
            # A command that exited, beyond the steps that said why.
            if ((exits > said)); then
              return 0
            fi
            if [[ -n "$missing" && "$conclusion" == cancelled && -z "$steps" ]] &&
              ! grep -vF "$TIMED" <<<"$errors" | grep -q .; then
              verdict=outside
              where="the runner, which left no log"
              return 0
            fi
            # GitHub names a step without a name of its own "Run owner/repo@ref", and
            # its post step "Post Run owner/repo@ref".
            [[ -n "$steps" ]] || return 0
            while IFS= read -r part; do
              if [[ ! "$part" =~ ^(Post\ )?Run\ ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(/[^@\ ]*)?@[^\ ]+$ ]] ||
                [[ "${BASH_REMATCH[2],,}" == "${GH_REPO,,}" ]]; then
                return 0
              fi
            done <<<"${steps//, /$'\n'}"
            verdict=outside
            where="$steps"
          }
          # The jobs of the first attempts of the runs of the same workflow in the 7
          # days before the run that passed at a later attempt, once for the run: their
          # run, id, conclusion, name without the values of its matrix, and the steps
          # that broke. 10 pages of 100 runs at most, and the runs of a later attempt
          # among them for LOOK_BACK_TIME seconds at most, so that the report ends in
          # its time; it stops at once, with a warning, when GitHub keeps failing, as
          # each call of a run would wait 70 seconds for it. back says how far they
          # reached then, and why.
          looked=""
          earlier=""
          back=""
          short=""
          failing=""
          # The warning of a look-back that GitHub kept failing, which then counts only
          # as far as it got.
          cut_short() {
            echo "::warning::The runs of the 7 days before couldn't be read, so a failure outside the code counts only as far as they were: $(plain "$(head -n 1 "$RUNNER_TEMP/gh-errors")")"
          }
          look_back() {
            local since page found count run created first start=$SECONDS last="$WHEN"
            [[ -z "$looked" ]] || return 0
            looked=true
            since="$(date -u -d "@$(($(date -u -d "$WHEN" +%s) - 7 * 86400))" +%Y-%m-%dT%H:%M:%SZ)"
            local runs=""
            for page in {1..10}; do
              if ! found="$(tried gh api --header "$API_VERSION_HEADER" --method GET "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs" \
                -f created=">=$since" -f status=success -f per_page=100 -f page="$page" \
                --jq "(.workflow_runs | length | tostring) + \"\t\" + (.workflow_runs[-1].created_at // \"\"),
                  (.workflow_runs[] | select(.run_attempt > 1 and .id != $RUN and .created_at >= \"$since\") | (.id | tostring) + \"\t\" + .created_at)")"; then
                cut_short
                ! given_up || failing=true
                break
              fi
              runs+="$(tail -n +2 <<<"$found")"$'\n'
              count="$(head -n 1 <<<"$found")"
              if ((${count%%$'\t'*} < 100)); then
                break
              fi
              if ((page == 10)); then
                back="${count#*$'\t'}"
                short="1,000 runs"
              fi
            done
            # The runs come the newest first, so the last one read is as far back as
            # the look reached.
            while IFS=$'\t' read -r run created; do
              [[ -n "$run" && -z "$failing" ]] || continue
              if ((SECONDS - start >= LOOK_BACK_TIME)); then
                back="$last"
                short="as its time of $LOOK_BACK_TIME seconds was up"
                break
              fi
              if ! first="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$run/attempts/1" --jq .conclusion)"; then
                if given_up; then
                  cut_short
                  failing=true
                  back="$last"
                  short="as GitHub kept failing"
                  break
                fi
                continue
              fi
              # Today's exception: a first attempt that a newer run cancelled failed
              # in no test.
              if [[ "$first" == cancelled ]]; then
                last="$created"
                continue
              fi
              if ! found="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$run/attempts/1/jobs" --paginate \
                --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                  | [.id, .conclusion, (.name | split(" (")[0]), ([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | sort | join(", "))] | @tsv')"; then
                if given_up; then
                  cut_short
                  failing=true
                  back="$last"
                  short="as GitHub kept failing"
                  break
                fi
                continue
              fi
              last="$created"
              while IFS= read -r job; do
                [[ -z "$job" ]] || earlier+="$run"$'\t'"$job"$'\n'
              done <<<"$found"
            done <<<"$runs"
          }
          # How many runs of the 7 days before had a job of the same name, without the
          # values of its matrix, that broke in the same steps, or in none, and failed
          # or ran out of time: a job that was cancelled without its time limit, or
          # because a newer run took over, failed in no test.
          returns() {
            local key="$1" broke="$2" run job end name steps texts seen=" "
            times=0
            look_back
            while IFS=$'\t' read -r run job end name steps; do
              [[ -n "$run" && "$name" == "$key" && "$steps" == "$broke" && "$seen" != *" $run "* ]] || continue
              if [[ "$end" == cancelled ]]; then
                # After GitHub kept failing, the bot asks about no more runs, and still
                # counts those that failed.
                [[ -z "$failing" ]] || continue
                if ! texts="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$job/annotations" --paginate \
                  --jq '.[] | select(.annotation_level == "failure") | .message')"; then
                  if given_up; then
                    cut_short
                    failing=true
                  fi
                  continue
                fi
                grep -qF "$TIMED" <<<"$texts" || continue
                ! grep -q "higher priority waiting request" <<<"$texts" || continue
              fi
              seen+="$run "
              times=$((times + 1))
            done <<<"$earlier"
          }
          first="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN/attempts/1" --jq .conclusion)"
          # The steps that broke come twice: as GitHub lists them, for the table, and
          # in their order by name, as the runs before are compared by.
          fields='[.id, .conclusion, ([.steps[]?] | length > 0 and all(.conclusion == "success" or .conclusion == "skipped")), .html_url, .name,
            (.name | split(" (")[0]), ([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")),
            ([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | sort | join(", "))] | @tsv'
          jobs="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs" --paginate \
            --jq ".jobs[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\") | $fields")"
          # The names of the jobs that failed or were cancelled in the attempt, for a
          # job that only sums them up.
          broken="$(awk -F '\t' '{ print $5 }' <<<"$jobs")"
          rows=""
          # Each job with each of its tests, one to a line, for the count in the issue.
          counted=""
          # The jobs that failed outside the code, and those of them that came back.
          outside=""
          returned=""
          no_logs=""
          while IFS=$'\t' read -r -u 3 id conclusion passed url name key steps sorted; do
            # An attempt that a newer run cancelled, as one that the bot for cancelled
            # checks started again, failed in no test. In one that a person or a time
            # limit cancelled, only the jobs that ran out of time broke: a job that
            # waits for the others fails when they are cancelled.
            if [[ -z "$id" ]] || [[ "$conclusion" == failure && "$first" == cancelled ]]; then
              continue
            fi
            judge "$id" "$conclusion" "$passed" "$name" "$steps"
            shown="$steps"
            case "$verdict" in
              clear)
                rows=""
                counted=""
                outside=""
                returned=""
                break
                ;;
              skip)
                continue
                ;;
              stuck)
                echo "::notice::The job $(plain "$name") ran out of time although each of its steps had passed: its runner never reported that the job ended. That is a fault of the runner, not a flaky test, so the issue of flaky tests leaves it out."
                outside+="| [$(cell "$name")]($url) | $(cell "$steps") | $(cell "$where") | $(cell "$error") |"$'\n'
                continue
                ;;
              outside)
                # A cause outside the code that keeps coming back, such as a mirror
                # that fails or a pin that expired, is a person's to fix after all.
                returns "$key" "$sorted"
                if ((times + 1 < 3)); then
                  echo "::notice::The job $(plain "$name") failed outside the code, in $(plain "$where"), and passed when it ran again: no test failed, so the issue of flaky tests leaves it out."
                  outside+="| [$(cell "$name")]($url) | $(cell "$steps") | $(cell "$where") | $(cell "$error") |"$'\n'
                  continue
                fi
                names="outside the code"
                shown="${steps:-$where}"
                returned+="${returned:+, }$(cell "$name") ($((times + 1)) runs)"
                ;;
            esac
            tests="$(awk 'NR > 1 { printf ", " } { printf "%s", $0 }' <<<"$names")"
            rows+="| [$(cell "$name")]($url) | $(cell "$shown") | $(cell "$tests") | $(cell "$error") |"$'\n'
            while IFS= read -r test; do
              counted+="$(cell "$NAME / $name") | $(cell "$test")"$'\n'
            done <<<"$names"
          done 3<<<"$jobs"
          if [[ -n "$outside" ]]; then
            {
              echo "### Outside the code"
              echo
              echo "These jobs failed at first outside the code, in an action of another repository, a post step, the set-up of the job or the runner, and passed when they ran again. No test failed, and the issue of flaky tests leaves them out until such a failure comes back for the third time in 7 days."
              if [[ -n "$back" ]]; then
                echo
                echo "The runs before reached back only to $back, $short."
              fi
              echo
              echo "| Job | Step | Where it broke | Error |"
              echo "| --- | --- | --- | --- |"
              printf '%s' "$outside"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          title="Flaky tests"
          number="$(tried gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          # The issue of an older bot counted every failure as a test. The body of one
          # that this bot opened or has judged carries the mark, and its first
          # sentence says what it counts.
          mark="<!-- The flaky-test bot tells a failure of the code from one outside it. -->"
          before="The flaky-test bot counts here every job and test that failed at first and then passed without a change of the code, and describes each run in a comment, with the step, the test and the error that failed. Fix the test, then close this issue."
          intro="The flaky-test bot counts here every job and test that failed at first and then passed without a change of the code, and a failure outside the code that came back for the third time in 7 days, and describes each run in a comment, with the step, the test and the error that failed. Fix the test or the cause, then close this issue."
          # The body with the mark, before the counts, and with the new first sentence
          # in place of the old one.
          marked() {
            BEFORE="$before" INTRO="$intro" MARK="$mark" FROM="<!-- The flaky-test bot rewrites the counts from here to the next comment. -->" awk '
              !swapped && (at = index($0, ENVIRON["BEFORE"])) {
                $0 = substr($0, 1, at - 1) ENVIRON["INTRO"] substr($0, at + length(ENVIRON["BEFORE"]))
                swapped = 1
              }
              !done && $0 == ENVIRON["FROM"] { print ENVIRON["MARK"]; print ""; done = 1 }
              { print }
              END { if (!done) { print ""; print ENVIRON["MARK"] } }
            '
          }
          if [[ -z "$rows" ]]; then
            # An issue of an older bot may hold nothing but failures outside the code,
            # as Dennis-Otto/repo-blueprint#1090: each row of its comments is judged
            # once, by the job that it links, 20 at most. When none is the code's, the
            # issue closes; else it gets the mark, and its counts stay as they are.
            if [[ -n "$number" ]]; then
              body="$(tried gh issue view "$number" --json body --jq .body)"
              if [[ "$body" != *"$mark"* ]]; then
                linked="$(tried gh issue view "$number" --json comments \
                  --jq '[.comments[] | select(.author.login // "" | test("^(app/)?github-actions(\\[bot\\])?$")) | .body
                    | select(contains("| Job | Step |")) | scan("/actions/runs/[0-9]+/job/([0-9]+)") | .[0]] | unique | .[]')"
                mine=""
                if (($(grep -c . <<<"$linked" || true) > 20)) || [[ -z "$linked" ]]; then
                  mine=true
                fi
                while IFS= read -r job && [[ -z "$mine" ]]; do
                  if ! found="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/jobs/$job" --jq "$fields")"; then
                    mine=true
                    break
                  fi
                  IFS=$'\t' read -r id conclusion passed url name key steps sorted <<<"$found"
                  judge "$id" "$conclusion" "$passed" "$name" "$steps"
                  if [[ "$verdict" == code ]]; then
                    mine=true
                  fi
                done <<<"$linked"
                if [[ -z "$mine" ]]; then
                  once gh issue close "$number" --comment "Every row of this issue failed outside the code, in an action of another repository, a post step, the set-up of a job or the runner, and passed when it ran again: no test failed, so there is nothing to fix here, and the flaky-test bot closes this issue. A failure of a test opens a new one, and so does a failure outside the code that comes back for the third time in 7 days."
                  echo "The issue of flaky tests held only failures outside the code, so the bot closed it." >> "$GITHUB_STEP_SUMMARY"
                else
                  printf '%s\n' "$body" | tr -d '\r' | marked > "$RUNNER_TEMP/issue.md"
                  tried gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
                fi
              fi
            fi
            echo "No job failed or ran out of time at first in the code; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A fork names its branches as it likes; the issue names only those of the
          # repository.
          place="a branch of a fork"
          if [[ "$HEAD_REPO" == "$GH_REPO" ]]; then
            place="$(cell "$BRANCH")"
          fi
          report="$(printf '**%s** failed at first and passed when it ran again, on %s at %s ([the run](%s)):\n\n%s\n%s\n%s' \
            "$NAME" "$place" "${SHA:0:7}" "$URL" \
            "| Job | Step | Test | Error |" "| --- | --- | --- | --- |" "$rows")"
          if [[ -n "$returned" ]]; then
            report+="$(printf '\n\n**Outside the code, for the third time in 7 days at least:** %s. Such a cause, as a mirror that fails or a pin that expired, is yours to fix once it keeps coming back.' "$returned")"
          fi
          # Each run gets a comment, and the body of the issue counts how often each job
          # and test flaked, and when it last did, the latest first. The bot rewrites the
          # table between its two comments, which it adds to an issue that has none, and
          # keeps the 100 latest rows, well within the 65,536 characters of a body. A body
          # that a person edited in the browser ends its lines with CRLF. Two reports at
          # the same moment may miss a count, never a comment.
          if [[ -n "$number" ]]; then
            once gh issue comment "$number" --body "$report"
            body="$(tried gh issue view "$number" --json body --jq .body)"
          else
            body="$intro"
          fi
          if [[ "$body" != *"$mark"* ]]; then
            body="$(printf '%s\n' "$body" | tr -d '\r' | marked)"
          fi
          printf '%s\n' "$body" | tr -d '\r' |
            COUNTED="$counted" LAST="[${WHEN:0:10}]($URL)" \
            FROM="<!-- The flaky-test bot rewrites the counts from here to the next comment. -->" \
            UNTIL="<!-- The end of the counts. -->" \
            awk '
              function table(  i) {
                print ""
                print "**How often each job and test flaked**, the latest first:"
                print ""
                print "| Job | Test | Times | Last run |"
                print "| --- | --- | --- | --- |"
                for (i = 1; i <= n; i++) {
                  printf "| %s | %d | %s |\n", order[i], times[order[i]] + 1, ENVIRON["LAST"]
                }
                for (i = 1; i <= m && n + i <= 100; i++) {
                  print older[i]
                }
                print ""
              }
              # The jobs and tests of this run first, each once, then the older rows.
              BEGIN {
                count = split(ENVIRON["COUNTED"], lines, "\n")
                for (i = 1; i <= count; i++) {
                  if (lines[i] != "" && !(lines[i] in now)) {
                    now[lines[i]] = 1
                    order[++n] = lines[i]
                  }
                }
              }
              state == 0 && $0 == ENVIRON["FROM"] { state = 1; print; next }
              state == 1 && $0 == ENVIRON["UNTIL"] { state = 2; table(); print; next }
              state == 1 && /^\| (`|–)/ {
                split(substr($0, 3, length($0) - 4), cells, " [|] ")
                key = cells[1] " | " cells[2]
                if (key in now) {
                  times[key] = cells[3]
                } else {
                  older[++m] = $0
                }
                next
              }
              # Without the end comment, which a person may have deleted, the text after
              # the table is still theirs: it follows the new table.
              state == 1 && $0 != "" && $0 !~ /^\*\*How often each job and test flaked\*\*/ && $0 !~ /^\| (Job|---) \|/ {
                held = held $0 "\n"
              }
              state != 1 { print }
              END {
                if (state == 0) {
                  print ""
                  print ENVIRON["FROM"]
                }
                if (state != 2) {
                  table()
                  print ENVIRON["UNTIL"]
                }
                if (state == 1) {
                  printf "%s", held
                }
              }
            ' > "$RUNNER_TEMP/issue.md"
          if [[ -n "$number" ]]; then
            tried gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            created="$(once gh issue create --title "$title" --label maintenance --body-file "$RUNNER_TEMP/issue.md")"
            once gh issue comment "$created" --body "$report"
          fi
          {
            echo "### Flaky"
            echo
            echo "| Job | Step | Test | Error |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"
