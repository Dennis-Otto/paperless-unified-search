name: After the checks

# The three bots that act on a finished run of the checks. One workflow for all, so
# that every run of the checks starts one run after it, not three that mostly have
# nothing to do. None checks out or runs the code of a pull request.
#
# The flaky-test bot: when a run of the tests fails for the first time, it runs the
# failed jobs once more. A job that passes then failed without a change of the code:
# its test is flaky, and the bot reports it in one issue, so that it gets fixed
# instead of failing pull requests at random. A job that fails again is a real
# failure and stays red.
#
# The coverage bot: after the checks of a pull request, it compares the coverage of
# its tests with that of main, file by file, and keeps one comment on the pull
# request up to date. It reads the coverage reports that the checks keep as the
# artifact "coverage".
#
# The bot for cancelled checks: a newer run of a workflow cancels the one still running
# for the same pull request. GitHub doesn't always create the runs in the order of the
# commits, so a late run for an older commit can cancel the run for the head of the
# pull request; its required checks then stay cancelled and block the merge. When a
# run for the head of an open pull request was cancelled that way and no newer run of
# its workflow for the same commit exists, the bot starts it again. A run that a
# person cancelled, or one whose commit a newer push replaced, stays cancelled.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_run:
    # The checks of this repository, and its end-to-end tests if a workflow of its own named Docker E2E runs them.
    # Then those of the other required checks, the same in every repository.
    workflows: [CI (php), Docker E2E, CodeQL, Dependency review, Docs, Lint, Pull request title, Secret scan]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: run the failed jobs again
    # The tests only; the other required checks fail the same way again.
    if: >-
      !github.event.repository.fork &&
      !contains(fromJSON('["CodeQL", "Dependency review", "Docs", "Lint", "Pull request title", "Secret scan"]'), github.event.workflow_run.name) &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    concurrency:
      group: ${{ github.workflow }}-flaky-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Run the failed jobs once more
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
        run: |
          gh run rerun "$RUN" --failed
          echo "The failed jobs of $NAME run once more: a flaky test passes now." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: report the flaky tests
    if: >-
      !github.event.repository.fork &&
      !contains(fromJSON('["CodeQL", "Dependency review", "Docs", "Lint", "Pull request title", "Secret scan"]'), github.event.workflow_run.name) &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1
    concurrency:
      group: ${{ github.workflow }}-flaky-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Add the jobs that failed at first to the issue of flaky tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A run that the bot for cancelled checks started again didn't fail at first.
          if [[ "$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/1" --jq .conclusion)" == cancelled ]]; then
            echo "The first attempt was cancelled, not failed; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The backticks are Markdown of jq's output, not the shell's.
          # shellcheck disable=SC2016
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `\(.name)`"')"
          if [[ -z "$jobs" ]]; then
            echo "No job failed at first; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="Flaky tests"
          body="$(printf '%s failed at first and passed when it ran again, on %s at %s ([the run](%s)):\n\n%s\n' \
            "$NAME" "$BRANCH" "${SHA:0:7}" "$URL" "$jobs")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            printf '%s\n\n%s\n' \
              "The flaky-test bot lists here every job that failed and then passed without a change of the code. Fix its test, then close this issue." \
              "$body" > "$RUNNER_TEMP/issue.md"
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          {
            echo "### Flaky"
            echo "$jobs"
          } >> "$GITHUB_STEP_SUMMARY"

  cancelled:
    name: run the cancelled checks again
    if: >-
      !github.event.repository.fork &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.run_attempt < 3
    concurrency:
      group: ${{ github.workflow }}-cancelled-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Run the checks of the head of the pull request again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
          NAME: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only the runs for the head of a pull request report its checks.
          number="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq "map(select(.state == \"open\" and .head.sha == \"$SHA\")) | .[0].number // empty")"
          if [[ -z "$number" ]]; then
            echo "${SHA:0:7} is not the head of an open pull request; its run of $NAME stays cancelled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A newer run of the same commit reports the checks itself.
          newer="$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs?head_sha=$SHA" --paginate \
            --jq ".workflow_runs[] | select(.id > $RUN) | .id")"
          if [[ -n "$newer" ]]; then
            echo "A newer run of $NAME for ${SHA:0:7} reports the checks of #$number." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Cancelled by the concurrency of the workflow, which says so on the job.
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "cancelled") | .id')"
          raced=false
          for job in $jobs; do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --paginate --jq '.[].message' |
              grep -q "higher priority waiting request"; then
              raced=true
              break
            fi
          done
          if [[ "$raced" != true ]]; then
            echo "No newer run of $NAME cancelled it, but a person or a time limit; it stays cancelled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run rerun "$RUN"
          echo "A run for an older commit cancelled $NAME for the head of #$number; it runs again." >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: coverage comment
    # The checks that keep a coverage report, when they ran.
    if: >-
      !github.event.repository.fork &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["CI (python)", "CI (github-action)", "CI (home-assistant)", "CI (php)", "CI (node)"]'), github.event.workflow_run.name)
    concurrency:
      group: ${{ github.workflow }}-coverage-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The default branch, for blueprint.py; the pull request only gives its report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the reports of the pull request and of main
        id: reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/head" "$RUNNER_TEMP/base"
          if ! gh run download "$RUN" --name coverage --dir "$RUNNER_TEMP/head"; then
            echo "The checks kept no coverage report; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="$(gh run list --workflow "$WORKFLOW" --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$base" ]]; then
            gh run download "$base" --name coverage --dir "$RUNNER_TEMP/base" || true
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Keep one comment on the pull request up to date
        if: steps.reports.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coverage "$RUNNER_TEMP/head/coverage.xml" "$RUNNER_TEMP/base/coverage.xml" \
            > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          # A pull request from a fork isn't named in the run; its commit finds it.
          number="${NUMBER:-$(gh pr list --state open --search "$SHA" --json number --jq '.[0].number // empty')}"
          if [[ -z "$number" ]]; then
            echo "No open pull request has the commit $SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="$(head -n 1 "$RUNNER_TEMP/comment.md")"
          comment="$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment" \
              -F "body=@$RUNNER_TEMP/comment.md" --silent
          else
            gh pr comment "$number" --body-file "$RUNNER_TEMP/comment.md"
          fi
