    # their run. A job that blocks stops when Harden-Runner can't block, mostly in an
    # outage of GitHub (decision 0134). And the website of a push to the default
    # branch wasn't published, as GitHub Pages or Sigstore failed, when only the jobs
    # that publish it and ask for it failed, or the job docs failed only to hand it
    # to GitHub Pages, twice (decision 1110). The job rerun does so for the tests, and
    # the release has a bot of its own.
