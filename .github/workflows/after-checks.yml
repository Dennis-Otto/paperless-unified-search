            messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$job/annotations" --paginate --jq '.[].message')"
            if grep -q "higher priority waiting request" <<<"$messages"; then
              raced=true
              break
            fi
            if grep -q "exceeded the maximum execution time" <<<"$messages"; then
              late=true
            fi
          done
