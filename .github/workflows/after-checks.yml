          # an annotation; any other failure is one of the change.
          if [[ -z "$rule" ]]; then
            jobs="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id')"
            for job in $jobs; do
              messages="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/check-runs/$job/annotations" --paginate --jq '.[].message')"
              if grep -qF "would reach every host, and it stops here instead" <<<"$messages"; then
                rule=stopped
                break
              fi
            done
