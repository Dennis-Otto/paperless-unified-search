    name: the fix bot
    # After a run of any workflow of the list above that failed, for a pull request,
    # also one from a fork, or on main, by a push, its schedule or by hand: on a pull
    # request, a commit whose failed runs kept no fix ends it at once, and a quiet week
    # starts no job of it. After every run of a check for the head of a pull request from
    # a branch of this repository as well, however it ended: a fix waits for the job after
    # the run that ends last, when that run took longer than the bot's wait. The list
    # leaves out the workflows that never keep a fix on a pull request; it is no list of
    # those that do, since a project adds its own.
    # After every run of the same checks that a push to main started and that passed,
