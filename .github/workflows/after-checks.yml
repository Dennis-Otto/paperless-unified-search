          Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          python3 "$tool" --repo "$GH_REPO" diagrams commit "$kept" --branch "$BRANCH" \
            --head "$SHA" --headline "$HEADLINE" --body "$body" > "$RUNNER_TEMP/commit.json"
          # A commit that GitHub failed may have landed: the next run of the check sees.
          commit="$(once gh api --header "$API_VERSION_HEADER" graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          echo "Committed the diagrams onto $BRANCH: $commit" >> "$GITHUB_STEP_SUMMARY"
          python3 "$tool" diagrams report "$kept" --for comment > "$RUNNER_TEMP/comment.md"
          if [[ -s "$RUNNER_TEMP/comment.md" ]]; then
            once gh pr comment "${NUMBER:-$BRANCH}" --body-file "$RUNNER_TEMP/comment.md"
          fi
      # The check promises the bot's commit wherever the repository names the release
      # app, which it can't see the private key of: a bot without the key says so on
      # the pull request rather than leave it waiting for a commit that doesn't come
      # (#913). It says so once on each pull request, and not for a head that the
      # branch moved on from, whose checks run again.
      - name: Say on the pull request that the bot has no private key
        if: >-
          steps.drawn.outputs.found == 'true' &&
          steps.release-app.outputs.ready != 'true' &&
          vars.RELEASE_AUTOMATION_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          eval "$OUTAGE"
          head="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)"
          if [[ "$head" != "$SHA" ]]; then
            echo "$BRANCH moved on from ${SHA:0:7}; the checks of its new head draw the diagrams again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="<!-- the diagram bot has no private key -->"
          comments="$(tried gh pr view "${NUMBER:-$BRANCH}" --json comments --jq '.comments[].body')"
          if grep -qF "$marker" <<<"$comments"; then
            echo "The pull request already says that the diagram bot has no private key." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          once gh pr comment "${NUMBER:-$BRANCH}" --body "The diagram bot can't commit the diagrams of this pull request ($URL): this repository names its release app, but has no private key of it in the secret \`RELEASE_AUTOMATION_PRIVATE_KEY\` of the environment \`release\`, which \`python3 .github/blueprint.py app connect --key-file FILE\` sets. Until then, run \`bash scripts/diagrams.sh --extract\` with Docker and commit what it changes, or take the files from the artifact \`diagrams\` of the check *diagrams*.$marker"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The failed check of the pull request promises the bot's commit; when the bot
      # can't make it, the pull request learns so, with the command that fixes it.
      - name: Say on the pull request that the bot failed
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          eval "$OUTAGE"
          once gh pr comment "${NUMBER:-$BRANCH}" --body "The diagram bot couldn't commit the diagrams of this pull request; the summary of its run says why ($URL). Run \`bash scripts/diagrams.sh --extract\` with Docker and commit what it changes, or take the files from the artifact \`diagrams\` of the check *diagrams*."
