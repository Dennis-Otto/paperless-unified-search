          # kept from being published: each job that failed publishes it or asks for
          # it, or is docs, whose only steps that failed handed the website to GitHub
          # Pages, the second time too. Any other failure of Docs, such as a broken
          # link, is one of the change, and a run of a pull request publishes nothing.
