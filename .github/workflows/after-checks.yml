          eval "$OUTAGE"
          tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO" --jq .full_name > /dev/null
          echo "::error title=The release app gave no token::GitHub answers, but refused the token of the release app; the log of the step that asked for it has its answer. Most often the app isn't installed on this repository or lacks a permission that the bot asks for, or the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release holds the key of another app. A short outage of GitHub that ended a moment ago looks the same: if none of these holds, the next run tells them apart."
          exit 1
      - name: Keep the pull request with the fixes of main
        if: steps.main-app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.main-app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.main-app.outputs.app-slug }}
          BASE: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          python3 "$tool" --repo "$GH_REPO" fix main --sha "$SHA" --base "$BASE" \
            --app "$APP_SLUG" --url "$URL" --folder "$RUNNER_TEMP/fixes" >> "$GITHUB_STEP_SUMMARY"
      # The failed check of the pull request may wait for the bot's commit; when the
      # bot fails, the pull request learns so, once for each commit, as a job follows
      # every run of it. A job after a run that didn't fail, and that fails before it
      # decided anything, has no finding to speak of.
      - name: Say on the pull request that the fix bot failed
        if: >-
          failure() && github.event.workflow_run.event == 'pull_request' &&
          (github.event.workflow_run.conclusion == 'failure' ||
          steps.collect.outputs.stopped == 'true' ||
          steps.collect.outputs.action != '') &&
          steps.blocks.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PULL: ${{ steps.collect.outputs.pull || github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          eval "$OUTAGE"
          marker="<!-- the fix bot failed on $SHA -->"
          if [[ -z "$PULL" ]]; then
            exit 0
          fi
          comments="$(tried gh pr view "$PULL" --json comments --jq '.comments[].body')"
          if ! grep -qF "$marker" <<<"$comments"; then
            once gh pr comment "$PULL" --body "The fix bot couldn't fix the findings of this pull request that a command fixes ($URL); its summary says why. The PR coach names the command of each check that failed, which makes the fixes on your machine.$marker"
          fi
      # The issue of a failing bot of main: a failure opens it or brings it up to
      # date, and the next run that passes closes it.
      - name: Keep the issue of the fix bot of main current
        if: always() && github.event.workflow_run.event != 'pull_request' && steps.blocks.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ job.status == 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          eval "$OUTAGE"
          # A job that sat out an outage of GitHub did nothing, so it passed nothing
          # either: the issue stays as it is (decision 0155).
          if [[ "$FAILED" != true && -e "$RUNNER_TEMP/github-sat-out" ]]; then
