            exit 0
          fi
          # The bot-health bot watches some of these workflows too and may have run it
          # again first: then the run is its own, and GitHub refuses a rerun while it runs.
          state="$(tried gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/actions/runs/$RUN" --jq '"\(.status) \(.run_attempt)"')"
          if [[ "$state" != "completed 1" ]]; then
            echo "$NAME ran again already; the bot leaves it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
