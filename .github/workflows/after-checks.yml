              case "$job" in
                "publish the website" | "ask the published website") ;;
                docs)
                  case "$steps" in
                    "Hand the website to GitHub Pages once more" | "Hand the website to GitHub Pages|Hand the website to GitHub Pages once more") ;;
                    *) rule="" ;;
                  esac
                  ;;
                *) rule="" ;;
              esac
            done <<<"$failed"
          fi
