name: Build the image

# The build of the container image of a release, called by the release workflow only,
# once the release is public and where PUBLISH_TO is ghcr: it builds the image of the
# signed tag for linux/amd64 and linux/arm64, pushes it to the GitHub Container
# Registry with the tags of the version and its SBOM, and attests its signed
# provenance there. As a reusable workflow of its own, it is isolated from the rest of
# the release workflow, as build-release.yml is for the other assets, and the
# provenance names it as the build, as SLSA Build Level 3 asks; verify-release.yml
# checks that.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_call:
    inputs:
      tag:
        description: The tag of the release or beta
        required: true
        type: string
      sha:
        description: The commit that the tag has to point at
        required: true
        type: string
      version:
        description: Its version
        required: true
        type: string

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"
  # Each call of its API asks for the version of the REST API that the steps are
  # written for (decision 0125).
  API_VERSION_HEADER: "X-GitHub-Api-Version: 2022-11-28"

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No environment and no secret but the token of the job, which may push packages
    # of this repository and nothing of another.
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Anybody with a token that may push could create the tag of a coming release
      # first, at a commit of their own. Only a tag that the release workflow signed, at
      # the commit of the release, is built and signed here. The check is the script of
      # the commit that runs this workflow, not the one of the tag.
      - name: Verify the tag before building
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          gh api --header "$API_VERSION_HEADER" -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/sign-tag.sh?ref=$GITHUB_SHA" > "$RUNNER_TEMP/sign-tag.sh"
          bash "$RUNNER_TEMP/sign-tag.sh" verify "$TAG" "$SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image in the lowercase that registries require
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
      - name: Build and push the image with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      # The signed provenance of this workflow, the isolated build: its signer is
      # build-image.yml, which no other job of the release can change.
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Name the image in the summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\` (\`$DIGEST\`) with the signed provenance of build-image.yml. Verify it with:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build-image.yml --source-ref refs/heads/main --deny-self-hosted-runners"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
