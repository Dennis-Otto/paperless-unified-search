name: Sign and publish release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: paperless_unified_search
  NEXTCLOUD_VERSION: 33.0.8
  NEXTCLOUD_SHA256: d974bcbe446edaf87ae17113200b362495abbdb89d7900d65d930fe7a9dc9474
  KRANKERL_VERSION: 0.14.0
  KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f

jobs:
  publish:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Verify tag matches app version
        shell: bash
        run: |
          # This is PHP code, not a shell expression.
          # shellcheck disable=SC2016
          APP_VERSION="$(php -r '$xml = simplexml_load_file("appinfo/info.xml"); echo (string) $xml->version;')"
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}"

      - name: Install verified Krankerl package builder
        shell: bash
        run: |
          PACKAGE="${RUNNER_TEMP}/krankerl.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/ChristophWurst/krankerl/releases/download/v${KRANKERL_VERSION}/krankerl_${KRANKERL_VERSION}_amd64.deb" \
            --output "${PACKAGE}"
          echo "${KRANKERL_SHA256}  ${PACKAGE}" | sha256sum --check --strict
          sudo dpkg --install "${PACKAGE}"

      - name: Build app archive
        run: krankerl package

      - name: Prepare private key and verified signing tools
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          CERT_FILE="${RUNNER_TEMP}/app-certificate.crt"
          NEXTCLOUD_ARCHIVE="${RUNNER_TEMP}/nextcloud.zip"

          test -n "${APP_PRIVATE_KEY}"
          printf '%s' "${APP_PRIVATE_KEY}" > "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -check -noout

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_ID}/${APP_ID}.crt" \
            --output "${CERT_FILE}"
          openssl x509 -in "${CERT_FILE}" -noout -subject

          curl --fail --location --silent --show-error \
            "https://download.nextcloud.com/server/releases/nextcloud-${NEXTCLOUD_VERSION}.zip" \
            --output "${NEXTCLOUD_ARCHIVE}"
          echo "${NEXTCLOUD_SHA256}  ${NEXTCLOUD_ARCHIVE}" | sha256sum --check --strict
          unzip -q "${NEXTCLOUD_ARCHIVE}" -d "${RUNNER_TEMP}/nextcloud-server"

      - name: Sign app and rebuild archive
        shell: bash
        run: |
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          SIGNING_DIR="${RUNNER_TEMP}/signing"
          mkdir --parents "${SIGNING_DIR}"
          tar --extract --gzip --file "${ARCHIVE}" --directory "${SIGNING_DIR}"
          test -d "${SIGNING_DIR}/${APP_ID}"

          php "${RUNNER_TEMP}/nextcloud-server/nextcloud/occ" integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/app-private.key" \
            --certificate="${RUNNER_TEMP}/app-certificate.crt" \
            --path="${SIGNING_DIR}/${APP_ID}"

          test -s "${SIGNING_DIR}/${APP_ID}/appinfo/signature.json"
          tar --create --gzip --file "${ARCHIVE}" \
            --directory "${SIGNING_DIR}" "${APP_ID}"

      - name: Upload signed archive to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "build/artifacts/${APP_ID}.tar.gz#${APP_ID}.tar.gz" \
            --clobber

      - name: Publish release to Nextcloud App Store
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          REQUEST_FILE="${RUNNER_TEMP}/appstore-release.json"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APP_ID}.tar.gz"

          test -n "${APPSTORE_TOKEN}"
          test -s "${KEY_FILE}"
          SIGNATURE="$(openssl dgst -sha512 -sign "${KEY_FILE}" "${ARCHIVE}" | openssl base64 -A)"
          jq --null-input \
            --arg download "${DOWNLOAD_URL}" \
            --arg signature "${SIGNATURE}" \
            '{download: $download, signature: $signature, nightly: false}' \
            > "${REQUEST_FILE}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token ${APPSTORE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${REQUEST_FILE}" \
            https://apps.nextcloud.com/api/v1/apps/releases

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm --force \
            "${RUNNER_TEMP}/app-private.key" \
            "${RUNNER_TEMP}/app-certificate.crt" \
            "${RUNNER_TEMP}/appstore-release.json"
