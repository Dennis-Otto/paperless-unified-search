name: Release

on:
  pull_request_target:
    types: [closed]
  schedule:
    # GITHUB_TOKEN merges may suppress PR events; recover missing events and interrupted releases.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a manual release or process unpublished Dependabot updates
        required: true
        default: manual
        type: choice
        options: [manual, dependencies]
      increment:
        description: Semantic version increment for a manual release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      introduction:
        description: Optional release introduction above the generated changelog
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize release and signature-repair mutations; never cancel CI or an active release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: paperless_unified_search
  NEXTCLOUD_VERSION: 33.0.8
  NEXTCLOUD_SHA256: d974bcbe446edaf87ae17113200b362495abbdb89d7900d65d930fe7a9dc9474
  KRANKERL_VERSION: 0.14.0
  KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f

jobs:
  plan:
    name: Find unpublished updates or an interrupted release
    if: >-
      github.repository == 'Dennis-Otto/paperless-unified-search' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Plan release without accessing signing secrets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'dependencies' }}
          INCREMENT: ${{ inputs.increment || 'patch' }}
          INTRODUCTION: ${{ inputs.introduction }}
        run: python3 .github/scripts/release_automation.py plan

  release:
    name: Prepare protected release, sign, and publish
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    steps:
      - name: Create short-lived repository-scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out trusted main without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release PR and require all PR and main checks
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_RELEASE_APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 .github/scripts/release_automation.py prepare

      - name: Check out the exact checked release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Verify canonical release metadata and dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(php scripts/release-version.php check)" = "${VERSION}"
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit

      - name: Refresh token for publication after potentially long checks
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write

      - name: Stage restartable GitHub release after successful checks
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ steps.publish-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.target_sha }}
        run: python3 .github/scripts/release_automation.py stage

      - name: Install verified Krankerl package builder
        if: steps.stage.outputs.draft == 'true'
        shell: bash
        run: |
          PACKAGE="${RUNNER_TEMP}/krankerl.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/ChristophWurst/krankerl/releases/download/v${KRANKERL_VERSION}/krankerl_${KRANKERL_VERSION}_amd64.deb" \
            --output "${PACKAGE}"
          echo "${KRANKERL_SHA256}  ${PACKAGE}" | sha256sum --check --strict
          sudo dpkg --install "${PACKAGE}"

      - name: Build app archive
        if: steps.stage.outputs.draft == 'true'
        run: krankerl package

      - name: Verify unsigned production package
        if: steps.stage.outputs.draft == 'true'
        run: composer package:check

      - name: Prepare private key and verified signing tools
        if: steps.stage.outputs.draft == 'true'
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          CERT_FILE="${RUNNER_TEMP}/app-certificate.crt"
          NEXTCLOUD_ARCHIVE="${RUNNER_TEMP}/nextcloud.zip"

          test -n "${APP_PRIVATE_KEY}"
          printf '%s' "${APP_PRIVATE_KEY}" > "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -check -noout

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_ID}/${APP_ID}.crt" \
            --output "${CERT_FILE}"
          openssl x509 -in "${CERT_FILE}" -noout -subject

          curl --fail --location --silent --show-error \
            "https://download.nextcloud.com/server/releases/nextcloud-${NEXTCLOUD_VERSION}.zip" \
            --output "${NEXTCLOUD_ARCHIVE}"
          echo "${NEXTCLOUD_SHA256}  ${NEXTCLOUD_ARCHIVE}" | sha256sum --check --strict
          unzip -q "${NEXTCLOUD_ARCHIVE}" -d "${RUNNER_TEMP}/nextcloud-server"

      - name: Sign app and rebuild archive
        if: steps.stage.outputs.draft == 'true'
        shell: bash
        run: |
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          SIGNING_DIR="${RUNNER_TEMP}/signing"
          mkdir --parents "${SIGNING_DIR}"
          tar --extract --gzip --file "${ARCHIVE}" --directory "${SIGNING_DIR}"
          test -d "${SIGNING_DIR}/${APP_ID}"

          php "${RUNNER_TEMP}/nextcloud-server/nextcloud/occ" integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/app-private.key" \
            --certificate="${RUNNER_TEMP}/app-certificate.crt" \
            --path="${SIGNING_DIR}/${APP_ID}"

          test -s "${SIGNING_DIR}/${APP_ID}/appinfo/signature.json"
          tar --create --gzip --file "${ARCHIVE}" \
            --directory "${SIGNING_DIR}" "${APP_ID}"

      - name: Verify signed production package
        if: steps.stage.outputs.draft == 'true'
        run: bash scripts/check-package.sh "build/artifacts/${APP_ID}.tar.gz" signed

      - name: Create and verify detached release signature
        if: steps.stage.outputs.draft == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          SIGNATURE="${ARCHIVE}.sig"
          PUBLIC_KEY="${RUNNER_TEMP}/app-public.pem"
          openssl dgst -sha512 \
            -sign "${RUNNER_TEMP}/app-private.key" \
            -out "${SIGNATURE}" \
            "${ARCHIVE}"
          openssl x509 -in "${RUNNER_TEMP}/app-certificate.crt" -pubkey -noout > "${PUBLIC_KEY}"
          openssl dgst -sha512 -verify "${PUBLIC_KEY}" -signature "${SIGNATURE}" "${ARCHIVE}"

      - name: Generate signed-package SBOM
        if: steps.stage.outputs.draft == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/signing/${{ env.APP_ID }}
          format: spdx-json
          output-file: build/artifacts/${{ env.APP_ID }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Attest signed production package and SBOM
        if: steps.stage.outputs.draft == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/artifacts/${{ env.APP_ID }}.tar.gz
            build/artifacts/${{ env.APP_ID }}.tar.gz.sig
            build/artifacts/${{ env.APP_ID }}.spdx.json

      - name: Export verifiable attestation bundle
        if: steps.stage.outputs.draft == 'true'
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "${BUNDLE_PATH}"
          jq --exit-status . "${BUNDLE_PATH}" >/dev/null
          cp -- "${BUNDLE_PATH}" "build/artifacts/${APP_ID}.sigstore.json"

      - name: Publish complete draft assets
        if: steps.stage.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          test -s "${ARCHIVE}"
          test -s "${ARCHIVE}.sig"
          test -s "build/artifacts/${APP_ID}.spdx.json"
          test -s "build/artifacts/${APP_ID}.sigstore.json"
          gh release upload "v${VERSION}" "${ARCHIVE}" "${ARCHIVE}.sig" \
            "build/artifacts/${APP_ID}.spdx.json" "build/artifacts/${APP_ID}.sigstore.json" --clobber
          gh release edit "v${VERSION}" --draft=false --prerelease=false --latest

      - name: Resume App Store delivery using immutable published assets
        if: steps.stage.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir --parents build/artifacts
          gh release download "v${VERSION}" --dir build/artifacts \
            --pattern "${APP_ID}.tar.gz" --pattern "${APP_ID}.tar.gz.sig" \
            --pattern "${APP_ID}.spdx.json" --pattern "${APP_ID}.sigstore.json"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_ID}/${APP_ID}.crt" \
            --output "${RUNNER_TEMP}/app-certificate.crt"
          openssl x509 -in "${RUNNER_TEMP}/app-certificate.crt" -pubkey -noout > "${RUNNER_TEMP}/app-public.pem"
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          openssl dgst -sha512 -verify "${RUNNER_TEMP}/app-public.pem" -signature "${ARCHIVE}.sig" "${ARCHIVE}"
          bash scripts/check-package.sh "${ARCHIVE}" signed
          for ASSET in "${ARCHIVE}" "${ARCHIVE}.sig" "build/artifacts/${APP_ID}.spdx.json"; do
            gh attestation verify "${ASSET}" --repo "${GITHUB_REPOSITORY}" \
              --bundle "build/artifacts/${APP_ID}.sigstore.json" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done

      - name: Publish release to Nextcloud App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          umask 077
          REQUEST_FILE="${RUNNER_TEMP}/appstore-release.json"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APP_ID}.tar.gz"
          test -n "${APPSTORE_TOKEN}"
          SIGNATURE="$(openssl base64 -A -in "build/artifacts/${APP_ID}.tar.gz.sig")"
          jq --null-input --arg download "${DOWNLOAD_URL}" --arg signature "${SIGNATURE}" \
            '{download: $download, signature: $signature, nightly: false}' > "${REQUEST_FILE}"
          # This API creates or updates the same version; retries do not create another release.
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 180 --request POST \
            --header "Authorization: Token ${APPSTORE_TOKEN}" --header 'Content-Type: application/json' \
            --data-binary "@${REQUEST_FILE}" https://apps.nextcloud.com/api/v1/apps/releases

      - name: Mark GitHub and App Store publication complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ steps.publish-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/release_automation.py complete

      - name: Remove temporary credentials
        if: always()
        run: |
          rm --force "${RUNNER_TEMP}/app-private.key" "${RUNNER_TEMP}/app-certificate.crt" \
            "${RUNNER_TEMP}/app-public.pem" "${RUNNER_TEMP}/appstore-release.json"
