name: Release

# The release bot. release-please keeps a pull request for the next release, up to
# date with main. Its version follows from the Conventional Commit titles merged
# since the last release (fix: a patch, feat: a minor, ! or BREAKING CHANGE: a major
# version) and is decided anew with every merge. What the pull requests wrote under
# "## Unreleased" of CHANGELOG.md becomes the section of the release; without it,
# the section lists the pull requests. Merging the pull request creates the release
# as a draft, with its tag. The jobs below attach the package, its SBOMs (SPDX and
# CycloneDX), the licenses of its third-party components, the advisories that don't
# affect it (OpenVEX) and its signed provenance, write the notes, make the
# release public, announce it in the discussions, and then deliver it where the
# repository variable PUBLISH_TO says: pypi, npm, ghcr, hacs, nextcloud-appstore,
# github-action or none. Last, verify-release.yml checks the release as its users
# can. A release that only updates dependencies merges itself once its checks pass.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  # Merges that auto-merge does with the token of a workflow, such as those of
  # Dependabot's updates, start no workflow; so the release bot looks every hour too.
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: write
      # The keyless signature of the release tags (gitsign).
      id-token: write
      issues: write
      pull-requests: write
    # A release, or a beta of the next one; the jobs below handle both alike.
    outputs:
      created: ${{ steps.release.outputs.release_created == 'true' || steps.beta.outputs.tag != '' }}
      tag: ${{ steps.release.outputs.tag_name || steps.beta.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.beta.outputs.version }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Create a token of the release app
        id: app
        if: vars.RELEASE_AUTOMATION_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the release pull request and its merge need.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The merge of the release pull request: its tag comes first, signed, and
      # release-please creates the release on it.
      - name: Sign the tag of the release that this merge makes
        if: github.event_name == 'push' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" != "chore: release "* ]]; then
            echo "No release pull request was merged."
            exit 0
          fi
          tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "The tag $tag exists already."
            exit 0
          fi
          bash .github/sign-tag.sh "$tag"
          echo "The tag $tag is signed." >> "$GITHUB_STEP_SUMMARY"
      - name: Have the release pull request rebuilt on the current main
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # release-please rebuilds its pull request only when its description changes,
          # so a merge of a hidden type, such as docs or chore, would leave it behind
          # main. A marker after the footer of the description makes it rebuild the pull
          # request on main; the notes above stay as they are, since release-please reads
          # them from a merged release pull request to create the release.
          set -euo pipefail
          gh pr list --state open --label "autorelease: pending" --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' |
            while read -r number branch; do
              # The list can lag behind a merge: only a pull request still open is rebuilt.
              if [[ "$(gh pr view "$number" --json state --jq .state)" != OPEN ]]; then
                continue
              fi
              behind="$(gh api "repos/$GH_REPO/compare/main...$branch" --jq .behind_by)"
              if [[ "$behind" != 0 ]]; then
                echo "#$number is $behind commit(s) behind main; release-please rebuilds it."
                body="$(gh pr view "$number" --json body --jq .body)"
                gh pr edit "$number" --body "$(printf '%s\n\n%s\n' "$body" "<!-- The release bot rebuilds this pull request on the current main. -->")"
              fi
            done
      - name: Update the release pull request, or create the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request of the release app starts the checks; one of the job's
          # GITHUB_TOKEN would start none.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Write the text of Unreleased into the release pull request
        if: steps.app.outputs.token != ''
        env:
          # The commit goes through GitHub's API as the release app: GitHub signs it,
          # as main requires, and it starts the checks.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          raw=(-H "Accept: application/vnd.github.raw+json")
          # The open release pull requests; one that release-please has just created may
          # not carry its label yet, so its own output counts as well.
          {
            gh pr list --state open --label "autorelease: pending" --json headRefName --jq '.[].headRefName'
            if [[ -n "$PR" ]]; then jq -r .headBranchName <<<"$PR"; fi
          } | sort -u |
            while read -r branch; do
              head="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)"
              version="$(gh api "${raw[@]}" "repos/$GH_REPO/contents/.release-please-manifest.json?ref=$head" | jq -r '.["."]')"
              gh api "${raw[@]}" "repos/$GH_REPO/contents/CHANGELOG.md?ref=$head" > "$RUNNER_TEMP/branch.md"
              python3 "$script" changelog release "$version" CHANGELOG.md "$RUNNER_TEMP/branch.md" > "$RUNNER_TEMP/release.md"
              if cmp -s "$RUNNER_TEMP/release.md" "$RUNNER_TEMP/branch.md"; then
                echo "The changelog of $version is up to date."
                continue
              fi
              echo "Writing the changelog of $version into $branch."
              jq --null-input --arg repo "$GH_REPO" --arg branch "$branch" --arg head "$head" \
                --arg headline "chore: write the changelog of $version" \
                --rawfile contents <(base64 --wrap=0 "$RUNNER_TEMP/release.md") \
                '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                  variables: {input: {
                    branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                    expectedHeadOid: $head,
                    message: {headline: $headline},
                    fileChanges: {additions: [{path: "CHANGELOG.md", contents: $contents}]}}}}' |
                gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid
            done
      - name: Merge a release of dependency updates once its checks pass
        if: steps.release.outputs.pr != '' && steps.app.outputs.token != ''
        env:
          # Merged by the app, the release starts this workflow again and is created.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number="$(jq -r .number <<<"$PR")"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -z "$latest" ]]; then
            echo "The first release waits for the maintainer."
            exit 0
          fi
          subjects="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" \
            --jq '.commits[].commit.message | split("\n")[0]')"
          others="$(grep -Ev '^(fix|chore|build)\(deps(-dev)?\): ' <<<"$subjects" || true)"
          if [[ -n "$others" ]]; then
            echo "The release holds more than dependency updates; the maintainer merges it:"
            echo "$others"
            exit 0
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$number"
      - name: Publish a beta of the next release
        id: beta
        # Where the repository variable BETA_CHANNEL is true, every change for users
        # that reaches main, a feat, fix or perf, becomes a beta of the next release,
        # such as 1.3.0-beta.2, for the testers who take prereleases. The jobs below
        # build and publish it as a prerelease, which announces nothing.
        if: >-
          vars.BETA_CHANNEL == 'true' && github.event_name == 'push' &&
          steps.release.outputs.release_created != 'true' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          pattern='^(feat|fix|perf)(\(([a-z0-9._/-]+)\))?(!)?: '
          if [[ ! "$subject" =~ $pattern || "${BASH_REMATCH[3]}" == deps* ]]; then
            echo "No change for users, so no beta." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="$(gh pr list --state open --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // ""')"
          if [[ -z "$branch" ]]; then
            echo "No release pull request, so no beta." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          next="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GH_REPO/contents/.release-please-manifest.json?ref=$branch" | jq -r '.["."]')"
          if [[ "$next" == *-* ]]; then
            echo "The next release, $next, is a prerelease itself, so no beta." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          last="$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            sed -n "s/^v$next-beta\.\([0-9]*\)$/\1/p" | sort -n | tail -n 1)"
          version="$next-beta.$(( ${last:-0} + 1 ))"
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" beta "$version" > "$RUNNER_TEMP/beta.md"
          bash .github/sign-tag.sh "v$version"
          gh release create "v$version" --draft --prerelease --verify-tag \
            --title "v$version" --notes-file "$RUNNER_TEMP/beta.md"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "The beta v$version of $next is on its way." >> "$GITHUB_STEP_SUMMARY"

  # The build runs in a reusable workflow of its own, so that the provenance of the
  # assets names it alone, as SLSA Build Level 3 asks.
  assets:
    name: release assets
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      version: ${{ needs.release-please.outputs.version }}

  publish:
    name: publish the release
    needs: [release-please, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Make the complete release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          # A version such as 2.0.0-beta.1 is a prerelease, which HACS, npm and the
          # like only offer to those who ask for one.
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          # A release for everybody is announced in the category Announcements of the
          # discussions, when the repository has them, with its notes and a link.
          announce=()
          # The variables of the query are GraphQL's, not the shell's.
          # shellcheck disable=SC2016
          categories="$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}"             -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { discussionCategories(first: 50) { nodes { name } } } }'             --jq '.data.repository.discussionCategories.nodes[].name')"
          if grep -qx Announcements <<<"$categories"; then
            announce=(--discussion-category Announcements)
            echo "The release is announced in the discussions." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release edit "$TAG" --draft=false --latest "${announce[@]}" --repo "$GITHUB_REPOSITORY"

  pypi:
    name: deliver to PyPI
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI accepts this workflow and environment, no token.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download the packages of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: deliver to npm
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing with provenance: npm accepts this workflow, no token.
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ github.event.repository.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the package of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz'
          # A prerelease goes to the tag next, so that npm install keeps the release.
          channel=latest
          [[ "$TAG" == *-* ]] && channel=next
          npm publish ./*.tgz --provenance --access public --tag "$channel"

  ghcr:
    name: deliver to GHCR
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'ghcr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image in the lowercase that registries require
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
      - name: Build and push the image with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  nextcloud-appstore:
    name: deliver to the Nextcloud App Store
    needs: [release-please, publish]
    if: vars.PUBLISH_TO == 'nextcloud-appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Submit the signed package of the public release
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$APPSTORE_TOKEN" ]]; then
            echo "::error::The secret APPSTORE_TOKEN of the environment release is missing."
            exit 1
          fi
          app_id="$(python3 -c 'import xml.etree.ElementTree as t; print(t.parse("appinfo/info.xml").getroot().findtext("id"))')"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$app_id.tar.gz.sig"
          umask 077
          jq --null-input \
            --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$app_id.tar.gz" \
            --arg signature "$(openssl base64 -A -in "$app_id.tar.gz.sig")" \
            '{download: $download, signature: $signature, nightly: false}' > "$RUNNER_TEMP/request.json"
          # The API creates or updates the same version; a retry creates no second release.
          curl --fail-with-body --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 15 --max-time 180 --request POST \
            --header "Authorization: Token $APPSTORE_TOKEN" --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/request.json" https://apps.nextcloud.com/api/v1/apps/releases

  github-action:
    name: move the major tag
    needs: [release-please, publish]
    # A prerelease leaves the major tag at the last release.
    if: vars.PUBLISH_TO == 'github-action' && !contains(needs.release-please.outputs.tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Point the major tag at the release, as users of v1 and the like expect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$TAG" "$TAG^{commit}"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$MAJOR"

  verify:
    name: verify
    needs: [release-please, publish, pypi, npm, ghcr, nextcloud-appstore, github-action]
    # After the delivery, whichever of them ran: the release as its users check it.
    if: always() && needs.publish.result == 'success'
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
