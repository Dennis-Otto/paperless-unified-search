name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: paperless_unified_search
  NEXTCLOUD_VERSION: 33.0.8
  NEXTCLOUD_SHA256: d974bcbe446edaf87ae17113200b362495abbdb89d7900d65d930fe7a9dc9474
  KRANKERL_VERSION: 0.14.0
  KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f

jobs:
  prepare:
    name: Validate, version, sign, and create release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Require dispatch from the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check dependencies for known vulnerabilities
        run: composer audit

      - name: Run pre-release quality checks
        shell: bash
        run: |
          composer version:check
          composer lint
          node --check js/settings.js
          node --check l10n/de.js
          composer test
          composer cs:check
          composer psalm

      - name: Scan Git history and working tree for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select or resume release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INCREMENT: ${{ inputs.increment }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(php scripts/release-version.php check)"
          ASSET_NAME="${APP_ID}.tar.gz"
          LAST_RELEASE_RUN="$(git log -1 --format=%B | sed -n 's/^Release-run: //p' | tail -n 1)"

          if gh release view "v${CURRENT_VERSION}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep --fixed-strings --line-regexp "${ASSET_NAME}" >/dev/null \
            && test "${LAST_RELEASE_RUN}" != "${GITHUB_RUN_ID}"; then
            VERSION="$(php scripts/release-version.php bump "${INCREMENT}")"
            MODE="new"
          else
            VERSION="${CURRENT_VERSION}"
            MODE="resume"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release plan"
            echo
            echo "- Mode: ${MODE}"
            echo "- Version: v${VERSION}"
            echo "- Increment requested: ${INCREMENT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate updated release metadata
        shell: bash
        env:
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(php scripts/release-version.php check)" = "${VERSION}"
          git diff --check

          CHANGED_FILES="$(git diff --name-only)"
          if test "${MODE}" = "new"; then
            test "${CHANGED_FILES}" = $'CHANGELOG.md\nappinfo/info.xml'
          else
            test -z "${CHANGED_FILES}"
          fi

          curl --fail --silent --show-error \
            https://apps.nextcloud.com/schema/apps/info.xsd \
            --output "${RUNNER_TEMP}/nextcloud-app-info.xsd"
          # This is PHP code, not a shell expression.
          # shellcheck disable=SC2016
          php -r '$document = new DOMDocument(); $document->load("appinfo/info.xml"); exit($document->schemaValidate(getenv("RUNNER_TEMP") . "/nextcloud-app-info.xsd") ? 0 : 1);'

      - name: Install verified Krankerl package builder
        shell: bash
        run: |
          PACKAGE="${RUNNER_TEMP}/krankerl.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/ChristophWurst/krankerl/releases/download/v${KRANKERL_VERSION}/krankerl_${KRANKERL_VERSION}_amd64.deb" \
            --output "${PACKAGE}"
          echo "${KRANKERL_SHA256}  ${PACKAGE}" | sha256sum --check --strict
          sudo dpkg --install "${PACKAGE}"

      - name: Build app archive
        run: krankerl package

      - name: Prepare private key and verified signing tools
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          CERT_FILE="${RUNNER_TEMP}/app-certificate.crt"
          NEXTCLOUD_ARCHIVE="${RUNNER_TEMP}/nextcloud.zip"

          test -n "${APP_PRIVATE_KEY}"
          printf '%s' "${APP_PRIVATE_KEY}" > "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -check -noout

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_ID}/${APP_ID}.crt" \
            --output "${CERT_FILE}"
          openssl x509 -in "${CERT_FILE}" -noout -subject

          curl --fail --location --silent --show-error \
            "https://download.nextcloud.com/server/releases/nextcloud-${NEXTCLOUD_VERSION}.zip" \
            --output "${NEXTCLOUD_ARCHIVE}"
          echo "${NEXTCLOUD_SHA256}  ${NEXTCLOUD_ARCHIVE}" | sha256sum --check --strict
          unzip -q "${NEXTCLOUD_ARCHIVE}" -d "${RUNNER_TEMP}/nextcloud-server"

      - name: Sign app and rebuild archive
        shell: bash
        run: |
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          SIGNING_DIR="${RUNNER_TEMP}/signing"
          mkdir --parents "${SIGNING_DIR}"
          tar --extract --gzip --file "${ARCHIVE}" --directory "${SIGNING_DIR}"
          test -d "${SIGNING_DIR}/${APP_ID}"

          php "${RUNNER_TEMP}/nextcloud-server/nextcloud/occ" integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/app-private.key" \
            --certificate="${RUNNER_TEMP}/app-certificate.crt" \
            --path="${SIGNING_DIR}/${APP_ID}"

          test -s "${SIGNING_DIR}/${APP_ID}/appinfo/signature.json"
          tar --create --gzip --file "${ARCHIVE}" \
            --directory "${SIGNING_DIR}" "${APP_ID}"

      - name: Commit version and push atomic tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if test "${MODE}" = "new"; then
            git add appinfo/info.xml CHANGELOG.md
            git commit --signoff \
              --message "chore: release v${VERSION}" \
              --message "Release-run: ${GITHUB_RUN_ID}"
          fi

          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            test "$(git rev-parse "v${VERSION}^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
          fi

          git push --atomic origin \
            "HEAD:refs/heads/${DEFAULT_BRANCH}" \
            "refs/tags/v${VERSION}"

      - name: Create or repair GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          php scripts/release-version.php notes "${VERSION}" > "${NOTES_FILE}"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              "${ARCHIVE}#${APP_ID}.tar.gz" \
              --clobber
            gh release edit "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --draft=false \
              --prerelease=false
          else
            gh release create "v${VERSION}" \
              "${ARCHIVE}#${APP_ID}.tar.gz" \
              --verify-tag \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Publish release to Nextcloud App Store
        shell: bash
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          REQUEST_FILE="${RUNNER_TEMP}/appstore-release.json"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APP_ID}.tar.gz"

          test -n "${APPSTORE_TOKEN}"
          test -s "${KEY_FILE}"
          test -s "${ARCHIVE}"

          SIGNATURE="$(openssl dgst -sha512 -sign "${KEY_FILE}" "${ARCHIVE}" | openssl base64 -A)"
          jq --null-input \
            --arg download "${DOWNLOAD_URL}" \
            --arg signature "${SIGNATURE}" \
            '{download: $download, signature: $signature, nightly: false}' \
            > "${REQUEST_FILE}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token ${APPSTORE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${REQUEST_FILE}" \
            https://apps.nextcloud.com/api/v1/apps/releases

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm --force \
            "${RUNNER_TEMP}/app-private.key" \
            "${RUNNER_TEMP}/app-certificate.crt" \
            "${RUNNER_TEMP}/appstore-release.json"
