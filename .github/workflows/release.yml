name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: paperless_unified_search
  NEXTCLOUD_VERSION: 33.0.8
  NEXTCLOUD_SHA256: d974bcbe446edaf87ae17113200b362495abbdb89d7900d65d930fe7a9dc9474
  KRANKERL_VERSION: 0.14.0
  KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f

jobs:
  release:
    name: Prepare protected release, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Require dispatch from the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check dependencies for known vulnerabilities
        run: composer audit

      - name: Run pre-release quality checks
        shell: bash
        run: |
          composer version:check
          composer lint
          node --check js/settings.js
          node --check l10n/de.js
          composer l10n:check
          composer test
          composer cs:check
          composer psalm

      - name: Scan Git history and working tree for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INCREMENT: ${{ inputs.increment }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(php scripts/release-version.php check)"
          ASSET_NAME="${APP_ID}.tar.gz"
          MERGED_CURRENT="$(gh pr list \
            --state merged \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/v${CURRENT_VERSION}" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if gh release view "v${CURRENT_VERSION}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep --fixed-strings --line-regexp "${ASSET_NAME}" >/dev/null; then
            VERSION="$(php scripts/release-version.php next "${INCREMENT}")"
            MODE='new'
          elif [[ -n "${MERGED_CURRENT}" ]]; then
            VERSION="${CURRENT_VERSION}"
            MODE='resume'
          elif awk '
            /^## Unreleased$/ { unreleased = 1; next }
            /^## / { unreleased = 0 }
            unreleased && /^- / { found = 1 }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            VERSION="$(php scripts/release-version.php next "${INCREMENT}")"
            MODE='new'
          else
            VERSION="${CURRENT_VERSION}"
            MODE='resume'
          fi

          {
            echo "version=${VERSION}"
            echo "mode=${MODE}"
            echo "branch=release/v${VERSION}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo '### Release plan'
            echo
            echo "- Mode: ${MODE}"
            echo "- Version: v${VERSION}"
            echo "- Increment requested: ${INCREMENT}"
            echo "- Protected branch: release/v${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare or resume release commit
        id: commit
        shell: bash
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          MERGED_SHA="$(gh pr list \
            --state merged \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --limit 1 \
            --json mergeCommit \
            --jq '.[0].mergeCommit.oid // empty')"
          if [[ -n "${MERGED_SHA}" ]] && git merge-base --is-ancestor "${MERGED_SHA}" HEAD; then
            test "$(php scripts/release-version.php check)" = "${VERSION}"
            echo 'needs_pr=false' >> "${GITHUB_OUTPUT}"
            echo "target_sha=${MERGED_SHA}" >> "${GITHUB_OUTPUT}"
            echo "Release PR was already merged at ${MERGED_SHA}."
            exit 0
          fi

          if [[ "${MODE}" == 'resume' ]]; then
            test "$(php scripts/release-version.php check)" = "${VERSION}"
            echo 'needs_pr=false' >> "${GITHUB_OUTPUT}"
            echo "target_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            echo 'No release metadata change is required; publishing the already protected version.'
            exit 0
          fi

          REMOTE_EXISTS='false'
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            REMOTE_EXISTS='true'
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout --detach "refs/remotes/origin/${BRANCH}"
          else
            git switch --create "${BRANCH}"
            test "$(php scripts/release-version.php bump "${{ inputs.increment }}")" = "${VERSION}"
            test "$(git diff --name-only)" = $'CHANGELOG.md\nappinfo/info.xml'
            git add CHANGELOG.md appinfo/info.xml
            git commit --signoff \
              --message "chore: release v${VERSION}" \
              --message "Release-version: ${VERSION}" \
              --message "Release-run: ${GITHUB_RUN_ID}"
          fi

          test "$(php scripts/release-version.php check)" = "${VERSION}"
          git diff --quiet
          git diff --cached --quiet
          git diff --check "origin/${DEFAULT_BRANCH}...HEAD"

          curl --fail --silent --show-error \
            https://apps.nextcloud.com/schema/apps/info.xsd \
            --output "${RUNNER_TEMP}/nextcloud-app-info.xsd"
          # This is PHP code, not a shell expression.
          # shellcheck disable=SC2016
          php -r '$document = new DOMDocument(); $document->load("appinfo/info.xml"); exit($document->schemaValidate(getenv("RUNNER_TEMP") . "/nextcloud-app-info.xsd") ? 0 : 1);'

          BASE_SHA="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          scripts/check-dco.sh "${BASE_SHA}" HEAD

          if [[ "${REMOTE_EXISTS}" == 'false' ]]; then
            git push origin "HEAD:refs/heads/${BRANCH}"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          fi

          echo 'needs_pr=true' >> "${GITHUB_OUTPUT}"
          echo "target_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Open protected release PR and wait for merge
        id: merge
        if: steps.commit.outputs.needs_pr == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list \
            --state open \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --limit 1 \
            --json url \
            --jq '.[0].url // empty')"
          if [[ -z "${PR_URL}" ]]; then
            PR_URL="$(gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${BRANCH}" \
              --title "chore: release v${VERSION}" \
              --body "Automated release PR created by the manually dispatched Release workflow. Publication starts only after every protected check succeeds and this PR is merged.")"
          fi

          gh workflow run ci.yml --ref "${BRANCH}"
          gh workflow run dependency-review.yml --ref "${BRANCH}"
          gh workflow run e2e.yml --ref "${BRANCH}"
          gh workflow run secret-scan.yml --ref "${BRANCH}"
          gh pr merge --auto --squash "${PR_URL}"

          for _ in $(seq 1 120); do
            PR_JSON="$(gh pr view "${PR_URL}" --json state,mergeCommit,statusCheckRollup)"
            STATE="$(jq --raw-output '.state' <<< "${PR_JSON}")"
            if [[ "${STATE}" == 'MERGED' ]]; then
              MERGE_SHA="$(jq --raw-output '.mergeCommit.oid' <<< "${PR_JSON}")"
              [[ "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]
              echo "target_sha=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"
              echo "Release PR merged at ${MERGE_SHA}."
              exit 0
            fi
            if [[ "${STATE}" == 'CLOSED' ]]; then
              echo 'Release PR was closed without merging.' >&2
              exit 1
            fi

            FAILED_CHECKS="$(jq '[.statusCheckRollup[]? | select(
              .conclusion == "FAILURE" or
              .conclusion == "CANCELLED" or
              .conclusion == "TIMED_OUT" or
              .conclusion == "ACTION_REQUIRED"
            )] | length' <<< "${PR_JSON}")"
            if [[ "${FAILED_CHECKS}" -gt 0 ]]; then
              gh pr checks "${PR_URL}" || true
              echo 'A required release check failed; the release PR remains open.' >&2
              exit 1
            fi

            sleep 10
          done

          echo 'Timed out waiting for the protected release PR to merge.' >&2
          exit 1

      - name: Check out exact merged release commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGED_SHA: ${{ steps.merge.outputs.target_sha || steps.commit.outputs.target_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "${MERGED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git checkout --detach "${MERGED_SHA}"
          test "$(git rev-parse HEAD)" = "${MERGED_SHA}"
          test "$(php scripts/release-version.php check)" = "${VERSION}"
          composer install --no-interaction --prefer-dist --no-progress

      - name: Install verified Krankerl package builder
        shell: bash
        run: |
          PACKAGE="${RUNNER_TEMP}/krankerl.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/ChristophWurst/krankerl/releases/download/v${KRANKERL_VERSION}/krankerl_${KRANKERL_VERSION}_amd64.deb" \
            --output "${PACKAGE}"
          echo "${KRANKERL_SHA256}  ${PACKAGE}" | sha256sum --check --strict
          sudo dpkg --install "${PACKAGE}"

      - name: Build app archive
        run: krankerl package

      - name: Verify unsigned production package
        run: composer package:check

      - name: Prepare private key and verified signing tools
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          CERT_FILE="${RUNNER_TEMP}/app-certificate.crt"
          NEXTCLOUD_ARCHIVE="${RUNNER_TEMP}/nextcloud.zip"

          test -n "${APP_PRIVATE_KEY}"
          printf '%s' "${APP_PRIVATE_KEY}" > "${KEY_FILE}"
          openssl pkey -in "${KEY_FILE}" -check -noout

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_ID}/${APP_ID}.crt" \
            --output "${CERT_FILE}"
          openssl x509 -in "${CERT_FILE}" -noout -subject

          curl --fail --location --silent --show-error \
            "https://download.nextcloud.com/server/releases/nextcloud-${NEXTCLOUD_VERSION}.zip" \
            --output "${NEXTCLOUD_ARCHIVE}"
          echo "${NEXTCLOUD_SHA256}  ${NEXTCLOUD_ARCHIVE}" | sha256sum --check --strict
          unzip -q "${NEXTCLOUD_ARCHIVE}" -d "${RUNNER_TEMP}/nextcloud-server"

      - name: Sign app and rebuild archive
        shell: bash
        run: |
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          SIGNING_DIR="${RUNNER_TEMP}/signing"
          mkdir --parents "${SIGNING_DIR}"
          tar --extract --gzip --file "${ARCHIVE}" --directory "${SIGNING_DIR}"
          test -d "${SIGNING_DIR}/${APP_ID}"

          php "${RUNNER_TEMP}/nextcloud-server/nextcloud/occ" integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/app-private.key" \
            --certificate="${RUNNER_TEMP}/app-certificate.crt" \
            --path="${SIGNING_DIR}/${APP_ID}"

          test -s "${SIGNING_DIR}/${APP_ID}/appinfo/signature.json"
          tar --create --gzip --file "${ARCHIVE}" \
            --directory "${SIGNING_DIR}" "${APP_ID}"

      - name: Verify signed production package
        run: bash scripts/check-package.sh "build/artifacts/${APP_ID}.tar.gz" signed

      - name: Attest signed production package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/artifacts/${{ env.APP_ID }}.tar.gz

      - name: Tag merged release commit
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            test "$(git rev-parse "v${VERSION}^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi

      - name: Create or repair GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          php scripts/release-version.php notes "${VERSION}" > "${NOTES_FILE}"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              "${ARCHIVE}#${APP_ID}.tar.gz" \
              --clobber
            gh release edit "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --draft=false \
              --prerelease=false
          else
            gh release create "v${VERSION}" \
              "${ARCHIVE}#${APP_ID}.tar.gz" \
              --verify-tag \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Publish release to Nextcloud App Store
        shell: bash
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="${RUNNER_TEMP}/app-private.key"
          ARCHIVE="build/artifacts/${APP_ID}.tar.gz"
          REQUEST_FILE="${RUNNER_TEMP}/appstore-release.json"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APP_ID}.tar.gz"

          test -n "${APPSTORE_TOKEN}"
          test -s "${KEY_FILE}"
          test -s "${ARCHIVE}"

          SIGNATURE="$(openssl dgst -sha512 -sign "${KEY_FILE}" "${ARCHIVE}" | openssl base64 -A)"
          jq --null-input \
            --arg download "${DOWNLOAD_URL}" \
            --arg signature "${SIGNATURE}" \
            '{download: $download, signature: $signature, nightly: false}' \
            > "${REQUEST_FILE}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token ${APPSTORE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${REQUEST_FILE}" \
            https://apps.nextcloud.com/api/v1/apps/releases

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm --force \
            "${RUNNER_TEMP}/app-private.key" \
            "${RUNNER_TEMP}/app-certificate.crt" \
            "${RUNNER_TEMP}/appstore-release.json"
