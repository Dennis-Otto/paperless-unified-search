name: Pull request title

# Pull requests are squashed into one commit named after their title, and the release
# bot builds the version and the changelog from these names. So the title must be a
# Conventional Commit; its type also sets the label of the pull request. A pull request
# that changes something for users, a feat, fix or perf, also says so in a fragment of
# the changelog, a new file in changelog.d/, or under Unreleased in CHANGELOG.md, which
# becomes the notes of the release.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# One run for each commit: a newer run for the same commit, such as one of an edited
# title, replaces the older one, but runs for different commits never cancel each
# other. The release bot edits its pull request while release-please pushes to it, and
# a late run for an older commit cancelled the checks of the head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  title:
    name: conventional title
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The fragments of the changelog of the pull request, and blueprint.py and the
      # explanations of the PR coach of the default branch.
      contents: read
      # The labels of the pull request, and its files.
      issues: write
      pull-requests: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      # Never check out or run pull request code in this privileged workflow; the
      # title only reaches the script through an environment variable.
      - name: Check the title and set the label
        id: title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          pattern='^(feat|fix|docs|perf|refactor|test|ci|build|chore|style|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Use a Conventional Commit title such as 'feat(settings): add a dark mode' or 'fix: keep the token secret'."
            exit 1
          fi
          type="${BASH_REMATCH[1]}"
          scope="${BASH_REMATCH[2]}"
          breaking="${BASH_REMATCH[3]}"
          case "$type" in
            feat) wanted=(enhancement) ;;
            fix | perf) wanted=(bug) ;;
            docs) wanted=(documentation) ;;
            *) wanted=(maintenance) ;;
          esac
          if [[ "$scope" == "(deps)" || "$scope" == "(deps-dev)" ]]; then wanted=(dependencies); fi
          if [[ "$scope" == "(security)" ]]; then wanted=(security); fi
          if [[ "$scope" == "(i18n)" ]]; then wanted=(translations); fi
          # The release bot's pull request, "chore: release 1.7.0", is no change of its own.
          if [[ "$TITLE" =~ ^chore(\(release\))?:\ release\ v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then wanted=(release); fi
          if [[ "$BRANCH" == release-please--* ]]; then wanted=(release); fi
          if [[ -n "$breaking" ]]; then wanted+=(breaking-change); fi
          managed=(enhancement bug documentation maintenance dependencies release breaking-change security translations)
          current="$(gh pr view "$NUMBER" --json labels --jq '.labels[].name')"
          for label in "${managed[@]}"; do
            want=false
            for item in "${wanted[@]}"; do
              if [[ "$item" == "$label" ]]; then want=true; fi
            done
            has=false
            if grep -qx "$label" <<<"$current"; then has=true; fi
            if [[ "$want" == true && "$has" == false ]]; then gh pr edit "$NUMBER" --add-label "$label"; fi
            if [[ "$want" == false && "$has" == true ]]; then gh pr edit "$NUMBER" --remove-label "$label"; fi
          done
          echo "Labels: ${wanted[*]}" >> "$GITHUB_STEP_SUMMARY"
      # The files of the pull request come from the API.
      - name: Require an entry in the changelog for a change for users
        id: entry
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.type }}
        run: |
          pattern='^(feat|fix|perf)(\(([a-z0-9._/-]+)\))?(!)?: '
          required=true
          if [[ ! "$TITLE" =~ $pattern ]]; then
            required=false
            echo "A pull request of this type changes nothing for users; no entry needed." >> "$GITHUB_STEP_SUMMARY"
          # Bots, such as Dependabot, the release bot and the blueprint bot, and updates
          # of dependencies write no notes of their own.
          elif [[ "$AUTHOR" == Bot || "${BASH_REMATCH[3]}" == deps || "${BASH_REMATCH[3]}" == deps-dev ]]; then
            required=false
            echo "Updates and bots write no entry." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Whatever its type or author, a pull request that adds or changes a fragment
          # has it checked: the release reads every file of changelog.d/.
          # The files of the changelog that the pull request adds or changes, each with
          # its status and its name as a JSON string on a line of its own, so that no
          # name spans two lines. A hidden file, such as changelog.d/.gitkeep, is no
          # fragment.
          filter='.[] | select(.status != "removed") | select(.filename == "CHANGELOG.md" or (.filename | test("^changelog\\.d/[^.]"))) | "\(.status) \(.filename | @json)"'
          # Every pull request asks, also those of bots, which need no entry; GitHub fails
          # for a moment now and then, so it asks three times before the check fails.
          for attempt in 1 2 3; do
            if gh api "repos/$GH_REPO/pulls/$NUMBER/files" --paginate --jq "$filter" > "$RUNNER_TEMP/changed"; then
              break
            fi
            if ((attempt == 3)); then
              echo "::error::GitHub did not list the files of this pull request. Run the check again."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          fragment='^"(changelog\.d/[A-Za-z0-9][A-Za-z0-9._-]*\.md)"$'
          changelog=false
          fragments=()
          # Only a new fragment is the entry of this pull request. One that main has
          # already, changed or renamed here, is the entry of another pull request that
          # waits for its release.
          own=0
          theirs=()
          others=()
          while read -r status name; do
            if [[ "$name" == '"CHANGELOG.md"' ]]; then
              changelog=true
            elif [[ "$name" =~ $fragment ]]; then
              fragments+=("${BASH_REMATCH[1]}")
              if [[ "$status" == added || "$status" == copied ]]; then
                own=$((own + 1))
              else
                theirs+=("${BASH_REMATCH[1]}")
              fi
            else
              others+=("$name")
            fi
          done < "$RUNNER_TEMP/changed"
          for path in "${theirs[@]}"; do
            echo "::warning file=$path,title=The entry of another pull request::main has $path already: the entry of another pull request that waits for its release. Leave its text to it, and describe the change of this pull request in a new fragment, such as changelog.d/<your branch without its type>.md, or the same name with -2 before .md."
          done
          # The release reads every file of changelog.d/; one that it can't take in fails
          # here, by its name as JSON.
          for name in "${others[@]}"; do
            echo "::error::$name is no fragment of the changelog. changelog.d/ holds Markdown files named with letters, digits, dots, dashes and underscores, such as changelog.d/dark-mode.md."
          done
          if ((${#others[@]} > 0)); then
            echo "Rename or move the files of changelog.d/ that the annotations name." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Each fragment is one question to the API in the next step.
          if ((${#fragments[@]} > 20)); then
            echo "::error title=Too many fragments::This pull request adds ${#fragments[@]} fragments of the changelog; describe its change in one, or a few."
            {
              echo "This pull request adds or changes ${#fragments[@]} fragments of the changelog; the check reads each of them, and 20 at most."
              echo
              echo "Put its entries into one fragment, or a few: a fragment holds every entry of a pull request, each below the heading of its kind of change."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$required" == true && "$changelog" == false ]] && ((own == 0)); then
            echo "::error title=No entry in the changelog::Describe what changes for users in a new file of changelog.d/, such as changelog.d/dark-mode.md, below a heading such as '### Features' or '### Bug fixes', or under '## Unreleased' in CHANGELOG.md; it becomes the notes of the next release."
            {
              echo "This pull request changes something for users, and the notes of the next release are the entries of the changelog; it has none of its own yet."
              echo
              echo "Add a new file to \`changelog.d/\`, named after the branch without its type, such as \`changelog.d/dark-mode.md\` for the branch \`feat/dark-mode\`, with the heading of its kind of change and an entry below it, in the words of a user:"
              echo
              echo "\`\`\`markdown"
              echo "### Features"
              echo
              echo "- **Dark mode:** the settings follow the theme of the system."
              echo "\`\`\`"
              echo
              echo "A line under \`## Unreleased\` in \`CHANGELOG.md\` works as well, but conflicts with each pull request that adds one at the same place."
              if ((${#theirs[@]} > 0)); then
                echo
                echo "The fragments that this pull request changes are the entries of other pull requests, which main has already; they don't count as its own."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$required" == true && "$changelog" == true ]]; then
            echo "CHANGELOG.md has the entry of this change." >> "$GITHUB_STEP_SUMMARY"
          fi
          if ((${#fragments[@]} > 0)); then
            printf '%s\n' "${fragments[@]}" > "$RUNNER_TEMP/fragments"
            echo "fragments=true" >> "$GITHUB_OUTPUT"
          fi
      # blueprint.py and CHANGELOG.md of the default branch check the fragments, which
      # they read as text, and the PR coach explains a failure with its
      # .github/checks.toml; nothing of the pull request is checked out or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() && (steps.entry.outputs.fragments == 'true' || failure()) }}
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Check the fragments as the release takes them in
        id: fragments
        if: ${{ !cancelled() && steps.entry.outputs.fragments == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          # In a folder of the same name, so that the problems name changelog.d/.
          folder="$RUNNER_TEMP/changelog.d"
          mkdir -p "$folder"
          while read -r path; do
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$GH_REPO/contents/$path?ref=$HEAD_SHA" > "$folder/${path#changelog.d/}"
          done < "$RUNNER_TEMP/fragments"
          # The parser of the text that the pull request controls runs without the token.
          if env -u GH_TOKEN python3 "$script" fragments --folder "$folder" > "$RUNNER_TEMP/report"; then
            cat "$RUNNER_TEMP/report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Each problem at its fragment, which the files of the pull request show.
          while read -r problem; do
            echo "::error file=${problem%%: *},title=The fragment of the changelog::${problem#*: }"
          done < "$RUNNER_TEMP/report"
          {
            echo "The release can't take in these fragments of the changelog:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/report"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml: each check
      # of the job that failed, or the job itself when none of them did.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "conventional title"
          FAILED: |
            ${{ steps.title.outcome == 'failure' && 'conventional title' || '' }}
            ${{ (steps.entry.outcome == 'failure' || steps.fragments.outcome == 'failure') && 'changelog' || '' }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          mapfile -t parts < <(grep . <<<"$FAILED" || true)
          python3 "$script" coach explain "$CHECK" --parts "${parts[@]}"
