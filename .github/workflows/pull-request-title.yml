name: Pull request title

# Pull requests are squashed into one commit named after their title, and the release
# bot builds the version and the changelog from these names. So the title must be a
# Conventional Commit; its type also sets the label of the pull request. A pull request
# that changes something for users, a feat, fix or perf, also says so under Unreleased
# in CHANGELOG.md, which becomes the notes of the release.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional title
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Never check out or run pull request code in this privileged workflow; the
      # title only reaches the script through an environment variable.
      - name: Check the title and set the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          pattern='^(feat|fix|docs|perf|refactor|test|ci|build|chore|style|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Use a Conventional Commit title such as 'feat(settings): add a dark mode' or 'fix: keep the token secret'."
            exit 1
          fi
          type="${BASH_REMATCH[1]}"
          scope="${BASH_REMATCH[2]}"
          breaking="${BASH_REMATCH[3]}"
          case "$type" in
            feat) wanted=(enhancement) ;;
            fix | perf) wanted=(bug) ;;
            docs) wanted=(documentation) ;;
            *) wanted=(maintenance) ;;
          esac
          if [[ "$scope" == "(deps)" || "$scope" == "(deps-dev)" ]]; then wanted=(dependencies); fi
          if [[ "$scope" == "(security)" ]]; then wanted=(security); fi
          if [[ "$scope" == "(i18n)" ]]; then wanted=(translations); fi
          # The release bot's pull request, "chore: release 1.7.0", is no change of its own.
          if [[ "$TITLE" =~ ^chore(\(release\))?:\ release\ v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then wanted=(release); fi
          if [[ "$BRANCH" == release-please--* ]]; then wanted=(release); fi
          if [[ -n "$breaking" ]]; then wanted+=(breaking-change); fi
          managed=(enhancement bug documentation maintenance dependencies release breaking-change security translations)
          current="$(gh pr view "$NUMBER" --json labels --jq '.labels[].name')"
          for label in "${managed[@]}"; do
            want=false
            for item in "${wanted[@]}"; do
              if [[ "$item" == "$label" ]]; then want=true; fi
            done
            has=false
            if grep -qx "$label" <<<"$current"; then has=true; fi
            if [[ "$want" == true && "$has" == false ]]; then gh pr edit "$NUMBER" --add-label "$label"; fi
            if [[ "$want" == false && "$has" == true ]]; then gh pr edit "$NUMBER" --remove-label "$label"; fi
          done
          echo "Labels: ${wanted[*]}" >> "$GITHUB_STEP_SUMMARY"

  changelog:
    name: changelog
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # No checkout: the files of the pull request come from the API.
      - name: Require an entry under Unreleased for a change for users
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.type }}
        run: |
          pattern='^(feat|fix|perf)(\(([a-z0-9._/-]+)\))?(!)?: '
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "A pull request of this type changes nothing for users; no entry needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Bots, such as Dependabot, the release bot and the blueprint bot, and updates
          # of dependencies write no notes of their own.
          if [[ "$AUTHOR" == Bot || "${BASH_REMATCH[3]}" == deps || "${BASH_REMATCH[3]}" == deps-dev ]]; then
            echo "Updates and bots write no entry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GH_REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename' | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md has the entry of this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Describe what changes for users under '## Unreleased' in CHANGELOG.md; it becomes the notes of the next release."
          exit 1
