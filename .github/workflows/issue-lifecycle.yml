name: Issue lifecycle

# Without AI: reminds reporters who were asked for information after 15 days,
# closes their issue after 30 days without an answer, closes a possible duplicate
# 3 days after the notice unless someone objected, labels the issues that a merged
# pull request fixes, and closes them with a link once a release ships the fix.
# Merges and releases start it at once, and every morning catches what was missed.
# A fixed issue that a release closes is filed under the release's milestone. The
# job is the issue assistant's reusable workflow at the commit of a release, so an
# update is a move of the pin below; it blocks every host but GitHub's.
# https://github.com/Dennis-Otto/issue-assistant

on:
  schedule:
    - cron: "41 6 * * *"
  # The job reads which issues a merged pull request fixes, never its code.
  pull_request_target:
    types: [closed]
  release:
    types: [published]
  # A release published with the job's GITHUB_TOKEN starts no workflow, so the end
  # of the repository's release workflow, Release, starts this one too. Not a
  # scheduled run of it, which runs every hour as a safety net and mostly releases
  # nothing; the morning sweep catches a release that one of them made. A release
  # workflow that starts this one itself sets
  # [releases] sweep_after_release_workflow = false
  # in .github/issue-assistant/config.toml, and install writes this workflow without
  # the start below.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would happen
        type: boolean
        default: true

permissions: {}

jobs:
  lifecycle:
    name: Issue lifecycle
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-issue-lifecycle.yml@00a1bb67482924c61555fc31542d3d67de661269 # v1.14.0
    with:
      dry_run: ${{ inputs.dry_run || false }}
