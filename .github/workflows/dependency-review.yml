name: Dependency review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base commit for the dependency comparison"
        required: true
        type: string
      head_ref:
        description: "Candidate commit for the dependency comparison"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The rules of the pull request itself: accepting an advisory shows in its diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
          head-ref: ${{ inputs.head_ref || github.event.pull_request.head.sha }}
          # The rules and the accepted advisories of this repository.
          config-file: ./.github/dependency-review.yml
