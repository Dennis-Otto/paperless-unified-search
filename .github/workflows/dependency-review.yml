name: Dependency review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: AGPL-3.0-or-later, Apache-2.0, BSD-3-Clause, ISC, MIT, OSL-3.0
          show-openssf-scorecard: true
          show-patched-versions: true
          retry-on-snapshot-warnings: true
