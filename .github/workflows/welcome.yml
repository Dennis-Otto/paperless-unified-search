name: Welcome

# The welcome bot: a person's first pull request in this repository gets a comment
# with what helps it along. New issues get the issue assistant's analysis instead.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request_target:
    types: [opened]

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  welcome:
    name: welcome
    if: >-
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # No checkout: the comment needs nothing of the pull request.
      - name: Welcome the first pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment "$NUMBER" --body "$(printf '%s\n' \
            "Thank you for your first pull request, @$AUTHOR! Three things help it along:" \
            "" \
            "- The title is a [Conventional Commit](https://www.conventionalcommits.org/), such as \`fix: keep the token secret\`; the release notes are made from it." \
            "- Every commit carries a sign-off (\`git commit -s\`), the [Developer Certificate of Origin](https://developercertificate.org/)." \
            "- \`bash scripts/check.sh\` runs the checks of the CI on your computer." \
            "" \
            "[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) explains the rest. The checks start once the maintainer approves them for this first pull request.")"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
