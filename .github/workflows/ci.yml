name: CI (php)

# PHP: Composer's locked tools and the checks of scripts/check.sh, the same ones
# that run locally. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (php)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # Whether the job kept the report of the taint analysis for code scanning.
      taint: ${{ steps.taint.outcome }}
    env:
      # The same krankerl as the release workflow's.
      # renovate: datasource=github-releases depName=ChristophWurst/krankerl extractVersion=^v(?<version>.+)$
      KRANKERL_VERSION: 0.14.0
      KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge of a pull request into main, and its head as the second
          # parent, onto which the fix bot commits.
          fetch-depth: 2
          persist-credentials: false
      # The tools run on the PHP of config.platform.php in composer.json, for which
      # Composer locks them; the app on the oldest PHP of appinfo/info.xml and every
      # newer one, which the step Oldest PHP of the checks takes as php8.2 or the like.
      - name: Find the PHP of the tools and the oldest PHP of the app
        id: php
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          import sys
          from xml.etree import ElementTree


          def minor(version):
              return ".".join(version.split(".")[:2])


          with open("composer.json", encoding="utf-8") as manifest:
              platform = json.load(manifest).get("config", {}).get("platform", {})
          php = ElementTree.parse("appinfo/info.xml").find("dependencies/php")
          oldest = minor(php.get("min-version", "")) if php is not None else ""
          tools = minor(platform.get("php", "")) or oldest
          if not tools:
              sys.exit("Neither config.platform.php of composer.json nor appinfo/info.xml names a PHP.")
          print(f"tools={tools}")
          print(f"oldest={oldest or tools}")
          EOF
      - name: Set up the oldest PHP of the app
        if: steps.php.outputs.oldest != steps.php.outputs.tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ steps.php.outputs.oldest }}
          extensions: dom, libxml, mbstring, xml
          coverage: none
      # The last PHP that setup-php sets up is the one that php runs.
      - name: Set up the PHP of the tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ steps.php.outputs.tools }}
          extensions: dom, libxml, mbstring, xml
          coverage: pcov
          tools: composer:v2
      # Composer keeps the packages that it downloads in its cache, so that a run
      # unpacks them from there instead of downloading each again. The key changes
      # with composer.lock; after a change of it, the cache of the last lock file
      # still holds most of the packages.
      - name: Find the cache of Composer
        id: composer
        run: echo "files=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Restore the packages of Composer from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer.outputs.files }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install the locked tools
        run: composer install --no-interaction --prefer-dist --no-progress
      # krankerl comes from the cache of the CI once a run has downloaded it, so that
      # the checks don't depend on GitHub's downloads of releases. The key changes with
      # krankerl, and GitHub saves the cache only after a run that passed.
      - name: Restore krankerl from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krankerl
          key: krankerl-${{ env.KRANKERL_VERSION }}-${{ env.KRANKERL_SHA256 }}
      - name: Install krankerl, which builds the package of the app
        run: |
          deb="$RUNNER_TEMP/krankerl/krankerl_${KRANKERL_VERSION}_amd64.deb"
          if [[ ! -f "$deb" ]]; then
            mkdir -p "$RUNNER_TEMP/krankerl"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 300 --output "$deb" \
              "https://github.com/ChristophWurst/krankerl/releases/download/v$KRANKERL_VERSION/krankerl_${KRANKERL_VERSION}_amd64.deb"
          fi
          # The package of the cache too.
          echo "$KRANKERL_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
      # php-cs-fixer skips a file that its cache knows as clean by the hash of its
      # content, and reads a cache only of the same version, rules and PHP. The key
      # changes with every commit, so that each run that passed saves what it checked,
      # and a run starts from the latest cache of its branch or of main.
      - name: Restore the cache of php-cs-fixer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ hashFiles('composer.lock', '.php-cs-fixer.dist.php') }}-${{ github.sha }}
          restore-keys: php-cs-fixer-${{ hashFiles('composer.lock', '.php-cs-fixer.dist.php') }}-
      - name: Run the checks
        run: bash scripts/check.sh
      - name: Keep the coverage report
        if: always() && hashFiles('build/coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage.xml
          retention-days: 14
      # The paths that the taint analysis found, none when it passed, for code scanning:
      # the job taint-report uploads them.
      - name: Keep the report of the taint analysis
        id: taint
        if: always() && hashFiles('build/psalm-taint.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psalm-taint
          path: build/psalm-taint.sarif
          retention-days: 3
      # The fix bot: the commands of autofix in .github/checks.toml fix what they
      # can of what the checks found, on the head of the pull request or on main.
      # After the checks, the bot commits the files that they changed onto a branch
      # of this repository, suggests them on a pull request from a fork, or keeps one
      # pull request with the fixes of main.
      - name: Fix what a command can fix
        id: fix
        if: failure() && contains(fromJSON('["pull_request", "push"]'), github.event_name)
        env:
          CHECK: "check (php)"
          EVENT: ${{ github.event_name }}
        run: |
          # The head of the pull request, onto which the bot commits, not its merge
          # into main.
          if [[ "$EVENT" == pull_request ]]; then
            git checkout --quiet --force --detach HEAD^2
          fi
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" fix run "$CHECK" --keep "$RUNNER_TEMP/fixes" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the fixes for the fix bot
        if: failure() && steps.fix.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixes-check
          path: ${{ runner.temp }}/fixes/
          # Fixes of files in .github/ as well.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (php)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  # The paths of the taint analysis in code scanning, with each line that they take, on
  # the pull request and in the Security tab, as CodeQL shows those of the other
  # languages. A job of its own, which runs no code of the app: the token that writes
  # the alerts never meets the tools of Composer or the code of a pull request. Not for
  # a pull request from a fork, whose token can't write them.
  taint-report:
    name: taint report (php)
    needs: check
    if: >-
      !cancelled() && needs.check.outputs.taint == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Code scanning tells a finding from a new one by the lines of the code at it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the report of the taint analysis
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psalm-taint
          path: ${{ runner.temp }}/psalm-taint
      - name: Upload the paths to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/psalm-taint/psalm-taint.sarif
          category: psalm-taint
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "taint report (php)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
