name: CI (php)

# PHP: Composer's locked tools and the checks of scripts/check.sh, the same ones
# that run locally. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (php)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the PHP of composer.json
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: dom, libxml, mbstring, xml
          coverage: none
          tools: composer:v2
      - name: Install the locked tools
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install krankerl, which builds the package of the app
        env:
          # The same krankerl as the release workflow's.
          KRANKERL_VERSION: 0.14.0
          KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/krankerl.deb" \
            "https://github.com/ChristophWurst/krankerl/releases/download/v$KRANKERL_VERSION/krankerl_${KRANKERL_VERSION}_amd64.deb"
          echo "$KRANKERL_SHA256  $RUNNER_TEMP/krankerl.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/krankerl.deb"
      - name: Run the checks
        run: bash scripts/check.sh
