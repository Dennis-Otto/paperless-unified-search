name: CI (php)

# PHP: Composer's locked tools and the checks of scripts/check.sh, the same ones
# that run locally. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (php)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The same krankerl as the release workflow's.
      KRANKERL_VERSION: 0.14.0
      KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the PHP of composer.json
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: dom, libxml, mbstring, xml
          coverage: pcov
          tools: composer:v2
      # Composer keeps the packages that it downloads in its cache, so that a run
      # unpacks them from there instead of downloading each again. The key changes
      # with composer.lock; after a change of it, the cache of the last lock file
      # still holds most of the packages.
      - name: Find the cache of Composer
        id: composer
        run: echo "files=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Restore the packages of Composer from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer.outputs.files }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install the locked tools
        run: composer install --no-interaction --prefer-dist --no-progress
      # krankerl comes from the cache of the CI once a run has downloaded it, so that
      # the checks don't depend on GitHub's downloads of releases. The key changes with
      # krankerl, and GitHub saves the cache only after a run that passed.
      - name: Restore krankerl from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krankerl
          key: krankerl-${{ env.KRANKERL_VERSION }}-${{ env.KRANKERL_SHA256 }}
      - name: Install krankerl, which builds the package of the app
        run: |
          deb="$RUNNER_TEMP/krankerl/krankerl_${KRANKERL_VERSION}_amd64.deb"
          if [[ ! -f "$deb" ]]; then
            mkdir -p "$RUNNER_TEMP/krankerl"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 300 --output "$deb" \
              "https://github.com/ChristophWurst/krankerl/releases/download/v$KRANKERL_VERSION/krankerl_${KRANKERL_VERSION}_amd64.deb"
          fi
          # The package of the cache too.
          echo "$KRANKERL_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
      # php-cs-fixer skips a file that its cache knows as clean by the hash of its
      # content, and reads a cache only of the same version, rules and PHP. The key
      # changes with every commit, so that each run that passed saves what it checked,
      # and a run starts from the latest cache of its branch or of main.
      - name: Restore the cache of php-cs-fixer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ hashFiles('composer.lock', '.php-cs-fixer.dist.php') }}-${{ github.sha }}
          restore-keys: php-cs-fixer-${{ hashFiles('composer.lock', '.php-cs-fixer.dist.php') }}-
      - name: Run the checks
        run: bash scripts/check.sh
      - name: Keep the coverage report
        if: always() && hashFiles('build/coverage.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: build/coverage.xml
          retention-days: 14
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (php)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
