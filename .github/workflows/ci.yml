name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KRANKERL_VERSION: 0.14.0
  KRANKERL_SHA256: 9bee5a756a83c5a6b1f040e9a2ade9e902e4a57211afc174cd8ac5c4f913958f

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pull request DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DCO_TRUSTED_AUTOMATION: ${{ github.actor == 'dependabot[bot]' && 'dependabot[bot]' || '' }}
        run: scripts/check-dco.sh "${BASE_SHA}" "${HEAD_SHA}"

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      # The labels, issue forms, workflows and notice of the issue assistant fit the
      # templates of its release: https://github.com/Dennis-Otto/issue-assistant
      - name: Check the issue assistant's set-up
        uses: Dennis-Otto/issue-assistant@b718a906576a9ec51034fd30828e9148f83d61ae # v1.2.1
        with:
          command: check

      - name: Test protected release automation
        run: python3 -m unittest discover -s tests/release -v

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Verify release version consistency
        run: composer version:check

      - name: Validate Nextcloud app metadata
        run: |
          curl --fail --silent --show-error https://apps.nextcloud.com/schema/apps/info.xsd --output /tmp/nextcloud-app-info.xsd
          # This is PHP code, not a shell expression.
          # shellcheck disable=SC2016
          php -r '$document = new DOMDocument(); $document->load("appinfo/info.xml"); exit($document->schemaValidate("/tmp/nextcloud-app-info.xsd") ? 0 : 1);'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check dependencies for known vulnerabilities
        run: composer audit

      - name: Lint JavaScript
        run: node --check js/settings.js && node --check l10n/de.js

      - name: Verify translation catalogs
        run: composer l10n:check

      - name: Run unit tests
        run: composer test

      - name: Check PHP style
        run: composer cs:check

      - name: Run static analysis
        run: composer psalm

      - name: Install verified Krankerl package builder
        shell: bash
        run: |
          PACKAGE="${RUNNER_TEMP}/krankerl.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/ChristophWurst/krankerl/releases/download/v${KRANKERL_VERSION}/krankerl_${KRANKERL_VERSION}_amd64.deb" \
            --output "${PACKAGE}"
          echo "${KRANKERL_SHA256}  ${PACKAGE}" | sha256sum --check --strict
          sudo dpkg --install "${PACKAGE}"

      - name: Build and verify production package
        run: |
          krankerl package
          composer package:check
