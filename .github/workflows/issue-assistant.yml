name: Issue assistant

# A first analysis of new issues, the labels of the issue forms and the answers that
# the assistant or the maintainer waits for: https://github.com/Dennis-Otto/issue-assistant
#
# The jobs are the issue assistant's reusable workflow at the commit of a release, so
# an update is a move of the pin below. event and apply run no AI; analyze runs the
# engine of .github/issue-assistant/config.toml with a read-only token and read-only
# tools on the egress-firewall runner (.github/egress-firewall.yaml), and apply
# checks its answer before anything is written. The permissions below are the most
# that any of its jobs gets.
#
# Without the engine's secret in the environment issue-assistant, or with the
# repository variable ISSUE_ASSISTANT_AI set to "off", only labels and the lifecycle
# work. The issue assistant's check command keeps this file equal to its template.
#
# A run by hand, also through the REST API, answers an issue that has no comment of
# its task yet. Someone with write access starts it, and may add an instruction; a
# maintainer, with the role admin or maintain, may tick override to have the
# assistant answer again past its one comment. The job event checks the role of
# the person who started the run, and its summary records every override.
#
# The task backlog, for a maintainer alone, gives the open issues without a first
# analysis one each, the oldest after the number of issue first, up to [engine]
# backlog_per_run of config.toml: the job assistant chooses them, and the job
# backlog analyzes each. It sets labels only, unless comment is ticked.
#
# This is the form for [failures] workflow of .github/issue-assistant/config.toml:
# when a job of a run fails, the last job, failure, starts the workflow of the
# repository that the key names, which gives the run a second try.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue; for backlog, the issue after which it starts, 0 for the oldest
        required: true
        type: number
      mode:
        description: Task of the assistant
        type: choice
        options: [triage, follow-up, maintainer-reply, release-reply, maintainer-question, backlog]
        default: triage
      instruction:
        description: What the assistant should do, such as "ask for the logs" (triage and follow-up)
        type: string
        default: ""
      override:
        description: Answer again past the one comment of the task (maintainers only)
        type: boolean
        default: false
      comment:
        description: With backlog, post each first analysis as a comment, not only its labels
        type: boolean
        default: false
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: true

permissions: {}

# The runs of one issue run one after the other. Up to 100 wait their turn, first
# in, first out, so an answer written while an analysis runs is never dropped. The
# runs on the backlog, too.
concurrency:
  group: issue-assistant-${{ github.event.issue.number || (inputs.mode == 'backlog' && 'backlog') || inputs.issue }}
  cancel-in-progress: false
  queue: max

jobs:
  assistant:
    name: Issue assistant
    permissions:
      contents: read
      issues: write
      discussions: read
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-issue-assistant.yml@65e7cfe8f981edab9542063a59d006e53c1af963 # v1.15.1
    with:
      dry_run: ${{ inputs.dry_run || false }}
    # Passed by name: only the job analyze sees their values, those of the
    # environment issue-assistant, which only the default branch may use.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  # The task backlog: the job assistant chose the issues, and a call of the same
  # workflow for each gives it its first analysis, two at a time, so that a long
  # backlog doesn't hold up the runners and the engine's limits.
  backlog:
    name: Issue assistant on the backlog
    needs: assistant
    if: needs.assistant.outputs.backlog != ''
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.assistant.outputs.backlog) }}
    permissions:
      contents: read
      issues: write
      discussions: read
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-issue-assistant.yml@65e7cfe8f981edab9542063a59d006e53c1af963 # v1.15.1
    with:
      dry_run: ${{ inputs.dry_run || false }}
      backlog_issue: ${{ matrix.issue }}
    # Passed by name: only the job analyze sees their values, those of the
    # environment issue-assistant, which only the default branch may use.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  # The second try of a run that failed: a job of it failed at its first attempt,
  # and the workflow of the repository that [failures] workflow of
  # .github/issue-assistant/config.toml names gets the run, such as the bot-health
  # bot of the Repo Blueprint, which runs the failed jobs once more when
  # Harden-Runner stopped one of them. GitHub keeps the jobs that passed, with their
  # outputs, when it runs the failed jobs again: the analysis isn't made twice, and
  # the job that posts it leaves an issue alone that has it. Not at the second
  # attempt, which runs this job again after the failed ones; not in a fork; and not
  # for a run by hand, whose second try would check the role of the person who ran
  # it again in place of the one who started it.
  failure:
    name: Start the workflow for failed runs
    needs: [assistant, backlog]
    if: failure() && github.run_attempt == 1 && !github.event.repository.fork && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Starts the workflow of [failures] workflow.
      actions: write
    env:
      # The workflow of [failures] workflow of config.toml, which install writes here.
      WORKFLOW: bot-health.yml
    steps:
      - name: Block every host but GitHub's API
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again.
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting. One that took its changes back says so in its log, and
          # no status will come.
          log=/home/agent/agent.log
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            grep -qs 'Reverted changes' "$log" && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          # Before its firewall stands, the agent looks up each host that it allows, and
          # takes itself away again when a single lookup fails; its log names the host.
          lookup="$(grep -s -m 1 'Error resolving allowed domain' "$log" || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ -n "$lookup" ]]; then
            # The host follows "resolve domain" when the resolver answered with an
            # error, and "name=" when no resolver could be reached.
            what="a host that it allows"
            pattern='resolve domain ([^ ,]+)|name=([^&" ]+)'
            if [[ "$lookup" =~ $pattern ]]; then
              host="${BASH_REMATCH[1]:-${BASH_REMATCH[2]}}"
              what="${host%.}, a host that it allows,"
            fi
            why="has an agent that took itself away again because a single lookup of $what failed, which is no outage,"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          [[ -z "$lookup" ]] || echo "The log of the agent: $lookup"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - name: Start the workflow for failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        # The workflow runs on the default branch and gets the id of this run as its
        # input run. GitHub starts a workflow that the token of a job dispatches. A
        # call that GitHub fails, as in an outage, tries again twice.
        run: |
          for wait in 10 20 0; do
            if gh workflow run "$WORKFLOW" --field run="$RUN"; then
              echo "A job of this run failed, so $WORKFLOW looks at it and may run the failed jobs once more." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            ((wait)) || break
            echo "GitHub didn't start $WORKFLOW, so the job tries again in $wait seconds."
            sleep "$wait"
          done
          echo "::error title=The workflow for failed runs didn't start::GitHub didn't start $WORKFLOW of [failures] workflow in .github/issue-assistant/config.toml for this run."
          exit 1
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
