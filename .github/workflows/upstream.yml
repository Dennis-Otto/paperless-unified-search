name: Upstream

# The upstream bot of a Nextcloud app. Every week it compares the newest release of
# Nextcloud with the max-version of appinfo/info.xml. When Nextcloud has a new major
# version, it opens a pull request as the release app that raises max-version to it
# and says so in a fragment of the changelog, changelog.d/nextcloud-<version>.md, so
# that every check, the end-to-end tests of the newest version included, runs against
# it. It merges itself once they pass, unless the repository variable
# UPSTREAM_AUTOMERGE is off. Started by hand as a dry run, it only shows the pull
# request it would open, and changes nothing.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show the pull request it would open, and change nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream
  cancel-in-progress: false

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  nextcloud:
    name: newest Nextcloud
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the upstream bot
          TASK: open the pull request of a new major version of Nextcloud
          WITHOUT: nothing has changed
          REQUIRED: "true"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py app register\` registers the app, sets its private key and opens the pull request that names it in \`.github/repository.toml\`; \`python3 .github/blueprint.py checklist\` shows what is left, such as its installation and the settings. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request of the update need.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise max-version to the newest major version of Nextcloud
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          AUTOMERGE: ${{ vars.UPSTREAM_AUTOMERGE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/nextcloud/server/releases/latest --jq .tag_name)"
          newest="${latest#v}"
          newest="${newest%%.*}"
          current="$(python3 -c 'import xml.etree.ElementTree as t; print(t.parse("appinfo/info.xml").getroot().find("dependencies/nextcloud").get("max-version"))')"
          echo "Nextcloud $latest is the newest release; the app supports up to $current."
          if ((newest <= current)); then
            exit 0
          fi
          branch="upstream/nextcloud-$newest"
          if [[ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            echo "The pull request for Nextcloud $newest is open already."
            exit 0
          fi

          sed -i -E "s/(<nextcloud [^>]*max-version=\")[0-9]+(\")/\1$newest\2/" appinfo/info.xml
          # The entry of the release notes in a fragment of the changelog of its own, so
          # that neither a release nor another pull request conflicts with it.
          fragment="changelog.d/nextcloud-$newest.md"
          mkdir -p changelog.d
          printf '### Changed\n\n- Supports Nextcloud %s.\n' "$newest" > "$fragment"
          if [[ "$DRY_RUN" == true ]]; then
            echo "A dry run: the pull request \"feat: support Nextcloud $newest\" from the branch $branch would make this change."
            git add --intent-to-add "$fragment"
            git --no-pager diff
            exit 0
          fi

          # The commit goes through GitHub's API as the release app, so GitHub signs
          # it, as main requires, and it starts the checks.
          base="$(git rev-parse HEAD)"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$base" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi
          jq --null-input --arg repo "$GH_REPO" --arg branch "$branch" --arg head "$base" \
            --arg headline "feat: support Nextcloud $newest" \
            --rawfile info <(base64 --wrap=0 appinfo/info.xml) \
            --arg fragment "$fragment" --rawfile entry <(base64 --wrap=0 "$fragment") \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: [
                  {path: "appinfo/info.xml", contents: $info},
                  {path: $fragment, contents: $entry}]}}}}' |
            gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid
          gh pr create --base main --head "$branch" --title "feat: support Nextcloud $newest" \
            --body "Nextcloud $latest is out. This raises \`max-version\` in \`appinfo/info.xml\` from $current to $newest, so that the checks and the end-to-end tests run against Nextcloud $newest, and the release notes say that the app supports it."
          if [[ "$AUTOMERGE" != "off" ]]; then
            gh pr merge "$branch" --auto --squash
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
