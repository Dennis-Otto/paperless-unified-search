name: OpenSSF Scorecard

# The OpenSSF Scorecard: it rates the security practices of the repository, such as
# its branch protection, its pinned actions and its signed releases, after every
# push to main and every week, publishes the score for the badge of the README and
# sends each finding to code scanning. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 3 * * 4"
  workflow_dispatch:

# Published Scorecard results require read-all here and only the job permissions below.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze supply-chain security
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      # Not to a private repository without GitHub Code Security, which keeps the
      # results in the artifact above.
      - name: Upload results to code scanning
        if: always() && vars.CODE_SCANNING != 'off'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
