name: Area labels

# The labeler bot. It gives a pull request the labels of the areas whose files it
# changes, by the paths in .github/labeler.yml, and takes them away when it no longer
# changes them. The type label comes from the title check.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

# One run for each commit, so that a late run for an older commit cancels none for
# a newer one; each run labels by the files of the pull request as they are then.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  labels:
    name: area labels
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      # No checkout: the labeler reads its rules from the base branch and the changed
      # files from the API, so the code of a pull request never runs here.
      - name: Label the areas that the pull request changes
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
