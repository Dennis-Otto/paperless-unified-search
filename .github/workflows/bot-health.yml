name: Bot health

# The bot-health bot. GitHub mails the failure of a scheduled run only to whoever
# last changed its schedule, and that of another run to whoever started it, which
# here is mostly the release app, so a failing bot went unnoticed for days. When a
# run of a bot or a scheduled workflow ends on the default branch, or the verification
# of a release that someone published by hand or with a token, this bot runs its
# failed jobs once more if a second try can pass, as it does with a job that GitHub
# cancelled at its time limit. Findings, Mutation, the property tests and the fuzzing
# would only hide or repeat their failure, so they get it only when every job that
# failed failed outside the code: Harden-Runner stopped it, or GitHub cancelled it at
# its time limit in the set-up of the job, before a step of its own ran, and in
# Findings, whose jobs take under a minute, also in the runner after its last step.
# Such a time-out that comes back is reported from its third time in 7 days, by the
# name of its job, while its jobs still run once more (decision 1118). A failure that
# stays keeps one issue per workflow open, with the label bot-failure, the failed jobs,
# their steps and their first errors, and the next run that passes closes it once every
# job that failed ran again in it, in every leg of its matrix, and passed: a run that
# skipped such a job, as a push that only plans the screenshots, leaves it open. Every
# night it also looks at the latest run of every workflow, those of the project and the
# checks of main too, in case GitHub lost an event, and starts a workflow whose schedule
# GitHub missed or switched off. A failure of Lint at a commit that the branch has left
# says nothing any more, because a pull request reaches the branch only when it passes
# Lint: it gets no issue, and an open one starts Lint by hand, so that a run that passes
# closes it. The same look compares the social preview that GitHub shows with
# .github/social-preview.png, which only a person can upload, and keeps one issue open,
# Upload the new social preview, until they are the same, in a public repository only,
# since GitHub shows no social preview of a private one; its label is manual-step, not
# bot-failure, since nothing fails there. The same look starts the blueprint bot when
# the blueprint has a newer release than .copier-answers.yml names and the pull request
# of the bot doesn't bring it yet, so that a repository that the Rollout doesn't start
# gets it within a day. Runs of pull requests start nothing here, as the filter of the
# branches leaves them out before GitHub makes a run, and neither does a run that GitHub
# couldn't start, as in its outage of 9 November 2026: the nightly look runs it again
# once. A look that GitHub keeps failing ends with a notice, not a failure (decision
# 0136).
# The bots of events, Area labels, Welcome, Dependabot maintenance and Commands, also
# those of a pull request or of a fork, and the workflows that keep an issue of their
# own, such as Newest Node, get neither a second try nor an issue here, unless
# Harden-Runner stopped a job of their first attempt, or a job of Newest PHP broke
# before its tests ran: then their failed jobs run once more, as nothing else would run
# them again (decisions 0141 and 1119). Their end starts nothing
# here: a last job of theirs starts this bot by hand with the run, and only when a job
# failed at their first attempt (decision 0176). Nothing follows the end of Bot health
# itself, so the nightly look runs the failed jobs of its own runs of the last two
# days once more that Harden-Runner stopped at their first attempt, and those of the
# bots of events and of the workflows with an issue of their own whose last job
# Harden-Runner or GitHub kept from starting this bot. A run of Issue assistant for an
# event of an issue gets the same second try when Harden-Runner stopped a job of it:
# the last job failure of its caller, which [failures] workflow of
# .github/issue-assistant/config.toml chooses, starts this bot with the run, and the
# nightly look covers a run whose start failed; the rerun posts the analysis that its
# first attempt kept, and its end starts nothing here either.
# It checks out the default branch only, for blueprint.py, never the code of a pull
# request; blueprint.py bot-health holds the logic.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_run:
    # The bots and the scheduled workflows of every repository; the daily look covers those of the project.
    workflows: [Blueprint update, Chrome Web Store, Clean-up, Findings, Fuzzing, Issue lifecycle, Labels, Links, Mutation, OSV-Scanner, OpenSSF Scorecard, Property tests, Release, Release verification, SBOM, Screenshots, Settings, Update branches, Upstream, Workflow security]
    # The runs of main, and of the tag of a release that someone published by hand,
    # which starts Release verification: GitHub makes no run of this bot for the end
    # of a run of a pull request, of which the jobs would skip every one (decision 0176).
    branches: [main, "v*"]
    types: [completed]
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: The run of a bot of events, of a workflow with an issue of its own or of Issue assistant for an issue, whose job failed at its first attempt, which runs once more if Harden-Runner stopped a job of it; empty for the nightly look
        type: string
        default: ""

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  run:
    name: look at the end of a bot's run
    # The eight workflows with a last job left the list of workflow_run, and Issue
    # assistant was never in it, so their ends never reach this job; the names stay here
    # as a guard against a workflow of a fork or a later list that takes one of them
    # (decision 0176).
    if: >-
      github.event_name == 'workflow_run' &&
      !github.event.repository.fork &&
      (github.event.workflow_run.head_branch == github.event.repository.default_branch ||
      (github.event.workflow_run.event == 'release' && github.event.workflow_run.name == 'Release verification')) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event) &&
      !contains(fromJSON('["Area labels", "Commands", "Dependabot maintenance", "Welcome", "Diagrams", "Newest Node", "Newest PHP", "Newest Python", "Next runner", "Issue assistant"]'), github.event.workflow_run.name) &&
      contains(fromJSON('["success", "failure", "timed_out", "cancelled", "startup_failure"]'), github.event.workflow_run.conclusion)
    # One run at a time for each workflow, so that two ends never open two issues.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Runs the failed jobs once more.
      actions: write
      # Reads the first error of a failed job.
      checks: read
      contents: read
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting. One that took its changes back says so in its log, and
          # no status will come.
          log=/home/agent/agent.log
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            grep -qs 'Reverted changes' "$log" && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          # Before its firewall stands, the agent looks up each host that it allows, and
          # takes itself away again when a single lookup fails; its log names the host.
          lookup="$(grep -s -m 1 'Error resolving allowed domain' "$log" || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ -n "$lookup" ]]; then
            # The host follows "resolve domain" when the resolver answered with an
            # error, and "name=" when no resolver could be reached.
            what="a host that it allows"
            pattern='resolve domain ([^ ,]+)|name=([^&" ]+)'
            if [[ "$lookup" =~ $pattern ]]; then
              host="${BASH_REMATCH[1]:-${BASH_REMATCH[2]}}"
              what="${host%.}, a host that it allows,"
            fi
            why="has an agent that took itself away again because a single lookup of $what failed, which is no outage,"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          [[ -z "$lookup" ]] || echo "The log of the agent: $lookup"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Run the failed jobs once more, or keep the issue of the workflow current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" bot-health run "$RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  stopped:
    name: run a bot again that Harden-Runner stopped
    # The bots of events and the workflows that keep an issue of their own, whose runs
    # the job run leaves alone: also a run of a pull request or of a fork, which runs
    # the workflow of its base again, at its first attempt only (decision 0141). Their
    # last job starts this bot by hand with the run while that run still ends, and only
    # when a job of their first attempt failed (decision 0176): the bot waits for the
    # end of the run. It acts only on a run of one of them, and not on one of the event
    # pull_request: none of them runs on it, so such a run is a workflow of a fork's
    # own, which only took the name of one of them.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run != '' &&
      !github.event.repository.fork
    concurrency:
      group: ${{ github.workflow }}-stopped-${{ inputs.run }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
