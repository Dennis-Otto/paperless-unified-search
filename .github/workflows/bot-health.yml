name: Bot health

# The bot-health bot. GitHub mails the failure of a scheduled run only to whoever
# last changed its schedule, and that of another run to whoever started it, which
# here is mostly the release app, so a failing bot went unnoticed for days. When a
# run of a bot or a scheduled workflow ends on the default branch, this bot runs its
# failed jobs once more if a second try can pass; a failure that stays keeps one
# issue per workflow open, with the label bot-failure, the failed jobs, their steps
# and their first errors, and the next run that passes closes it. Every night it
# also looks at the latest run of every workflow, those of the project and the
# checks of main too, in case GitHub lost an event, and starts a workflow whose
# schedule GitHub missed or switched off. Runs of pull requests start nothing here.
# It checks out the default branch only, for blueprint.py, never the code of a pull
# request; blueprint.py bot-health holds the logic.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_run:
    # The bots and the scheduled workflows of every repository; the daily look covers those of the project.
    workflows: [Blueprint update, Clean-up, Findings, Fuzzing, Issue lifecycle, Labels, Links, Mutation, OSV-Scanner, OpenSSF Scorecard, Property tests, Release, Release verification, SBOM, Settings, Update branches, Upstream, Workflow security]
    types: [completed]
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    name: look at the end of a bot's run
    if: >-
      github.event_name == 'workflow_run' &&
      !github.event.repository.fork &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event) &&
      contains(fromJSON('["success", "failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    # One run at a time for each workflow, so that two ends never open two issues.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Runs the failed jobs once more.
      actions: write
      # Reads the first error of a failed job.
      checks: read
      contents: read
      issues: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Run the failed jobs once more, or keep the issue of the workflow current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" bot-health run "$RUN" | tee -a "$GITHUB_STEP_SUMMARY"

  sweep:
    name: look after every workflow
    if: github.event_name != 'workflow_run' && !github.event.repository.fork
    concurrency:
      group: ${{ github.workflow }}-sweep
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Switches a schedule on again that GitHub switched off, and starts a workflow
      # whose schedule GitHub missed.
      actions: write
      checks: read
      contents: read
      issues: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Look at the latest run of every workflow, and start the missed ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" bot-health sweep | tee -a "$GITHUB_STEP_SUMMARY"
