name: Blueprint update

# The blueprint bot. Every week, and on demand, it brings the repository up to the
# latest release of the blueprint with `copier update` and opens a pull request as
# the release app, so that its checks run. Without conflicts, the pull request merges
# itself once every check passes; conflicts stay in it as markers for the maintainer.
# The repository variable BLUEPRINT_AUTOMERGE set to off makes every update wait.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "40 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: blueprint-update
  cancel-in-progress: false

jobs:
  update:
    name: blueprint update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Create a token of the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request of the update need, workflows included.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-pinned Copier
        run: pip install --require-hashes -r .github/copier-requirements.txt
      - name: Update to the latest release of the blueprint
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTOMERGE: ${{ vars.BLUEPRINT_AUTOMERGE }}
        run: |
          set -euo pipefail
          before="$(sed -n 's/^_commit: //p' .copier-answers.yml)"
          copier update --defaults --conflict inline
          after="$(sed -n 's/^_commit: //p' .copier-answers.yml)"
          changed="$(git status --porcelain | cut -c4-)"
          if [[ -z "$changed" || "$changed" == ".copier-answers.yml" ]]; then
            echo "The release $after of the blueprint changes nothing in this repository."
            exit 0
          fi
          conflicts="$(git grep -l -E '^<{7} ' -- . || true)"

          # The commit goes through GitHub's API as the release app: GitHub signs it, as
          # main requires, and the DCO check accepts the pull requests of the app.
          branch="blueprint/update"
          base="$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="$base" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi
          git add --all
          python3 - "$branch" "$base" "$before" "$after" > "$RUNNER_TEMP/commit.json" <<'PYTHON'
          import base64
          import json
          import os
          import subprocess
          import sys

          branch, base, before, after = sys.argv[1:]
          entries = subprocess.run(
              ["git", "diff", "--cached", "--name-status", "--no-renames", "-z", "HEAD"],
              capture_output=True, check=True,
          ).stdout.decode().split("\0")
          additions, deletions = [], []
          for status, path in zip(entries[0::2], entries[1::2]):
              if status == "D":
                  deletions.append({"path": path})
              else:
                  with open(path, "rb") as file:
                      contents = base64.b64encode(file.read()).decode()
                  additions.append({"path": path, "contents": contents})
          release = f"https://github.com/Dennis-Otto/repo-blueprint/releases/tag/{after}"
          print(json.dumps({
              "query": "mutation($input: CreateCommitOnBranchInput!) "
                       "{ createCommitOnBranch(input: $input) { commit { oid } } }",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": branch},
                  "expectedHeadOid": base,
                  "message": {
                      "headline": f"chore: update to the blueprint {after}",
                      "body": f"The changes of the blueprint from {before} to {after}: {release}",
                  },
                  "fileChanges": {"additions": additions, "deletions": deletions},
              }},
          }))
          PYTHON
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid

          body="$(printf '%s\n' \
            "Brings the repository from the blueprint's $before to [$after](https://github.com/Dennis-Otto/repo-blueprint/releases/tag/$after) with \`copier update\`." \
            "" \
            "${conflicts:+The update conflicts with changes of this repository in these files; resolve the markers, then merge:}" \
            "${conflicts}")"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "chore: update to the blueprint $after" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore: update to the blueprint $after" --body "$body"
          fi
          if [[ -z "$conflicts" && "$AUTOMERGE" != "off" ]]; then
            gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash
          fi
