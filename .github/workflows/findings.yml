name: Findings

# Without AI, every morning, after code scanning on main and when the accepted
# findings change: dismisses the code scanning alerts that .github/findings.toml
# accepts, with its reason, and fails while any other alert is open. The run names
# an open alert by its number and link only, which only maintainers can follow;
# nothing becomes a public issue. https://github.com/Dennis-Otto/issue-assistant

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths: [.github/findings.toml]
  workflow_run:
    workflows: [CodeQL, OpenSSF Scorecard]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would happen
        type: boolean
        default: true

permissions: {}

concurrency:
  group: findings
  cancel-in-progress: false

jobs:
  findings:
    name: Accept or report findings
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dismiss accepted findings and report the others
        uses: Dennis-Otto/issue-assistant@a12fb7227ff7d966809cad4e043e159977fccfcd # v1.2.2
        with:
          command: findings
          dry-run: ${{ inputs.dry_run || false }}
