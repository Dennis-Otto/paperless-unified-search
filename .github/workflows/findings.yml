name: Findings

# Without AI, every morning, after each scan of code scanning on main and when the
# accepted findings change: dismisses the code scanning alerts that
# .github/findings.toml accepts, with its reason, and fails while any other alert is
# open. The run names an open alert by its number and link only, which only
# maintainers can follow; nothing becomes a public issue. The job blocks every host
# but GitHub's with Harden-Runner. https://github.com/Dennis-Otto/issue-assistant

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths: [.github/findings.toml]
  # The workflows of the repository blueprint that report to code scanning.
  workflow_run:
    workflows: [CodeQL, OpenSSF Scorecard, Workflow security, OSV-Scanner]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would happen
        type: boolean
        default: true

permissions: {}

jobs:
  findings:
    name: Accept or report findings
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch))
    # The job waits for the group, not the run: a run whose job is skipped, after
    # the scan of a pull request, never takes the place of one that waits.
    concurrency:
      group: findings
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Block every host but GitHub's
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dismiss accepted findings and report the others
        uses: Dennis-Otto/issue-assistant@1f39474ecec19a599e6e7a6ab53357b36d0ea99f # v1.5.0
        with:
          command: findings
          dry-run: ${{ inputs.dry_run || false }}
