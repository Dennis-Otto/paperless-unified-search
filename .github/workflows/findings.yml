name: Findings

# Without AI, every morning, after each scan of code scanning on main and when the
# accepted findings change: dismisses the code scanning alerts that
# .github/findings.toml accepts, with its reason, and fails while any other alert is
# open. The run names an open alert by its number and link only, which only
# maintainers can follow; nothing becomes a public issue. The job is the issue
# assistant's reusable workflow at the commit of a release, so an update is a move of
# the pin below; it blocks every host but GitHub's.
# https://github.com/Dennis-Otto/issue-assistant

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths: [.github/findings.toml]
  # The workflows of the repository blueprint that report to code scanning.
  workflow_run:
    workflows: [CodeQL, OpenSSF Scorecard, Workflow security, OSV-Scanner]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would happen
        type: boolean
        default: true

permissions: {}

jobs:
  findings:
    name: Findings
    permissions:
      contents: read
      security-events: write
    uses: Dennis-Otto/issue-assistant/.github/workflows/reusable-findings.yml@eec0af47d18a67f27e83af79a2f41d8f3df7c9de # v1.8.0
    with:
      dry_run: ${{ inputs.dry_run || false }}
