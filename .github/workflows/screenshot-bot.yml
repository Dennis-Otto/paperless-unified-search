name: Screenshots

# The screenshot bot. A repository turns it on with scripts/screenshots.sh, which
# renders its pictures in place, wherever the documentation, the stores or the social
# preview take them from, and lists in .github/screenshots-paths.txt the files whose
# change can change them, as the paths of a workflow; without the script, every run
# ends after its plan. After a change of main that touches a file of the list, after
# every release, whose version a picture may show, and every week, the plan starts a
# run that renders, as the branch bot and a person do by hand. That run renders the
# newest main, one at a time, without secrets, with Docker, the whole history and the
# tools of the website in .venv-docs as CONTRIBUTING.md sets them up; the script of a
# new repository photographs the website and, by its kind, the integration in Home
# Assistant or the app in Nextcloud, each in Docker. .github/screenshots.toml, which
# belongs to the project, can name shards, which render side by side on runners of
# their own, each with SCREENSHOTS_SHARD set to its name, the files besides pictures
# that the script renders, such as a recording that a page plays, and the hosts that
# the jobs that render may reach, of which Harden-Runner then lets through no other
# (decision 0120); it can also leave hosts out of the wait, give the script a time
# limit and name the folder that a failed shard keeps (decision 0124). It compares each picture that changed with the one of main by its
# pixels: a picture whose pixels stayed the same keeps its file, so that a new
# encoder, browser or runner changes nothing. When pixels changed, the job collect
# puts the shards together, and the bot keeps one pull request from the branch
# bot/screenshots, as the release app, which merges itself once every check passes,
# and closes it when main looks as rendered without it. When main changed a picture or
# a page of the pull request while it rendered, as when the pull request before
# merged, it starts itself anew rather than open one that conflicts; the branch bot
# starts it for one that conflicts later (decision 0118). The bot commits only
# pictures and the files of the settings, by plain paths, outside .git and the
# workflows, and for a picture that came out at another size the width and the
# height that the pages of main name for it, so that the pull request passes a check
# of those sizes; without the release app, the run warns and keeps the pictures as an
# artifact. A failed run keeps an issue of the bot-health bot open until the jobs
# that failed pass again in a run; a push that only plans leaves it open.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "2 4 * * 2"
  workflow_dispatch:

permissions: {}

# One render at a time: a run by hand, which the plan of a due change, the branch bot
# and a person start, waits for the render before it, and a newer one that waits
# replaces it, since it renders a newer main. Every other run only plans, in a group
# of its own, so that a push that changes none of the listed files never replaces a
# waiting render of one that did.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'render' || github.run_id }}
  cancel-in-progress: false

env:
  # The GitHub CLI of the jobs sends no telemetry to GitHub.
  GH_TELEMETRY: "false"
  # Each call of its API asks for the version of the REST API that the steps are
  # written for (decision 0125).
  API_VERSION_HEADER: "X-GitHub-Api-Version: 2022-11-28"
  # The branch of the pull request, and the first line of its commits and its title.
  BRANCH: bot/screenshots
  HEADLINE: "docs: update the screenshots"

jobs:
  plan:
    name: plan the screenshots
    # Of the runs of the Release workflow, only one that passed for the push of the
    # merge of a release pull request made a release; its daily, manual and restarted
    # runs see the same release commit while main stays on it. A run by hand renders
    # without a plan.
    if: >-
      !github.event.repository.fork && github.event_name != 'workflow_dispatch' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Actions for the token of the job, which starts the run that renders.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      # The history without the contents of the files, to see what a push changed,
      # and only the files of the bot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            blueprint
            scripts
      - name: Decide whether the bot renders the pictures
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          # A push renders when it touches a file of the list; one whose commit before
          # is unknown, such as a forced one, renders all the same.
          since=""
          if [[ "$EVENT" == push ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            since="$BEFORE"
          fi
          if python3 "$tool" screenshots due --since "$since" >> "$GITHUB_STEP_SUMMARY"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif (($? != 1)); then
            exit 1
          fi
      # The run that renders waits for the one before it; one that waits already
      # renders the newer main instead.
      - name: Start the run that renders the pictures
        if: steps.plan.outputs.due == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --header "$API_VERSION_HEADER" --method POST "repos/$GH_REPO/actions/workflows/screenshot-bot.yml/dispatches" -f ref=main
          echo "The bot started a run of this workflow by hand, which renders \`main\` once the render before it ended." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  start:
    name: start the render
    # A run by hand: started by the plan, the branch bot or a person.
    if: >-
      !github.event.repository.fork && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.start.outputs.due }}
      sha: ${{ steps.start.outputs.sha }}
      shards: ${{ steps.start.outputs.shards }}
      policy: ${{ steps.start.outputs.policy }}
      hosts: ${{ steps.start.outputs.hosts }}
      skip_wait: ${{ steps.start.outputs.skip_wait }}
      timeout_minutes: ${{ steps.start.outputs.timeout_minutes }}
      failure_folder: ${{ steps.start.outputs.failure_folder }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The newest commit of the branch, not that of the event: a run that waited for
      # the one before renders main as it is now, with the pictures that its pull
      # request merged meanwhile, so that the pull request of this one doesn't
      # conflict there. Every shard renders that one commit, and the commits of the
      # pull request start from it; only the files of the bot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            .github
            blueprint
            scripts
      - name: Name the commit and the shards that render
        id: start
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          if python3 "$tool" screenshots due >> "$GITHUB_STEP_SUMMARY"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif (($? != 1)); then
            exit 1
          else
            exit 0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The shards, the files, the hosts, the time limit and the folder of a
          # failure of .github/screenshots.toml; settings that the bot can't take fail
          # here, with what is wrong.
          python3 "$tool" screenshots plan >> "$GITHUB_OUTPUT"

  render:
    name: render the screenshots${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    needs: start
    if: needs.start.outputs.due == 'true'
    runs-on: ubuntu-24.04
    # The script may start a demo of the project in containers.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # The other shards render on when one fails, so that a rerun of the failed jobs
      # renders only that one; the pull request takes every shard or none.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.start.outputs.shards) }}
    steps:
      # The script reaches whatever the project needs, its images and packages: every
      # host while .github/screenshots.toml names none, and otherwise only those and
      # the hosts of the steps of the job, for the code, uv, the packages of Python
      # and the artifacts.
      - name: Block the hosts that the project doesn't name
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ needs.start.outputs.policy }}
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            *.actions.githubusercontent.com:443
            ${{ needs.start.outputs.hosts }}
      # GitHub's DNS experiment on some of its runners hides the lookups of the job from
      # Harden-Runner, which then blocks the hosts of the job and of the runner until the
      # time limit (step-security/harden-runner#708). Harden-Runner takes it away unless
      # its feature flags say no; a job that keeps sudo makes sure (decision 0123).
      - name: Let Harden-Runner see the DNS lookups
        if: needs.start.outputs.policy == 'block'
        run: |
          dropins=(/etc/systemd/resolved.conf.d/90-egress-proxy.conf /run/systemd/resolved.conf.d/90-egress-proxy.conf)
          if [[ ! -e ${dropins[0]} && ! -e ${dropins[1]} ]] && ! grep -qs 127.0.0.100 /etc/resolv.conf; then
            exit 0
          fi
          echo "::notice::GitHub's DNS experiment is on this runner; taking it out of the way of Harden-Runner."
          sudo rm -f "${dropins[@]}"
          sudo systemctl restart systemd-resolved
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl stop egress-dns-resolver.service egress-outbound-proxy.service || true
          sudo resolvectl flush-caches || true
      - name: Wait until Harden-Runner lets the hosts through
        if: needs.start.outputs.policy == 'block'
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            *.actions.githubusercontent.com:443
            ${{ needs.start.outputs.hosts }}
          # Hosts of the project that keep a runner waiting, which its script asks
          # for only later or tries again by itself.
          SKIP_WAIT: ${{ needs.start.outputs.skip_wait }}
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      # With the whole history, as the Docs workflow checks it out: a picture of the
      # website shows the date of each page's last change, which git keeps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
      # The commit that the job start named, the same for every shard, and one of the
      # branch of the run: git checks out the commit itself, so that no input of
      # actions/checkout takes a commit from the output of another job.
      - name: Check out the commit that the job start names
        env:
          COMMIT: ${{ needs.start.outputs.sha }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$COMMIT" HEAD
          git checkout --quiet --detach "$COMMIT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.5"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            .github/screenshots-requirements.txt
            .github/docs-requirements.txt
            stacks/screenshots/requirements.txt
            stacks/docs/requirements-docs.txt
      - name: Install Pillow, which compares the pictures
        timeout-minutes: 5
        run: |
          requirements=.github/screenshots-requirements.txt
          [[ -f "$requirements" ]] || requirements=stacks/screenshots/requirements.txt
          uv venv --quiet "$RUNNER_TEMP/pictures"
          uv pip install --quiet --python "$RUNNER_TEMP/pictures" --require-hashes -r "$requirements"
      # The tools of the website, for a script that photographs its pages: it builds
      # them with .venv-docs/bin/mkdocs, as on your machine.
      - name: Install the tools of the website
        timeout-minutes: 5
        run: |
          requirements=.github/docs-requirements.txt
          [[ -f "$requirements" ]] || requirements=stacks/docs/requirements-docs.txt
          uv venv --quiet .venv-docs
          uv pip install --quiet --python .venv-docs --require-hashes -r "$requirements"
      # A shard renders and deletes only its own pictures; without shards, the script
      # gets no name and renders every picture, as on your machine. Within the time
      # limit of the settings, or else that of the job; the script itself gets the
      # SIGINT with which GitHub ends a step that runs out of time, so that it can
      # stop its demo and say where it waited, and the step after it keeps the folder
      # of the failure.
      - name: Render the pictures
        timeout-minutes: ${{ fromJSON(needs.start.outputs.timeout_minutes) }}
        env:
          SCREENSHOTS_SHARD: ${{ matrix.shard }}
        run: exec bash scripts/screenshots.sh
      - name: Compare the pictures with those of main
        id: keep
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          kept="$RUNNER_TEMP/screenshots"
          "$RUNNER_TEMP/pictures/bin/python" "$tool" screenshots keep "$kept" > "$RUNNER_TEMP/summary.md"
          {
            echo "### Screenshots${SHARD:+ of the shard $SHARD}"
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$kept/report.json" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the pictures for the job collect
        if: steps.keep.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.id }}
          path: ${{ runner.temp }}/screenshots/
          # Pictures in .github/ as well, such as the social preview.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # What the script left in the folder that .github/screenshots.toml names, such
      # as the screenshots and the logs of a section that failed, for a person to see,
      # by the shard and the attempt; under a name that the job collect never takes.
      - name: Keep the folder of the failure
        if: failure() && needs.start.outputs.failure_folder != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-render-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: ${{ needs.start.outputs.failure_folder }}
          if-no-files-found: warn
          retention-days: 7

  collect:
    name: collect the screenshots
    needs: [start, render]
    # Once every shard rendered: the pull request takes the pictures of every shard or
    # none, so that it never drops one that a shard rendered before.
    if: needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.collect.outputs.stale }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # blueprint.py, which checks what each shard kept, and the settings, which name
      # the files besides pictures, of the commit that the shards rendered, with the
      # history that holds it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/blueprint.py
            /.github/blueprint/
            /.github/screenshots.toml
            /blueprint.py
            /blueprint/
      # The commit that the job start named, the same for every shard, and one of the
      # branch of the run: git checks out the commit itself, so that no input of
      # actions/checkout takes a commit from the output of another job.
      - name: Check out the commit that the job start names
        env:
          COMMIT: ${{ needs.start.outputs.sha }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$COMMIT" HEAD
          git checkout --quiet --detach "$COMMIT"
      # Each into a folder of its own, but one alone into the folder itself.
      - name: Fetch what each shard kept
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-*
          path: ${{ runner.temp }}/shards
      - name: Put the shards together
        id: collect
        env:
          # The release app, which opens the pull request; without it, the run says
          # what to do.
          APP: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          kept="$RUNNER_TEMP/screenshots"
          shopt -s nullglob
          if [[ -f "$RUNNER_TEMP/shards/report.json" ]]; then
            shards=("$RUNNER_TEMP/shards")
          else
            shards=("$RUNNER_TEMP"/shards/*/)
          fi
          python3 "$tool" screenshots collect "$kept" "${shards[@]}" > "$RUNNER_TEMP/summary.md"
          {
            echo "### Screenshots"
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f "$kept/report.json" ]]; then
            exit 0
          fi
          if [[ -z "$APP" ]]; then
            echo "::warning::Pictures of main look different, and without the release app no bot opens the pull request with them. Run bash scripts/screenshots.sh, then python3 $tool screenshots restore, and commit what is left, or take the pictures from the artifact screenshots of this run."
            echo "The variable \`RELEASE_AUTOMATION_CLIENT_ID\` of the release app is empty, so no bot opens the pull request with these pictures; take them from the artifact \`screenshots\` of this run." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
      - name: Keep the pictures for the pull request
        if: steps.collect.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots/
          # Pictures in .github/ as well, such as the social preview.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  pull-request:
    name: keep the pull request of the screenshots
    needs: [start, collect]
    # Once main was rendered, to open, update or close the pull request.
    if: vars.RELEASE_AUTOMATION_CLIENT_ID != '' && needs.collect.result == 'success'
    # One run at a time ends what it started with the branch and the pull request.
    concurrency:
      group: ${{ github.workflow }}-pull-request
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    # Actions for the token of the job, which starts the workflow anew when main changed
    # a file of the pull request while the shards rendered.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      # The jobs render run the script of the project and its tools; the code that runs
      # below with the token of the release app comes only from a commit of main, never
      # from one that a run by hand on another branch names, such as that of a fork.
      - name: Check that main has the commit that the job start names
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.start.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/compare/$SHA...main" --jq .behind_by)" == 0 ]]
      # blueprint.py, which checks what the job collect kept, the settings, which name
      # the files besides pictures that it takes, and the Markdown of the pages, whose
      # named sizes it corrects; none of the pictures of main. Of the commit that the
      # shards rendered, which the commits start from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.start.outputs.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/blueprint.py
            /.github/blueprint/
            /.github/screenshots.toml
            /blueprint.py
            /blueprint/
            /*.md
            /docs/**/*.md
      - name: Fetch the pictures that the job collect kept
        if: needs.collect.outputs.stale == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the screenshot bot
          TASK: open the pull request of the screenshots
          WITHOUT: the artifact screenshots of the job collect holds them
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py app register\` registers the app, sets its private key and opens the pull request that names it in \`.github/repository.toml\`; \`python3 .github/blueprint.py checklist\` shows what is left, such as its installation and the settings. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request need, workflows included: the
          # branch of an open pull request moves from a commit on an older main to one
          # on the newest, and GitHub refuses that move without workflows when main
          # changed a workflow in between. The commits themselves hold only what
          # blueprint.py lets through: pictures, the files that the settings of main
          # name, and new sizes on the pages of main.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open, update or close the pull request of the screenshots
        if: steps.app.outputs.token != ''
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          STALE: ${{ needs.collect.outputs.stale }}
          SHA: ${{ needs.start.outputs.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The token of the job, which may start a run of this workflow.
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          # Only the app's own pull request from the branch of this repository: a fork
          # may open one from a branch of the same name.
          open="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository,author \
            --jq "map(select(.isCrossRepository == false and .author.login == \"app/$APP_SLUG\"))[0].number // empty")"
          if [[ "$STALE" != true ]]; then
            if [[ -n "$open" ]]; then
              gh pr close "$open" --delete-branch \
                --comment "\`main\` looks as rendered without this pull request: $URL"
              echo "main looks as rendered; closed #$open." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          kept="$RUNNER_TEMP/screenshots"
          # main may have moved on while the shards rendered, such as by the merge of the
          # pull request before this one: a pull request from the commit that was
          # rendered would conflict over each picture or page that main changed since.
          # Then the bot leaves the branch and the pull request as they are, and renders
          # main anew, as the commit that it renders is the newest one.
          gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/compare/$SHA...main" \
            --jq '{behind_by, files: [.files[]? | {filename, previous_filename}]}' > "$RUNNER_TEMP/compared.json"
          if python3 "$tool" --repo "$GH_REPO" screenshots overtaken "$kept" \
            --compared "$RUNNER_TEMP/compared.json" >> "$GITHUB_STEP_SUMMARY"; then
            GH_TOKEN="$ACTIONS_TOKEN" gh api --header "$API_VERSION_HEADER" --method POST \
              "repos/$GH_REPO/actions/workflows/screenshot-bot.yml/dispatches" -f ref=main
            echo "The bot started a new run of this workflow, which renders main anew." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          # 3 means not; an error that the tool does not catch exits 1.
          elif (($? != 3)); then
            exit 1
          fi

          # Points the branch of the pull request at a commit, new or moved.
          point() {
            if gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/git/ref/heads/$1" > /dev/null 2>&1; then
              gh api --header "$API_VERSION_HEADER" --method PATCH "repos/$GH_REPO/git/refs/heads/$1" -f sha="$2" -F force=true > /dev/null
            else
              gh api --header "$API_VERSION_HEADER" --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$1" -f sha="$2" > /dev/null
            fi
          }
          # The commits start from the commit that was rendered, so that there is one
          # pull request, however often main changed. They are made on a branch of
          # their own, and the branch of the pull request moves to the last in one
          # step: a pull request whose head is a commit of main would be closed by
          # GitHub. That branch starts anew, so that one which a failed run left
          # behind can't stop the next run.
          scratch="$BRANCH-next"
          if gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/git/ref/heads/$scratch" > /dev/null 2>&1; then
            gh api --header "$API_VERSION_HEADER" --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          fi
          gh api --header "$API_VERSION_HEADER" --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$scratch" -f sha="$SHA" > /dev/null
          # The commits go through GitHub's API as the release app: GitHub signs them,
          # as main requires, and they start the checks. The sign-off names the app's
          # account, which is the author of the commits. A large set of pictures goes
          # in several commits, each below the size of one request.
          user_id="$(gh api --header "$API_VERSION_HEADER" "users/${APP_SLUG}[bot]" --jq .id)"
          body="Rendered by scripts/screenshots.sh on $SHA, the pictures whose pixels changed and the files of .github/screenshots.toml that changed: $URL

          Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          head="$SHA"
          parts="$(python3 "$tool" --repo "$GH_REPO" screenshots parts "$kept")"
          for ((part = 1; part <= parts; part++)); do
            python3 "$tool" --repo "$GH_REPO" screenshots commit "$kept" --branch "$scratch" \
              --head "$head" --headline "$HEADLINE" --body "$body" --part "$part" > "$RUNNER_TEMP/commit.json"
            head="$(gh api --header "$API_VERSION_HEADER" graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          done
          point "$BRANCH" "$head"
          gh api --header "$API_VERSION_HEADER" --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          python3 "$tool" --repo "$GH_REPO" screenshots report "$kept" --sha "$SHA" --run "$URL" > "$RUNNER_TEMP/body.md"
          if [[ -n "$open" ]]; then
            gh pr edit "$open" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md"
          else
            created="$(gh pr create --base main --head "$BRANCH" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md")"
            open="${created##*/}"
          fi
          gh pr merge "$open" --auto --squash
          echo "The pull request of the screenshots, #$open from $BRANCH, has the commit $head, and merges itself once every check passes." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
