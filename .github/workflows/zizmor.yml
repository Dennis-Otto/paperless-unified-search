name: Workflow security

# zizmor checks every workflow for the ways a workflow gets attacked: template
# injection, permissions wider than needed, credentials that persist, unpinned
# actions and dangerous triggers, and asks GitHub for the advisories of the actions
# that they pin. In every pull request into main, also the release pull request,
# whatever it changes: the rules of main stop a merge while the pull request adds an
# alert of zizmor, and while its analysis is missing. On main after every merge and
# every week, for the analysis that code scanning compares the pull requests with; an
# advisory published since shows as an alert of the next pull request, until a run
# on main by hand gives main the alert. Its findings go to code scanning, where the
# Findings workflow keeps them fixed or accepted; .github/zizmor.yml holds what the
# repository accepts on purpose. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "8 5 * * 6"
  workflow_dispatch:

permissions: {}

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version of zizmor that the action pins, so that a pull request and main are
      # audited alike: an update of the action brings a newer one, and its pull request
      # shows what the newer audits find.
      - name: Check the workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Without code scanning, which a private repository lacks without GitHub
          # Code Security, every finding is an annotation and fails the check.
          advanced-security: ${{ vars.CODE_SCANNING != 'off' }}
          annotations: ${{ vars.CODE_SCANNING == 'off' }}
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: zizmor
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
