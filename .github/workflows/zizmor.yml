name: Workflow security

# zizmor checks every workflow for the ways a workflow gets attacked: template
# injection, permissions wider than needed, credentials that persist, unpinned
# actions and dangerous triggers: in every pull request that changes a workflow, an
# action or the settings of Dependabot, and on main and every week for the analysis
# that code scanning compares pull requests with. Its findings go to code scanning,
# where the Findings workflow keeps them fixed or accepted; .github/zizmor.yml holds
# what the repository accepts on purpose. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - "**/action.yml"
      - "**/action.yaml"
      - .github/dependabot.yml
      - .github/zizmor.yml
  schedule:
    - cron: "35 5 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    # Not in the release pull request: the branch of the release bot in this repository.
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: zizmor
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
