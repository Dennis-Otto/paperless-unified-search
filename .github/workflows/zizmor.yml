name: Workflow security

# zizmor checks every workflow for the ways a workflow gets attacked: template
# injection, permissions wider than needed, credentials that persist, unpinned
# actions and dangerous triggers, and asks GitHub for the advisories of the actions
# that they pin. In every pull request into main, also the release pull request,
# whatever it changes: the rules of main stop a merge while the pull request adds an
# alert of zizmor, and while its analysis is missing. On main after every merge and
# every week, for the analysis that code scanning compares the pull requests with; an
# advisory published since shows as an alert of the next pull request, until a run
# on main by hand gives main the alert. Its findings go to code scanning, where the
# Findings workflow keeps them fixed or accepted; .github/zizmor.yml holds what the
# repository accepts on purpose. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "8 5 * * 6"
  workflow_dispatch:

permissions: {}

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            results-receiver.actions.githubusercontent.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version of zizmor that the action pins, so that a pull request and main are
      # audited alike: an update of the action brings a newer one, and its pull request
      # shows what the newer audits find.
      - name: Check the workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Without code scanning, which a private repository lacks without GitHub
          # Code Security, every finding is an annotation and fails the check.
          advanced-security: ${{ vars.CODE_SCANNING != 'off' }}
          annotations: ${{ vars.CODE_SCANNING == 'off' }}
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: zizmor
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
