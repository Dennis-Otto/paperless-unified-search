name: Diagrams

# The diagram bot of main. The GitHub app, the stores and other renderers of Markdown
# show a ```mermaid block as code, so every diagram is a picture of its source in
# docs/diagrams/, and the check diagrams of each pull request keeps it that way. When
# main still has a ```mermaid block, a missing or stale picture, or a picture without
# its source, after the update of the blueprint that brought the pictures, a merge
# that went around the check or a change of the renderer, this workflow draws the
# diagrams with scripts/diagrams.sh --extract and keeps one pull request with the fix
# from the branch bot/diagrams, as the release app, which merges itself once every
# check passes. It runs after every change of main that touches a diagram or a page
# of Markdown, and every week; when main is fixed otherwise, it closes the pull
# request. Drawing runs without secrets; only the job of the pull request has the
# release app, and runs nothing that it drew; without the release app, the run warns
# and names the command that fixes main. A failed run opens an issue, which the next
# weekly run closes once the bot passes again.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - docs/diagrams/**
      - docs/images/diagrams/**
      - scripts/diagrams.sh
  schedule:
    - cron: "18 4 * * 6"
  workflow_dispatch:

permissions: {}

# One run at a time, which ends what it started with the branch and the pull request.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The GitHub CLI of the jobs sends no telemetry to GitHub.
  GH_TELEMETRY: "false"
  # The branch of the pull request, and the first line of its commit and its title.
  BRANCH: bot/diagrams
  HEADLINE: "docs: draw the diagrams anew"

jobs:
  draw:
    name: draw the diagrams of main
    if: "!github.event.repository.fork"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      drawn: ${{ steps.draw.outputs.drawn }}
      stale: ${{ steps.draw.outputs.stale }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit before, to see what a push changed.
          fetch-depth: 2
          persist-credentials: false
      - name: Draw the diagrams of main
        id: draw
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # The release app, which opens the pull request; without it, the run says
          # what to do.
          APP: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
        run: |
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          # A push of one commit that changes no source, no picture and not the script
          # leaves every picture as the check diagrams of its pull request found it; only
          # a new ```mermaid block needs pictures then, which extract finds without
          # Docker and the large image of mermaid-cli.
          if [[ "$EVENT" == push && "$(git rev-parse HEAD^ 2> /dev/null)" == "$BEFORE" ]] &&
            git diff --quiet HEAD^ HEAD -- docs/diagrams docs/images/diagrams scripts/diagrams.sh; then
            python3 "$tool" diagrams extract
            if [[ -z "$(git status --porcelain)" ]]; then
              echo "The push changes no diagram and adds no \`mermaid\` block." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          bash scripts/diagrams.sh --extract
          echo "drawn=true" >> "$GITHUB_OUTPUT"
          changed="$(python3 "$tool" diagrams keep "$RUNNER_TEMP/diagrams")"
          if [[ -z "$changed" ]]; then
            echo "Every diagram of main is a picture of its source, as drawn." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$APP" ]]; then
            printf '### Diagrams\nThe pull request of the diagram bot changes these files:\n\n%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::main has diagrams that not every reader sees, and without the release app no bot opens the pull request that fixes them. Run bash scripts/diagrams.sh --extract with Docker and commit what it changes, or take the files from the artifact diagrams of this run."
            {
              echo "### Diagrams"
              echo "The variable \`RELEASE_AUTOMATION_CLIENT_ID\` of the release app is empty, so no bot opens the pull request with these files. Run \`bash scripts/diagrams.sh --extract\` with Docker and commit what it changes, or take the files from the artifact \`diagrams\` of this run:"
              echo
              echo "$changed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
      - name: Keep the diagrams for the pull request
        if: steps.draw.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: ${{ runner.temp }}/diagrams/
          # Pages of Markdown in .github/ as well.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  pull-request:
    name: keep the pull request of the diagrams
    needs: draw
    # Once main was drawn, to open, update or close the pull request.
    if: vars.RELEASE_AUTOMATION_CLIENT_ID != '' && needs.draw.outputs.drawn == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      # blueprint.py, which checks what the job draw kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/blueprint
            blueprint
      - name: Fetch the diagrams that the job draw kept
        if: needs.draw.outputs.stale == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagrams
          path: ${{ runner.temp }}/diagrams
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the diagram bot
          TASK: open the pull request of the diagrams
          WITHOUT: the artifact diagrams of the job draw holds them
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py checklist\` shows the steps: a link that registers the app with its permissions filled in, the update of the answers of the blueprint that names it in \`.github/repository.toml\`, the settings and its private key. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request need, workflows included: the
          # branch of an open pull request moves from a commit on an older main to one
          # on the newest, and GitHub refuses that move without workflows when main
          # changed a workflow in between. The commit itself holds only what
          # blueprint.py lets through: sources, pictures and pages of Markdown.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open, update or close the pull request of the diagrams
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          STALE: ${{ needs.draw.outputs.stale }}
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ "$STALE" != true ]]; then
            if [[ -n "$open" ]]; then
              gh pr close "$open" --delete-branch \
                --comment "\`main\` has every diagram as a picture of its source without this pull request: $URL"
              echo "main is fixed; closed #$open." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # Points the branch of the pull request at a commit, new or moved.
          point() {
            if gh api "repos/$GH_REPO/git/ref/heads/$1" > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$1" -f sha="$2" -F force=true > /dev/null
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$1" -f sha="$2" > /dev/null
            fi
          }
          # The commit starts from the commit that was drawn, so that there is one pull
          # request with one commit, however often main changed. It is made on a branch
          # of its own, and the branch of the pull request moves to it in one step: a
          # pull request whose head is a commit of main would be closed by GitHub. That
          # branch starts anew, so that one which a failed run left behind can't stop
          # the next run.
          scratch="$BRANCH-next"
          if gh api "repos/$GH_REPO/git/ref/heads/$scratch" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$scratch" -f sha="$SHA" > /dev/null
          tool=.github/blueprint.py
          [[ -f "$tool" ]] || tool=blueprint.py
          kept="$RUNNER_TEMP/diagrams"
          # The commit goes through GitHub's API as the release app: GitHub signs it, as
          # main requires, and it starts the checks. The sign-off names the app's
          # account, which is the author of the commit.
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          body="Drawn by scripts/diagrams.sh --extract from the sources in docs/diagrams/: $URL

          Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          python3 "$tool" --repo "$GH_REPO" diagrams commit "$kept" --branch "$scratch" \
            --head "$SHA" --headline "$HEADLINE" --body "$body" > "$RUNNER_TEMP/commit.json"
          commit="$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          point "$BRANCH" "$commit"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          python3 "$tool" diagrams report "$kept" --for pull-request > "$RUNNER_TEMP/body.md"
          if [[ -n "$open" ]]; then
            gh pr edit "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh pr merge "$BRANCH" --auto --squash
          echo "The pull request of the diagrams from $BRANCH has the commit $commit, and merges itself once every check passes." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The issue of a failed run of the bot: a failure opens it or brings it up to date,
  # and the weekly run closes it once the bot passes again.
  report:
    name: report
    needs: [draw, pull-request]
    if: >-
      !cancelled() && !github.event.repository.fork &&
      (contains(needs.*.result, 'failure') || github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Keep the issue of the diagram bot current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The diagram bot fails"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$FAILED" != true ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The diagram bot passes again: $URL"
            fi
            exit 0
          fi
          body="$(printf '%s\n\n%s\n' \
            "The Diagrams workflow failed on main, so a \`mermaid\` block or a stale picture may stay there. Its log says why; the weekly run closes this issue once the bot passes again." \
            "The latest failure: $URL")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label maintenance --body "$body"
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
