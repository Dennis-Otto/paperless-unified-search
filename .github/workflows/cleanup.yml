name: Clean-up

# The clean-up bot. Every week it deletes what nobody needs any more: the branches
# that main holds completely and that no open pull request uses, and the caches of
# the Actions that belong to closed pull requests. A branch with commits that main
# doesn't have stays; the bot lists it once it is a month old, so that its owner
# decides. It never touches main, release, Renovate or Dependabot branches.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "13 5 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup
  cancel-in-progress: false

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"
  # Each call of its API asks for the version of the REST API that the steps are
  # written for (decision 0125).
  API_VERSION_HEADER: "X-GitHub-Api-Version: 2022-11-28"

jobs:
  cleanup:
    name: clean up
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Delete the branches that main holds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          used="$(gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName')"
          day_ago="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          month_ago="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted=() kept=() refused=()
          # Git allows a # or a % in the name of a branch, so each request names it
          # encoded, with its slashes as they are, and the summary as it is. A branch
          # that GitHub refuses is a warning, and the bot goes on with the next one.
          while IFS=$'\t' read -r branch path; do
            case "$branch" in
              "$DEFAULT" | gh-pages | release-please--* | renovate/* | dependabot/*) continue ;;
            esac
            if grep -qxF "$branch" <<<"$used"; then
              continue
            fi
            if ! counts="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/compare/$DEFAULT...$path" --jq '[.ahead_by, .behind_by] | @tsv')"; then
              refused+=("$branch")
              continue
            fi
            read -r ahead behind <<<"$counts"
            if [[ "$ahead" == 0 ]]; then
              # A branch made from main a moment ago has no commit of its own yet
              # either, and its last commit is that of main, however old: only one
              # that main moved past a day ago or earlier is left over, by the date
              # of the first commit that main has and the branch doesn't.
              if [[ "$behind" == 0 ]]; then
                continue
              elif ! since="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/compare/$path...$DEFAULT" --jq '.commits[0].commit.committer.date')"; then
                refused+=("$branch")
              elif [[ "$since" > "$day_ago" ]]; then
                continue
              elif gh api --header "$API_VERSION_HEADER" --method DELETE "repos/$GH_REPO/git/refs/heads/$path" --silent; then
                deleted+=("$branch")
              else
                refused+=("$branch")
              fi
            elif ! date="$(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/commits/$path" --jq .commit.committer.date)"; then
              refused+=("$branch")
            elif [[ "$date" < "$month_ago" ]]; then
              kept+=("$branch, $ahead commit(s) that $DEFAULT doesn't have, last on ${date%%T*}")
            fi
          done < <(gh api --header "$API_VERSION_HEADER" "repos/$GH_REPO/branches" --paginate --jq '.[] | select(.protected | not) | [.name, (.name | @uri | gsub("%2F"; "/"))] | @tsv')
          for branch in "${refused[@]}"; do
            echo "::warning::GitHub refused a request for the branch ${branch//%/%25}; the clean-up looks at it again next week."
          done
          # The backticks are Markdown of the summary, not the shell's.
          # shellcheck disable=SC2016
          {
            echo "### Branches"
            if ((${#deleted[@]})); then printf -- '- deleted `%s`, which main holds\n' "${deleted[@]}"; fi
            if ((${#kept[@]})); then printf -- '- kept `%s`: without a pull request for a month\n' "${kept[@]}"; fi
            if ((${#refused[@]})); then printf -- '- left `%s` for next week: GitHub refused a request for it\n' "${refused[@]}"; fi
            if ! ((${#deleted[@]} + ${#kept[@]} + ${#refused[@]})); then echo "Nothing to clean up."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the caches of closed pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          open="$(gh pr list --state open --limit 500 --json number --jq '.[].number')"
          count=0
          while read -r id ref; do
            number="$(sed -n 's#^refs/pull/\([0-9]*\)/merge$#\1#p' <<<"$ref")"
            if [[ -n "$number" ]] && ! grep -qx "$number" <<<"$open"; then
              gh cache delete "$id"
              count=$((count + 1))
            fi
          done < <(gh cache list --limit 1000 --json id,ref --jq '.[] | "\(.id) \(.ref)"')
          echo "### Caches" >> "$GITHUB_STEP_SUMMARY"
          echo "Deleted $count cache(s) of closed pull requests." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
