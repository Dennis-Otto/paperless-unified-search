name: Visual check comment

# The second half of the visual check (visual.yml). When the check of a pull request
# ends, this workflow posts or updates one comment on the pull request: the pictures
# that look different, with the share of their pixels that changed, the comparison of
# each, with the frame that it shows of an animation, and whether the artifact holds the
# picture of their difference, and a link to the artifact with each one before and
# after, in comparison/ the place of its change before and after in one picture, in its
# own colors, and in diff/ the changed pixels in red. It may comment, so it
# never checks out or runs the code of the pull request: it reads only the report of
# the check, takes nothing from it but paths, changes and numbers that it checks, and
# writes the comment itself.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads the report of the check only, never the code of the pull request
    workflows: [Visual check]
    types: [completed]

permissions: {}

env:
  # The GitHub CLI of the job sends no telemetry to GitHub.
  GH_TELEMETRY: "false"

concurrency:
  group: visual-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # to download the report of the check's run
      pull-requests: write # to post and update the comment
    steps:
      # The job may comment, so it reaches GitHub's API alone; Harden-Runner itself
      # allows the storage of the artifacts. Without sudo and Docker no step can lift
      # the block. It stops when Harden-Runner doesn't block, waits until Harden-Runner
      # lets its host through, and last until Harden-Runner has removed Docker, with the
      # steps of the jobs of the blueprint that block, as tests/e2e/selftest.sh checks.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of the
        # blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Write the comment from the report of the check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # The pull request whose head is the commit the check rendered; a pull request
          # from a fork is found by the commit, and one that moved on gets no comment.
          number="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha) | .number][0] // empty' <<<"$PULL_REQUESTS")"
          if [[ -z "$number" ]]; then
            number="$(gh pr list --state open --search "$HEAD_SHA" --json number,headRefOid \
              | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha) | .number][0] // empty')"
          fi
          if [[ -z "$number" || "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" != "$HEAD_SHA" ]]; then
            echo "No open pull request has $HEAD_SHA as its head any more."
            exit 0
          fi

          folder="$RUNNER_TEMP/visual"
          mkdir -p "$folder"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | "\(.name) \(.id)"' > "$folder/artifacts.txt"
          if grep -qE '^visual ' "$folder/artifacts.txt"; then
            gh run download "$RUN_ID" --name visual --dir "$folder/visual"
          fi

          python3 - "$folder" > "$folder/post" <<'PYTHON'
          import json
          import os
          import re
          import sys

          folder = sys.argv[1]
          # Only what a report of tests/e2e/visual-compare.mjs may hold; anything else
          # is left out.
          path_pattern = re.compile(r"^(?!.*(^|/)\.\.?(/|$))[A-Za-z0-9_.][A-Za-z0-9._/-]*\.(png|gif|jpe?g|webp|mp4)$")
          statuses = {"changed", "new", "deleted"}

          def drawn(path, status, name, folder="diff"):
              # The picture of the difference or the comparison only where keep draws
              # it, for a changed picture: under diff/ or comparison/ at its path, as a
              # PNG. Any other counts as none.
              suffix = "" if path.lower().endswith(".png") else ".png"
              return status == "changed" and name == f"{folder}/{path}{suffix}"

          def counted(value):
              return isinstance(value, int) and not isinstance(value, bool) and value >= 1

          def change(status, compared, frame, frames):
              # For an animation, the frame of the comparison, as the screenshot bot
              # names it; a frame that isn't one of the frames is left out.
              if compared and counted(frame) and counted(frames) and 1 < frames and frame <= frames:
                  return f"{status}, most in frame {frame} of {frames}"
              return status

          sha = os.environ["HEAD_SHA"][:7]
          run = os.environ["RUN_URL"]
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['RUN_ID']}"
          link = None
          with open(f"{folder}/artifacts.txt") as file:
              for line in file:
                  name, _, number = line.strip().partition(" ")
                  if name == "visual" and number.isdigit():
                      link = f"{base}/artifacts/{number}"

          def percent(share):
              if share is None:
                  return "–"
              if share >= 1:
                  return "100 %"
              return "< 0.01 %" if share < 0.0001 else f"{share * 100:.2f} %"

          lines = ["<!-- visual-check -->", "### Visual check", ""]
          try:
              with open(f"{folder}/visual/report.json") as file:
                  report = json.load(file)
          except (OSError, ValueError):
              report = None
          post = "always"
          if not isinstance(report, dict) or not isinstance(report.get("pictures"), list):
              if os.environ["CONCLUSION"] == "success":
                  lines.append(f"The [run]({run}) left no report for {sha}.")
              else:
                  lines.append(f"The pictures could not be rendered for {sha}; the [run]({run}) shows why.")
          else:
              rows = []
              differences = 0
              comparisons = 0
              for entry in report["pictures"]:
                  if not isinstance(entry, dict):
                      continue
                  path, status, share = entry.get("path"), entry.get("status"), entry.get("share")
                  if (
                      isinstance(path, str) and path_pattern.match(path)
                      and status in statuses
                      and (share is None or (isinstance(share, (int, float)) and not isinstance(share, bool) and 0 <= share <= 1))
                  ):
                      red = drawn(path, status, entry.get("diff"))
                      compared = drawn(path, status, entry.get("comparison"), "comparison")
                      differences += red
                      comparisons += compared
                      shown = f"`{entry['comparison']}`" if compared else "–"
                      rows.append(
                          f"| `{path}` | {change(status, compared, entry.get('frame'), entry.get('frames'))} "
                          f"| {percent(share)} | {shown} | {'yes' if red else '–'} |"
                      )
              if not rows:
                  lines.append(f"Rendered by `scripts/screenshots.sh` for {sha}: every picture looks as committed.")
                  post = "existing"
              else:
                  many = "1 picture looks" if len(rows) == 1 else f"{len(rows)} pictures look"
                  lines += [
                      f"Rendered by `scripts/screenshots.sh` for {sha}: {many} different from the committed ones.",
                      "",
                      "| Picture | Change | Pixels changed | Before and after | In red |",
                      "| --- | --- | ---: | --- | --- |",
                      *rows,
                      "",
                  ]
                  if link and comparisons:
                      lines.append(
                          f"[The pictures before and after]({link}), with the comparison that *Before and after* "
                          "names: the place of the change before and after in one picture, in its own colors, "
                          "with a red frame around each change on both sides. For an animation it shows the frame "
                          "with the most changes, which *Change* names."
                          + (
                              " In `diff/` each changed pixel in red of every picture with *yes* under *In red*, "
                              "of the same frame."
                              if differences
                              else ""
                          )
                      )
                  elif link and differences:
                      lines.append(
                          f"[The pictures before and after]({link}), and in `diff/` each changed pixel in red "
                          "of every picture with *yes* under *In red*, framed in red where it changed."
                      )
                  elif link:
                      lines.append(
                          f"[The pictures before and after]({link}). None of them has a comparison or its changed "
                          "pixels in red: a new or a deleted picture, a video and a picture whose size or number "
                          "of frames changed have neither."
                      )
                  lines.append(
                      "This check only reports. When the change is intended, the screenshot bot "
                      "renews the pictures after the merge."
                  )
          with open(f"{folder}/comment.md", "w") as file:
              file.write("\n".join(lines) + "\n")
          print(post)
          PYTHON

          post="$(cat "$folder/post")"
          existing="$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-check -->"))) | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$folder/comment.md" >/dev/null
            echo "Updated the comment on #$number."
          elif [[ "$post" == always ]]; then
            gh api --method POST "repos/$GH_REPO/issues/$number/comments" -F "body=@$folder/comment.md" >/dev/null
            echo "Commented on #$number."
          else
            echo "Every picture looks as committed; #$number needs no comment."
          fi
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
