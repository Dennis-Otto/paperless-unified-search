name: Secret scan

# Gitleaks looks for secrets in the commits of every pull request, and every week in
# the whole history of main. Not after a merge, which brings only the commits of a
# pull request that it scanned; GitHub's secret scanning with push protection guards
# every push as well. https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request:
  schedule:
    - cron: "55 4 * * 5"
  workflow_dispatch:

permissions:
  contents: read

# One run for each commit of a pull request: a quick check, whose runs for different
# commits never cancel each other, so that a late run for an older commit can't
# cancel the check of the head.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: gitleaks
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
