name: CodeQL

# The code analysis of GitHub. CodeQL reads the code of every language of this
# repository and its workflows with the queries of security-extended, for every pull
# request, every push to main and every week, and sends what it finds to code
# scanning, where a new alert of a pull request stops its merge. A private repository
# without GitHub Code Security has no code scanning: there the settings bot sets the
# variable CODE_SCANNING to off, and the check passes without an analysis, because the
# terms of CodeQL allow it on private code only with GitHub Code Security or Advanced
# Security.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "49 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  # One job for every language, which downloads CodeQL once and takes one runner:
  # the analyses run one after the other, and each language keeps the category of
  # its own analysis, /language:<name>, under which code scanning keeps its alerts.
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # For Python, JavaScript or TypeScript, Ruby and the workflows, CodeQL reaches only
      # GitHub. A repository with Go, Java or Kotlin, or Rust only records the traffic of
      # the job instead, as its SECURITY.md says: CodeQL may fetch the dependencies of
      # that code from hosts that no run has shown yet (decision 0130).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The terms of CodeQL allow it on the code of a private repository only with a
      # licence of GitHub Code Security or Advanced Security (decision 0082).
      - name: Skip the analysis without GitHub Code Security
        if: vars.CODE_SCANNING == 'off'
        run: |
          message="CodeQL doesn't analyze this repository: its terms allow it on private code only with GitHub Code Security or Advanced Security, and CODE_SCANNING is off. zizmor, OSV-Scanner and the linters of check.sh still run."
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      # The analysis takes the CodeQL that the action brings, `linked`, so that it
      # changes only with the action, which Renovate moves, and the runner usually has
      # it in its tool cache. Without it there, the action would download it from the
      # page of its release without a token, which timed out for hours on 8 November
      # 2026 (decision 0133): .github/download.sh downloads it through the API with the
      # token of the job, tries again after an error and checks it by the digest that
      # GitHub keeps, and the action takes it from that file.
      - name: Download the CodeQL of the action unless the runner has it
        id: bundle
        if: vars.CODE_SCANNING != 'off'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # The runner keeps the actions of the job beside the folder of the workspace.
          defaults=("${RUNNER_WORKSPACE%/*}"/_actions/github/codeql-action/*/src/defaults.json)
          if ((${#defaults[@]} != 1)); then
            echo "::notice::The CodeQL of the action is not where the runner keeps it; the action looks for it itself."
            exit 0
          fi
          bundle="$(jq -r .bundleVersion "${defaults[0]}")"
          cli="$(jq -r .cliVersion "${defaults[0]}")"
          if [[ -f "$RUNNER_TOOL_CACHE/CodeQL/$cli/x64.complete" ]]; then
            echo "CodeQL $cli of the action comes from the tool cache of the runner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tools="$RUNNER_TEMP/codeql-bundle/codeql-bundle-linux64.tar.zst"
          bash .github/download.sh github/codeql-action "$bundle" codeql-bundle-linux64.tar.zst "$tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "CodeQL $cli of the action, which the runner doesn't have, is downloaded through the API." >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize the analysis
        if: vars.CODE_SCANNING != 'off'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          tools: ${{ steps.bundle.outputs.tools || 'linked' }}
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - name: Analyze
        if: vars.CODE_SCANNING != 'off'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # The results of each language as <language>.sarif, uploaded below.
          output: ${{ runner.temp }}/codeql
          upload: never
      # Without a category, the results of every language would take the one of the
      # job, and code scanning would see new analyses, whose alerts open anew. Each
      # file gets the category that the analysis of its language always had.
      - name: File the results of each language under its own category
        if: vars.CODE_SCANNING != 'off'
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/codeql/*.sarif)
          if ((${#files[@]} == 0)); then
            echo "::error::CodeQL wrote no results."
            exit 1
          fi
          echo "The categories of the analyses:" >> "$GITHUB_STEP_SUMMARY"
          for file in "${files[@]}"; do
            # CodeQL names each file after the extractor; the category keeps the
            # name of the language as configured, as the analyses always had it.
            language="$(basename "$file" .sarif)"
            case "$language" in
              javascript) language=javascript-typescript ;;
              java) language=java-kotlin ;;
              cpp) language=c-cpp ;;
            esac
            jq --arg id "/language:$language/" '.runs[].automationDetails = {id: $id}' \
              "$file" > "$file.json"
            mv "$file.json" "$file"
            echo "- $language: \`/language:$language\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload the results
        if: vars.CODE_SCANNING != 'off'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/codeql
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure() && steps.blocks.outcome != 'failure'
        env:
          CHECK: codeql
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
