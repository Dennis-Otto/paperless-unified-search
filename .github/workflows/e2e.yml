name: Docker E2E

# The end-to-end tests in Docker against every Nextcloud version that appinfo/info.xml
# supports, from min-version to max-version, so that raising max-version, as the
# upstream bot does, tests the new version at once. A pull request and a push test the
# images that tests/e2e/nextcloud-images.txt pins by their digests, and Renovate brings
# each new release as a pull request of its own: a new release of Nextcloud can't turn
# every open pull request red at the same moment, and a run can be repeated later. One
# job, the required check "nextcloud", runs all versions at the same time
# (tests/e2e/run-all.sh): no queue between jobs, and one download of the browser. In
# a pull request, the search dialog runs on a phone only against the newest version,
# which saves the others 16 to 19 seconds each; everywhere else every size runs against
# every version. Beside them, tests/e2e/upgrade.sh upgrades the last release to the
# checkout, on the newest version in a pull request and on every version elsewhere.
#
# A pull request or push that changes no file the tests cover, such as one of the
# documentation, of the CI or from the blueprint, passes the check in seconds without
# running them. The schedule and a start by hand always run them, and test the newest
# release behind each floating tag nextcloud:<version>-apache instead of the pins, which
# gives notice of a break before the pull request of Renovate. When that run fails or
# reaches the time limit of its job, it opens the issue "A supported Nextcloud release
# breaks the app", with the versions that broke and the releases behind their images, or
# adds the run to it, and the next run that passes closes it. A pull request or a push
# never touches the issue; a version that breaks there fails the required check instead.
#
# Every Monday, and when started by hand, they also run against the coming Nextcloud
# (tests/e2e/canary.sh): the beta or release candidate of the next major version, or
# the daily build of master. That job is no required check and blocks nothing. When
# it fails or the weekly run reaches the time limit of its job, it opens the issue "The
# coming Nextcloud breaks the app", or adds the run to it, and closes the issue once
# the tests pass again. It leaves max-version as it is; the upstream bot raises it when
# Nextcloud releases the version.
#
# The job "paperless" checks the contract with a real Paperless-ngx
# (tests/e2e/paperless-contract.sh), for the last release of Paperless-ngx 2 and the
# newest release: the fields, dates, excerpts, pages and errors that the app relies on,
# the newest documents of the dashboard and the names of correspondents, document types
# and tags, directly and through Nextcloud, with the version of the API that the app asks
# for. It runs every Monday, when started by hand, and in a pull request that changes
# the app, appinfo/ or lib/, the mock of Paperless or the contract tests
# (tests/e2e/scope.sh with SCOPE=paperless); otherwise it passes in seconds. Its two
# jobs, "paperless (2)" and "paperless (3)", are required checks: they always run in a
# pull request, so auto-merge waits for the contract, and with about two minutes they
# end before the job "nextcloud" beside them, so they cost no time. A weekly run that
# fails or reaches the time limit of its job opens the issue "Paperless-ngx breaks the
# app", or adds the run to it, and the next run that passes closes it. Renovate brings
# every new release of Paperless-ngx as a pull request, which runs the contract against
# it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nextcloud:
    name: nextcloud
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # The versions that broke, for the issue of the weekly run (tests/e2e/run-all.sh).
      failed: ${{ steps.tests.outputs.failed }}
      # Their major versions alone, such as "34 35", for the command in the issue.
      versions: ${{ steps.tests.outputs.versions }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit of a pull request and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      # A skipped step leaves the job green, so that the required check passes without
      # the tests when no file they cover changed (tests/e2e/scope.sh).
      - name: Find out whether a file the tests cover changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash tests/e2e/scope.sh
      # The tests take about 12 GB of disk on main and 10 GB in a pull request: the
      # images of Nextcloud, of the mock and of the browser, and the files of each
      # Nextcloud (tests/e2e/README.md). Most runners of GitHub have far more free, but
      # some little more than that, and there a full disk failed a version with HTTP 507
      # (#290). On such a runner the step deletes toolchains of the image that the job
      # doesn't use, Android, .NET, Haskell and CodeQL; elsewhere it costs nothing.
      - name: Make room on a runner with a small disk
        if: steps.scope.outputs.run == 'true'
        run: |
          free_space() { df -Pm / | awk 'NR == 2 { print $4 }'; }
          free="$(free_space)"
          if [[ ! "${free}" =~ ^[0-9]+$ ]]; then
            echo "df names no free space of the disk, so the step leaves it as it is."
          elif ((free < 20480)); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            echo "The disk had $((free / 1024)) GB free, and has $(($(free_space) / 1024)) GB without the toolchains that the job doesn't use."
          else
            echo "The disk has $((free / 1024)) GB free, enough for the tests."
          fi
      - name: Run the end-to-end tests against every supported Nextcloud version
        id: tests
        if: steps.scope.outputs.run == 'true'
        env:
          # A pull request and a push test the images of tests/e2e/nextcloud-images.txt;
          # the weekly run and a start by hand the floating tags, as they are that day.
          E2E_IMAGES: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'pinned' || 'floating' }}
          # A pull request tests the search dialog on a phone only with the newest
          # Nextcloud, and on a laptop with every version; a push to main, the weekly
          # run and a start by hand test every size with every version (#108).
          E2E_PHONE: ${{ github.event_name == 'pull_request' && 'newest' || 'all' }}
          # Beside them, the upgrade from the last release to the checkout
          # (tests/e2e/upgrade.sh): in a pull request with the newest Nextcloud, and
          # everywhere else with every version (#242).
          E2E_UPGRADE: ${{ github.event_name == 'pull_request' && 'newest' || 'all' }}
          # The upgrade asks the API of GitHub for the last release and its assets with
          # it, which kept working when the pages of the releases failed requests without
          # a token (#346).
          GH_TOKEN: ${{ github.token }}
        run: bash tests/e2e/run-all.sh
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: nextcloud
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # Like the issue about the coming Nextcloud: it runs no code of the repository, and
  # only the weekly run and a run started by hand on main report. The schedule and a
  # start by hand always run the tests (tests/e2e/scope.sh), so a run that passes has
  # tested every version. When the flaky-test bot of after-checks.yml runs a failed
  # check once more, this job runs again with it, and closes the issue if the check
  # passes then.
  nextcloud-issue:
    name: issue about the supported Nextcloud
    needs: nextcloud
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (needs.nextcloud.result == 'success' || needs.nextcloud.result == 'failure' ||
        (github.event_name == 'schedule' && needs.nextcloud.result == 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of the
        # blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: A supported Nextcloud release breaks the app
          RESULT: ${{ needs.nextcloud.result }}
          FAILED: ${{ needs.nextcloud.outputs.failed }}
          VERSIONS: ${{ needs.nextcloud.outputs.versions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --reason completed \
                --comment "The end-to-end tests pass again against every supported Nextcloud version: $RUN_URL"
            fi
            exit 0
          fi
          # GitHub cancels a job that reaches its time limit, such as at a download of
          # an image that hangs; nothing else cancels the weekly run, whose group of
          # concurrency is its own. FAILED is empty when the job stopped before
          # run-all.sh tested a version, such as at an appinfo/info.xml without a range.
          if [[ "$RESULT" == cancelled ]]; then
            broken="run out of time or are cancelled before they end"
          elif [[ -n "${FAILED:-}" ]]; then
            broken="fail against $FAILED"
          else
            broken="stop before they test a version of Nextcloud"
          fi
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "The end-to-end tests still $broken: $RUN_URL"
            exit 0
          fi
          {
            printf 'The weekly end-to-end tests %s: %s\n\n' "$broken" "$RUN_URL"
            cat <<'TEXT'
          The required check `nextcloud` of `.github/workflows/e2e.yml` runs `tests/e2e/run-all.sh` every Monday, also in a week without a change of the app: the end-to-end tests against the current release behind each image `nextcloud:<version>-apache`, for every version from `min-version` to `max-version` of `appinfo/info.xml`. Most often a new release of Nextcloud behind one of these images broke the app or its tests; its users meet the same break. Pull requests keep testing the pins of `tests/e2e/nextcloud-images.txt`, and the pull request of Renovate that moves them to this release can't merge until the app is fixed. Test the fix with `E2E_IMAGES=floating`, against this release.

          The annotation of each version that broke names it; the group of the log named after the version, such as *Nextcloud 35 (failed, 312 s)*, shows the step that stopped and the logs of its containers, and the summary of the run the release of Nextcloud behind each image and its digest.

          TEXT
            if [[ -n "${VERSIONS:-}" ]]; then
              printf "\`E2E_IMAGES=floating E2E_VERSIONS=\"%s\" bash tests/e2e/run-all.sh\` runs the same tests locally with Docker, against the versions that broke.\n\n" "$VERSIONS"
            else
              printf "\`E2E_IMAGES=floating bash tests/e2e/run-all.sh\` runs the same tests locally with Docker; \`E2E_VERSIONS\` picks the versions, such as \`E2E_VERSIONS=35\`.\n\n"
            fi
            cat <<'TEXT'
          The job adds every further failed run here and closes this issue once the tests pass again against every supported version.
          TEXT
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  paperless:
    name: paperless (${{ matrix.paperless }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The line of Paperless-ngx, a profile of tests/e2e/compose.paperless.yaml.
        paperless: ["2", "3"]
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit of a pull request and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false
      - name: Find out whether a file the contract tests cover changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: paperless
        run: bash tests/e2e/scope.sh
      - name: Check the contract with Paperless-ngx ${{ matrix.paperless }}
        if: steps.scope.outputs.run == 'true'
        env:
          PAPERLESS: ${{ matrix.paperless }}
        run: bash tests/e2e/paperless-contract.sh
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "paperless (${{ matrix.paperless }})"
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # Like the issue about the coming Nextcloud: it runs no code of the repository, a run
  # started by hand on another branch than main reports nothing, and a cancelled job
  # reports in the weekly run alone.
  paperless-issue:
    name: issue about Paperless-ngx
    needs: paperless
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (needs.paperless.result == 'success' || needs.paperless.result == 'failure' ||
        (github.event_name == 'schedule' && needs.paperless.result == 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of the
        # blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Paperless-ngx breaks the app
          RESULT: ${{ needs.paperless.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --reason completed \
                --comment "The contract tests pass again against every line of Paperless-ngx: $RUN_URL"
            fi
            exit 0
          fi
          # GitHub cancels a job that reaches its time limit, such as at a download of
          # an image that hangs; nothing else cancels the weekly run, whose group of
          # concurrency is its own.
          if [[ "$RESULT" == cancelled ]]; then
            broken="run out of time against a real Paperless-ngx or are cancelled before they end"
          else
            broken="fail against a real Paperless-ngx"
          fi
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "The contract tests still $broken: $RUN_URL"
            exit 0
          fi
          {
            printf 'The weekly contract tests %s: %s\n\n' "$broken" "$RUN_URL"
            cat <<'TEXT'
          The job `paperless` of `.github/workflows/e2e.yml` runs `tests/e2e/paperless-contract.sh` against the last release of Paperless-ngx 2 and the newest release: it checks the fields, dates, excerpts, pages and errors of the API of Paperless that the app relies on, the newest documents of the dashboard and the names of correspondents, document types and tags, directly and through Nextcloud, and compares the mock with it. The summary of the run names the version of Paperless and the promise that it breaks, or each difference of the mock, such as a field of another type or another markup of the excerpt; users of that Paperless see the same in their search. A run that reaches the time limit of the job has no such summary, and its log ends at the step that hung.

          `PAPERLESS=2 bash tests/e2e/paperless-contract.sh` or `PAPERLESS=3 …` runs the same tests locally with Docker.

          The job adds every further failed run here and closes this issue once the tests pass again.
          TEXT
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  coming:
    name: coming Nextcloud
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.canary.outputs.version }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Paperless Unified Search end-to-end tests against the coming Nextcloud
        id: canary
        run: bash tests/e2e/canary.sh
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: coming Nextcloud
        run: python3 .github/blueprint.py coach explain "$CHECK"

  # Like every job that may write issues, it runs no code of the repository and reaches
  # no host but the API of GitHub, the only one that gh asks: Harden-Runner blocks every
  # other, and the job stops when Harden-Runner doesn't block, as in an outage of
  # GitHub. A run started by hand on another branch than main reports nothing. A
  # cancelled job reports in the weekly run alone, where it reached its time limit;
  # whoever starts a run by hand may cancel it. tests/e2e/selftest.sh runs the scripts
  # of these jobs with a fake gh and evaluates their conditions. The job ends within
  # seconds, so it waits at the end until Harden-Runner has removed Docker, or it would
  # hang until its time limit.
  coming-issue:
    name: issue about the coming Nextcloud
    needs: coming
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (needs.coming.result == 'success' || needs.coming.result == 'failure' ||
        (github.event_name == 'schedule' && needs.coming.result == 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134 of the
        # blueprint).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: The coming Nextcloud breaks the app
          RESULT: ${{ needs.coming.result }}
          VERSION: ${{ needs.coming.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          coming="${VERSION:-the coming Nextcloud}"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --reason completed \
                --comment "The end-to-end tests pass again against $coming: $RUN_URL"
            fi
            exit 0
          fi
          # GitHub cancels a job that reaches its time limit, such as at a download of
          # an image that hangs; nothing else cancels the weekly run, whose group of
          # concurrency is its own.
          if [[ "$RESULT" == cancelled ]]; then
            broken="run out of time against $coming or are cancelled before they end"
          else
            broken="fail against ${VERSION:-the coming Nextcloud, which the job could not set up}"
          fi
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "The end-to-end tests still $broken: $RUN_URL"
            exit 0
          fi
          {
            printf 'The weekly end-to-end tests %s: %s\n\n' "$broken" "$RUN_URL"
            cat <<'TEXT'
          The canary of `.github/workflows/e2e.yml` runs `tests/e2e/canary.sh`: the end-to-end tests against the beta or release candidate of the next major version of Nextcloud, or against the daily build of its master branch while there is none. Nextcloud hasn't released that version yet, so the canary is no required check and blocks nothing; it gives notice before the release, while there is time to adapt the app. `max-version` of `appinfo/info.xml` stays as it is; the upstream bot raises it once Nextcloud releases the version.

          The log of the run shows what failed, or ends at the step that hung when the run reached the time limit of the job; `bash tests/e2e/canary.sh` runs the same tests locally.

          The canary adds every further failed run here and closes this issue once the tests pass again.
          TEXT
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
