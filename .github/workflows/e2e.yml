name: Docker E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextcloud-version:
    name: Nextcloud ${{ matrix.nextcloud }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nextcloud: 33.0.8
            image: nextcloud:33.0.8-apache@sha256:995c90968685e5584891060ec10b3d4645c6c8bb1d2d2e78590113884101e8e0
          - nextcloud: 34.0.3
            image: nextcloud:34.0.3-apache@sha256:8e5f49801db0cf4659b3089ce1917728023bb8cba7f93731f2abbdfe3a18df0a
    env:
      NEXTCLOUD_IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Nextcloud Custom App end-to-end tests
        run: bash tests/e2e/run.sh

  nextcloud:
    name: nextcloud
    if: always()
    needs:
      - nextcloud-version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every supported Nextcloud version to pass
        run: test "${{ needs.nextcloud-version.result }}" = success
