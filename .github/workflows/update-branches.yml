name: Update branches

# The branch bot. main only takes pull requests that are up to date with it, and
# auto-merge doesn't update a branch by itself. So only one pull request can merge
# next, and each merge leaves the others behind again: bringing all of them up to date
# after every merge ran the checks of every waiting pull request for the one that
# merged. The bot keeps a line instead, the pull requests that wait for auto-merge in
# the order in which it was turned on, and brings only the first one up to date that
# can merge, as the release app, so that its checks run again and it merges once they
# pass. While its checks run, the others wait; its merge starts the next run, and so
# does a required check of it that fails for good, through the bots after the checks,
# which start this workflow then and only then: GitHub would create a run here after
# the end of every check, which skipped in all but a few (decision 0151). Turning
# auto-merge on starts one at once. A pull request whose required check failed waits
# for a fix and leaves its place to the next one. One that conflicts with main gets
# the label merge-conflict and one comment. The label goes once it no longer
# conflicts; the comment stays for the history, so a later conflict brings back only
# the label. One of a bot that builds its branch anew from main, the screenshot bot,
# the picture bot or the issue assistant sync, gets the label and no comment, and the
# bot starts the workflow of that bot once for each conflict (decision 0118). A
# request that GitHub refuses is a warning about that pull request, and the bot goes
# on with the next one. The release bot keeps its own pull request current. Renovate's
# pull requests take their place in the line as well, which spares them the wait for
# its next run: Renovate commits as the release app too, so it still takes the branch
# for its own; one that conflicts with main it builds anew itself. A pull request from
# a fork takes its place as well, once its author allows edits by maintainers; without
# that, or with a commit that the rules of main refuse for its signature, it waits
# outside the line, and the summary says so. GitHub holds the runs of each new head of
# a fork for an approval, so such a head isn't in flight: it waits for a person and
# leaves its place to the next one, and the bot doesn't update it again until someone
# approved. Only a head that the bot made itself, on top of commits that a person
# approved, gets its runs approved by the bot, in the summary of the run, since
# nothing new from the fork runs then (decision 0099). Every merge leaves the runs of
# its pull request behind, and every update the runs of the commit that it replaced:
# after the line, the bot cancels those that no open pull request has as its head any
# more, as this job runs anyway (decision 0108).
# The bot checks out main alone, for blueprint.py, which holds the logic, and runs
# nothing of a pull request. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  # Turning auto-merge on gives a pull request its place in the line at once, and
  # turning it off moves the line on.
  # GitHub blocks the event in a public repository unless the event policy of the
  # settings allows it, which it does for each workflow that pull_request_target of
  # [actions] in .github/repository.toml lists (decision 0138).
  pull_request_target:
    types: [auto_merge_enabled, auto_merge_disabled]
  # The schedule is only a safety net, for an event that GitHub lost and a pull
  # request whose fix passed its checks: every merge into main is a push of the
  # release app or of a person, and GitHub runs schedules as it can, often hours late.
  schedule:
    - cron: "42 */6 * * *"
  # By hand, and by the bots after the checks when a required check of a pull request
  # failed for good, which moves the line on to the next pull request: they name the
  # run of that check, and the bot first asks whether GitHub started it.
  workflow_dispatch:
    inputs:
      after:
        description: The run of a check of a pull request that failed for good and moves the line on, if one did
        type: string
        default: ""
      attempt:
        description: The attempt of that run
        type: string
        default: ""

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  update:
    name: update branches
    # Pull requests into main, also from forks. A fork's event only starts the bot,
    # which reads the line from the API and runs nothing of the pull request; the job
    # after the checks that starts it decides which failed checks move the line on.
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'pull_request_target' ||
        github.event.pull_request.base.ref == github.event.repository.default_branch)
    # On the job, so that a run whose job skips, as for a pull request into another
    # branch, cancels no run that updates.
    concurrency:
      group: update-branches
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    # Every event of the workflow runs on main, pull_request_target too.
    environment:
      name: release
      deployment: false
    # Actions for the runs of the pull requests: the token of the job reads them, approves
    # those of a fork that the bot may approve, cancels those of a replaced commit,
    # starts the next run of the bot and the workflow of a bot whose pull request
    # conflicts, so that the release app needs no right for it. The
    # pull requests for their heads, which those runs of a replaced commit don't have.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the branch bot
          TASK: bring a pull request that waits for auto-merge up to date
          WITHOUT: every pull request stays as it is
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py app register\` registers the app, sets its private key and opens the pull request that names it in \`.github/repository.toml\`; \`python3 .github/blueprint.py checklist\` shows what is left, such as its installation and the settings. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the update of a branch, its label and its comment need, and
          # reading the checks and the statuses of the pull requests in the line. The
          # update merges main into the branch, and GitHub takes that merge only from
          # a token that may change workflows once main changed one since the branch
          # left it; the job runs nothing of the pull request.
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
      # The default branch, also for pull_request_target, without the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app.outputs.token != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Bring the next pull request that waits for auto-merge up to date
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          # The account whose merges are the updates of the bot.
          BOT_ACCOUNT: ${{ steps.app.outputs.app-slug }}[bot]
          # The run of a check whose end started the bot, if one did.
          AFTER: ${{ inputs.after }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          # A run for auto-merge shows as a check of that pull request, and the bot
          # health bot ignores such runs: what GitHub refuses is a warning there, which
          # the next run, after a merge or on the schedule, reports again.
          only=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            only=(--warnings-only)
          fi
          # A check that GitHub couldn't start, as in its outage of 9 November 2026,
          # failed for no pull request: the line stays as it is (decision 0136).
          after=()
          if [[ -n "$AFTER" ]]; then
            after=(--after "$AFTER" --attempt "${ATTEMPT:-1}")
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" next-branch "${only[@]}" "${after[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
