name: Update branches

# The branch bot. main only takes pull requests that are up to date with it, and
# auto-merge doesn't update a branch by itself. So only one pull request can merge
# next, and each merge leaves the others behind again: bringing all of them up to
# date after every merge ran the checks of every waiting pull request for the one
# that merged. The bot keeps a line instead, the pull requests that wait for
# auto-merge in the order in which it was turned on, and brings only the first one up
# to date that can merge, as the release app, so that its checks run again and it
# merges once they pass. While its checks run, the others wait; its merge, or a
# required check of it that fails, starts the next run, and turning auto-merge on
# starts one at once. A pull request whose required check failed waits for a fix and
# leaves its place to the next one. One that conflicts with main gets the label
# merge-conflict and one comment. The label goes once it no longer conflicts; the
# comment stays for the history, so a later conflict brings back only the label. A
# request that GitHub refuses is a warning about that pull request, and the bot goes
# on with the next one. The release bot keeps its own pull request current.
# Renovate's pull requests take their place in the line as well, which spares them
# the wait for its next run: Renovate commits as the release app too, so it still
# takes the branch for its own; one that conflicts with main it builds anew itself.
# The bot checks out main alone, for blueprint.py, which holds the logic, and runs
# nothing of a pull request. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  # Turning auto-merge on gives a pull request its place in the line at once, and
  # turning it off moves the line on.
  pull_request_target:
    types: [auto_merge_enabled, auto_merge_disabled]
  # A required check that fails moves the line on to the next pull request.
  workflow_run:
    # The checks of this repository, its end-to-end tests if a workflow of its own named Docker E2E runs them,
    # and the workflows of its other tests that the answer test_workflows of the blueprint names.
    # Then those of the other required checks and of the scanners, the same in every repository, and Renovate for the check of its rules where it runs in the repository.
    workflows: [CI (php), Docker E2E, Demo, Visual check, CodeQL, Dependency review, Docs, Lint, Pull request title, Secret scan, Fuzzing, Links, OSV-Scanner, Workflow security]
    types: [completed]
  # The schedule is only a safety net, for an event that GitHub lost and a pull
  # request whose fix passed its checks: every merge into main is a push of the
  # release app or of a person, and GitHub runs schedules as it can, often hours late.
  schedule:
    - cron: "42 */6 * * *"
  workflow_dispatch:

permissions: {}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  update:
    name: update branches
    # Pull requests of this repository into main, and the failures of their checks,
    # also of those that run on pull_request_target, such as the title's. Should a
    # fork's failure start the bot that way, it only reads the line, which leaves
    # forks out. The bots after the checks run a failed test once more: only a failure that
    # stays, at the second attempt, moves the line on; the other checks fail the same
    # way again and move it on at once.
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == github.event.repository.default_branch)) &&
      (github.event_name != 'workflow_run' ||
        (contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event) &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) &&
          (github.event.workflow_run.conclusion != 'failure' ||
            github.event.workflow_run.run_attempt > 1 ||
            contains(fromJSON('["CodeQL", "Dependency review", "Docs", "Lint", "Pull request title", "Secret scan", "Fuzzing", "Links", "OSV-Scanner", "Workflow security"]'), github.event.workflow_run.name))))
    # On the job, so that a run whose job skips, as after checks that passed, cancels
    # no run that updates.
    concurrency:
      group: update-branches
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    # Every event of the workflow runs on main, pull_request_target and workflow_run too.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the branch bot
          TASK: bring a pull request that waits for auto-merge up to date
          WITHOUT: every pull request stays as it is
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py app register\` registers the app, sets its private key and opens the pull request that names it in \`.github/repository.toml\`; \`python3 .github/blueprint.py checklist\` shows what is left, such as its installation and the settings. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the update of a branch, its label and its comment need, and
          # reading the checks and the statuses of the pull requests in the line. The
          # update merges main into the branch, and GitHub takes that merge only from
          # a token that may change workflows once main changed one since the branch
          # left it; the job runs nothing of the pull request.
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write
      # The default branch, also for pull_request_target, without the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app.outputs.token != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Bring the next pull request that waits for auto-merge up to date
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          # A run for auto-merge shows as a check of that pull request, and the bot
          # health bot ignores such runs: what GitHub refuses is a warning there, which
          # the next run, after a merge or on the schedule, reports again.
          only=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            only=(--warnings-only)
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" next-branch "${only[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
