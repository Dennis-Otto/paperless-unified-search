name: Dependabot maintenance

# Routine updates merge on their own once every required check passes; a major
# update waits for the maintainer. Updates of runtime dependencies are committed as
# fix(deps) and so lead to a patch release (see release.yml).

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    name: Queue verified routine update
    if: >-
      !github.event.repository.fork &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Actions pinned to a commit of their default branch instead of a release.
      # Dependabot moves such a pin from commit to commit, reports the update as
      # major and skips the cooldown. Both only start the current image of HACS and
      # hassfest, so their commit updates merge like patch updates.
      COMMIT_PINNED_ACTIONS: '["hacs/action", "home-assistant/actions/hassfest"]'
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Do not check out or execute pull request code in this privileged workflow.
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable automatic squash merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"

      - name: Enable automatic squash merge for commit updates of listed actions
        # One listed action per pull request; a group or a real release still needs
        # the maintainer.
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          contains(fromJSON(env.COMMIT_PINNED_ACTIONS), steps.metadata.outputs.dependency-names)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          commit='^[0-9a-f]{40}$'
          if [[ ! $PREVIOUS_VERSION =~ $commit || ! $NEW_VERSION =~ $commit ]]; then
            echo "Not a commit-to-commit update; the maintainer merges it."
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
