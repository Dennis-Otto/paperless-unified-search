name: SBOM

# A software bill of materials of the whole repository in SPDX, every week, with the
# tools of its checks, its website and its workflows, as an artifact of the run. A
# release carries the SBOMs of what it ships instead (build-release.yml), which its
# users' scanners read. Not for every change: no pull request reads it, and the
# dependency review checks what a pull request brings in.

on:
  schedule:
    - cron: "47 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        # The repository at its commit, by name, rather than the folder ".".
        env:
          SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
          SYFT_SOURCE_VERSION: ${{ github.sha }}
        with:
          path: .
          format: spdx-json
          artifact-name: ${{ github.event.repository.name }}.spdx.json
          output-file: ${{ github.event.repository.name }}.spdx.json
          upload-release-assets: false
          syft-version: v1.52.0
