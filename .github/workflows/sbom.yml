name: SBOM

# A software bill of materials of the whole repository in SPDX, every week, with the
# tools of its checks, its website and its workflows, as an artifact of the run. A
# release carries the SBOMs of what it ships instead (build-release.yml), which its
# users' scanners read. Not for every change: no pull request reads it, and the
# dependency review checks what a pull request brings in.

on:
  schedule:
    - cron: "20 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# The GitHub CLI of the download sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The syft of the SBOMs of a release (build-release.yml).
      # renovate: datasource=github-releases depName=anchore/syft extractVersion=^v(?<version>.+)$
      SBOM_SYFT_VERSION: 1.55.0
      SBOM_SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # syft from its release, through the API with the token of the job, which
      # survives an outage of GitHub's downloads without a token, and checked by its
      # sha256 (decision 0133), in place of an action that runs an installer from
      # raw.githubusercontent.com, which downloads syft without a token.
      - name: Download syft
        # Room for one more try of a download that hung.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/download.sh anchore/syft "v$SBOM_SYFT_VERSION" \
            "syft_${SBOM_SYFT_VERSION}_linux_amd64.tar.gz" "$RUNNER_TEMP/syft.tar.gz" "$SBOM_SYFT_SHA256"
          mkdir -p "$RUNNER_TEMP/syft"
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP/syft" syft
      - name: Generate the SPDX SBOM
        timeout-minutes: 5
        # The repository at its commit, by name, rather than the folder ".".
        env:
          SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
          SYFT_SOURCE_VERSION: ${{ github.sha }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          "$RUNNER_TEMP/syft/syft" scan dir:. --quiet \
            --output "spdx-json=$RUNNER_TEMP/$SYFT_SOURCE_NAME.spdx.json"
      - name: Keep the SBOM as an artifact of the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}.spdx.json
          path: ${{ runner.temp }}/${{ github.event.repository.name }}.spdx.json
          if-no-files-found: error
