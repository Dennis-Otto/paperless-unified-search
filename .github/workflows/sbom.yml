name: SBOM

# A software bill of materials of the repository in SPDX, every week; the release
# workflow attaches one to each release. Not for every change: no pull request reads
# it, and the dependency review checks what a pull request brings in.

on:
  schedule:
    - cron: "47 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: ${{ github.event.repository.name }}.spdx.json
          output-file: ${{ github.event.repository.name }}.spdx.json
          upload-release-assets: false
          syft-version: v1.52.0
