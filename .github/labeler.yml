# The area labels of pull requests by the files they change, for the Area labels
# workflow; each label is an area of .github/labels.toml.
"area: settings":
  - changed-files:
      - any-glob-to-any-file:
          - lib/Controller/SettingsController.php
          - lib/Settings/**
          - lib/Service/ConfigService.php
          - lib/Model/PublicConfig.php
          - js/settings.js
          - css/settings.css
          - templates/settings.php
          - tests/Unit/Controller/**
"area: search":
  - changed-files:
      - any-glob-to-any-file:
          - lib/Search/**
          - lib/Service/PaperlessApiService.php
          - tests/Unit/Search/**
"area: files":
  - changed-files:
      - any-glob-to-any-file:
          - lib/Service/NextcloudFileLocator.php
          - tests/Unit/Service/NextcloudFileLocator*
