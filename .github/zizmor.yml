# Findings of zizmor (the Workflow security workflow) that the blueprint accepts on
# purpose, each with its reason. Everything else is reported to code scanning, where
# the Findings workflow keeps it fixed or accepted.
# https://github.com/Dennis-Otto/repo-blueprint
rules:
  secrets-inherit:
    ignore:
      # The isolated build of a release signs a Nextcloud app with the key of the
      # environment release, which a called workflow sees only with the secrets of
      # its caller; the build is a workflow of this repository.
      - release.yml
  dangerous-triggers:
    ignore:
      # These workflows start on pull_request_target or workflow_run so that they
      # may write, and never check out or run the code of a pull request: they read
      # its title, labels or metadata only. The changelog check also reads the
      # fragments of the changelog that a pull request adds, as text, with
      # blueprint.py of the default branch.
      - pull-request-title.yml
      - area-labels.yml
      - welcome.yml
      - dependabot-automerge.yml
      # After the checks, the flaky-test bot only runs failed jobs again and writes an
      # issue, the bot for cancelled checks only runs cancelled runs again, the bot for
      # failed releases only runs the failed jobs of a release again, the PR coach
      # reads the check runs, the files of the pull request and its list of artifacts
      # from the API and, with actions: read, downloads the coverage reports of the
      # head and of main, also those that a fork's run kept, which it parses only as
      # data; it runs no code of the pull request, has only the explanations and
      # blueprint.py of the default branch checked out, and writes one comment. The
      # diagram bot checks out main alone,
      # whose blueprint.py takes only the sources, SVG pictures and pages of Markdown
      # of an artifact, and commits them onto the branch of a pull request of this
      # repository.
      - after-checks.yml
      # The rollout starts after a run of the Release workflow on main; it reads the
      # jobs of that run, the latest release, the repositories of the release app and
      # the checks of their update pull requests, and checks out nothing.
      - rollout.yml
      # The screenshot bot, and the picture bot of the blueprint, start after a run
      # of the Release workflow that the merge of a release pull request on main
      # made, never for a pull request: they check out main, run its script with a
      # token that only reads and without secrets, and the job with the release app
      # runs nothing of it, but takes only pictures of its artifact with
      # blueprint.py of main.
      - screenshot-bot.yml
      - docs-pictures.yml
      # The workflow Chrome Web Store of a Chrome extension starts after a run of the
      # Release workflow on main and delivers its latest release: it checks out main
      # alone, never for a pull request, and uploads only the zip that the isolated
      # build attached to the release, after it checked its provenance.
      - publish-store.yml
      # The bot-health bot starts after the runs of the bots and acts only on those of
      # the default branch: it runs their failed jobs again, reads their jobs and
      # annotations and writes issues, and checks out only the default branch.
      - bot-health.yml
      # The branch bot starts when auto-merge of a pull request is turned on or off and
      # when a check of a pull request fails, also one that runs on pull_request_target
      # such as the title's, which may be a fork's; it checks out only the default branch,
      # whose blueprint.py reads the pull requests and their checks from the API and
      # merges the default branch into one of them through the API.
      - update-branches.yml
      # The issue assistant's templates, which its check keeps equal to the action's.
      # The issue assistant starts on issue_comment so that it may answer a new
      # comment, which it reads only as text: it checks out only the default branch
      # and the action at the commit of its release, never the code of a pull
      # request; event and apply run no AI, analyze runs the engine with a token
      # that only reads and read-only tools on the egress-firewall runner, and apply
      # checks the engine's answer before it writes labels or one comment.
      - issue-assistant.yml
      - findings.yml
      - issue-lifecycle.yml
  self-repository:
    ignore:
      # The test run of the action uses it the way its documentation shows, ./
      - action-test.yml
      # The release workflow calls the release verification, and the Next runner
      # workflow the Variants, with ./, because actionlint doesn't know the
      # self-repository syntax $/ yet.
      - release.yml
      - next-runner.yml
