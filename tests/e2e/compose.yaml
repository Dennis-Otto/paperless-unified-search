services:
  paperless-mock:
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    command: ["python", "/mock/mock_server.py"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/mock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:33.0.9-apache@sha256:20f6a191aebfe8e0b9096775cd1d82f297ee996111932380aaac9a3538b971e4}
    depends_on:
      paperless-mock:
        condition: service_healthy
    environment:
      NEXTCLOUD_ADMIN_USER: e2e-admin
      NEXTCLOUD_ADMIN_PASSWORD: e2e-only-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    ports:
      - "${E2E_PORT:-18082}:80"
    volumes:
      - nextcloud_html:/var/www/html
      - ../../:/var/www/html/custom_apps/paperless_unified_search:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/status.php >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  nextcloud_html:
