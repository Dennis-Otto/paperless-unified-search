services:
  paperless-mock:
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    command: ["python", "/mock/mock_server.py"]
    # A tiny init as process 1 passes on the signal to stop, which Python as process 1
    # would ignore until Docker kills it after ten seconds.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/mock:ro
    networks:
      default:
        aliases:
          # Another server for Nextcloud, which may not receive the stored token unasked.
          - other-host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:33.0.9-apache@sha256:a97666d6ae931bde78a80cfba8abdf46d436d7b540f31895803f6fb0a012d689}
    depends_on:
      paperless-mock:
        condition: service_healthy
    environment:
      NEXTCLOUD_ADMIN_USER: e2e-admin
      NEXTCLOUD_ADMIN_PASSWORD: e2e-only-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      # Nextcloud keeps allow_local_remote_servers of config.php off, as by default: the
      # app reaches the mock in the network of the project through its own switch for
      # the local network, which the tests turn on in the settings.
    ports:
      - "${E2E_PORT:-18082}:80"
    volumes:
      - nextcloud_html:/var/www/html
      # The checkout as the app, read-only. upgrade.sh mounts it where Nextcloud looks
      # for no app, /opt/checkout, since it installs a release in this place first and
      # then replaces it with the package of the checkout, as an update does.
      - ../../:${E2E_APP_PATH:-/var/www/html/custom_apps/paperless_unified_search}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/status.php >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  nextcloud_html:
